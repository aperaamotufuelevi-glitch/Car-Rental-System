<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Rental System</title>
<style>
:root{
  --bg:#f2f4f6;--card:#fff;--ink:#1c2631;--mute:#5d6a77;--line:#dbe1e7;--soft:#f7f9fa;
  --brand:#0e5a6b;--brand-d:#0a4552;--brand-l:#e3f1f4;--accent:#d9822b;
  --ok:#1d7a4c;--ok-l:#e3f4ea;--warn:#a86a10;--warn-l:#fdf2dc;--bad:#b83227;--bad-l:#fbe6e4;
  --r:10px;--sh:0 1px 2px rgba(16,30,45,.06),0 2px 8px rgba(16,30,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar */
.side{background:#0c2a33;color:#cfe0e5;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brandbox{display:flex;gap:10px;align-items:center;padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brandbox img{width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff}
.brandbox .lg{width:38px;height:38px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700}
.brandbox b{display:block;color:#fff;font-size:14px;line-height:1.2}
.brandbox small{color:#8fb0b9;font-size:11px}
.nav{padding:8px 8px 16px;flex:1}
.nav .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7c9aa3;margin:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:#cfe0e5;text-decoration:none;cursor:pointer;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--brand);color:#fff}
.nav a .n{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;border-radius:9px;padding:0 6px}
.side .foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#8fb0b9}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;font-weight:650}
.top .sp{flex:1}
.menu-btn{display:none}
.page{padding:20px 22px 60px;max-width:1400px}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3{font-size:13.5px;margin:14px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi small{color:var(--mute);font-size:12px}.kpi b{display:block;font-size:22px;margin-top:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:550}
label.f.req>span::after{content:" *";color:var(--bad)}
input,select,textarea{border:1px solid #c9d2db;border-radius:7px;padding:7px 9px;background:#fff;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9fd0db;border-color:var(--brand)}
input[type=checkbox],input[type=radio]{width:auto}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);font-weight:400}
.btn{border:1px solid #c3ccd5;background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:#e5b1ab;color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.lg{padding:11px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--soft);font-weight:600}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#f5fafb}
.tbl{overflow-x:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:#eef1f4;color:#44515e}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.b{background:var(--brand-l);color:var(--brand)}
.muted{color:var(--mute)}.small{font-size:12px}
.empty{padding:22px;text-align:center;color:var(--mute)}
.note{background:var(--brand-l);border:1px solid #c6e2e8;padding:9px 12px;border-radius:8px;font-size:13px;color:#174c58}
.alert{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:8px}
.alert.bad{background:var(--bad-l);color:var(--bad)}.alert.warn{background:var(--warn-l);color:var(--warn)}.alert.ok{background:var(--ok-l);color:var(--ok)}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.checks li .i{width:18px;font-weight:700}
.checks li.ok .i{color:var(--ok)}.checks li.no .i{color:var(--bad)}.checks li.wa .i{color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);font-weight:550}
.tabs a.on{border-color:var(--brand);color:var(--brand)}
.sumline{display:flex;justify-content:space-between;padding:3px 0}
.sumline.t{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:700;font-size:15px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos div{position:relative}
.photos img{width:92px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.photos button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;cursor:pointer;font-size:11px}
.sig{border:1px dashed #9aa8b5;border-radius:8px;background:#fff;touch-action:none;width:100%;height:120px;display:block}
.cardiag{width:100%;max-width:260px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:crosshair}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:1050px}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:16px 18px;max-height:72vh;overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
#toast{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:6px}
#toast div{background:#1c2631;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:var(--sh);font-size:13px}
#toast div.bad{background:var(--bad)}#toast div.ok{background:var(--ok)}
/* calendar */
.cal{overflow-x:auto}
.cal table{table-layout:fixed;min-width:900px}
.cal td,.cal th{padding:0;height:34px;border:1px solid var(--line);font-size:11px;text-align:center}
.cal th.v,.cal td.v{width:180px;text-align:left;padding:4px 8px;font-size:12px;background:#fff}
.cal td.c{cursor:pointer}.cal td.c:hover{background:#eef7f9}
.cal td.res{background:#cfe6ff}.cal td.out{background:#ffd9a8}.cal td.mnt{background:#e2e2e2}.cal td.inq{background:#e9e1fb}
.cal th.today{background:#fff3cf}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 330px;gap:14px;align-items:start}
.pos .card{margin:0}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--soft);cursor:pointer;text-align:left}
.item:hover{border-color:var(--brand);background:var(--brand-l)}
.item b{display:block;font-size:13px}.item span{font-size:12px;color:var(--mute)}
.bal{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:center;cursor:pointer;background:#fff}
.bal:hover{border-color:var(--brand)}
.bal .a{margin-left:auto;font-weight:700}
.cart td{padding:6px 5px}
.cart input{padding:4px 6px}
.tot{font-size:30px;font-weight:750;text-align:right;color:var(--brand-d)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{padding:11px 0;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.keypad button:hover{background:var(--soft)}
.tender{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tender button{padding:9px 4px;border:1px solid #c3ccd5;border-radius:7px;background:#fff;cursor:pointer;font-weight:600;font-size:12.5px}
.tender button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;min-width:60px;padding:7px 4px;border:1px solid #c3ccd5;border-radius:7px;background:#fff;cursor:pointer;font-weight:600}
.change{background:var(--ok-l);border:1px solid #b7dfc7;color:var(--ok);border-radius:10px;padding:12px;text-align:center}
.change b{display:block;font-size:30px}
.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.denoms div{background:#fff;border:1px solid #b7dfc7;border-radius:6px;padding:4px;text-align:center;color:var(--ink)}
.cnt{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.cnt label{display:grid;grid-template-columns:70px 1fr 80px;align-items:center;gap:6px;font-size:13px}
/* booking kiosk */
#kiosk{position:fixed;inset:0;background:linear-gradient(160deg,#0e5a6b,#0b3540);z-index:150;overflow-y:auto;display:none;padding:30px 14px}
#kiosk .k{max-width:640px;margin:0 auto;background:#fff;border-radius:14px;padding:24px}
.logo-prev{width:110px;height:110px;border:1px dashed #b9c4ce;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#fff}
.logo-prev img{max-width:100%;max-height:100%}
@media (max-width:1100px){.pos{grid-template-columns:1fr 1fr}.pos .pay{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;width:236px;z-index:120;transition:left .2s}
  .side.open{left:0}
  .menu-btn{display:inline-block}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .pos{grid-template-columns:1fr}
  .page{padding:14px 12px 60px}
}

/* ---- sign-in, workspace and people screens ---- */
[hidden]{display:none!important}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#0e5a6b,#0b3540);overflow-y:auto;padding:30px 14px;z-index:140}
.lock .lk{max-width:440px;margin:6vh auto 0;background:#fff;border-radius:14px;padding:26px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.lk-lg{width:60px;height:60px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;margin:0 auto}
.top{flex-wrap:wrap}
.userchip{display:flex;flex-direction:column;line-height:1.2;padding:2px 10px;border-left:1px solid var(--line);cursor:pointer;max-width:230px}
.userchip b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.split>.card{margin:0}
.jd-item{padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.jd-item:hover{background:var(--soft)}.jd-item.on{background:var(--brand-l);border-color:#c6e2e8}
ol.dl{margin:4px 0 0 20px;padding:0}ol.dl li{margin:3px 0}
.mw-tiles{display:flex;flex-wrap:wrap;gap:8px}
.tree{overflow-x:auto;padding-bottom:6px}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{margin-left:18px;padding-left:18px;border-left:1px solid #a9bcc4}
.tree li{position:relative;margin:8px 0}
.tree ul ul>li::before{content:"";position:absolute;left:-18px;top:22px;width:16px;border-top:1px solid #a9bcc4}
.node{display:inline-block;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:6px 10px;cursor:pointer;min-width:220px;box-shadow:var(--sh)}
.node:hover{background:var(--brand-l)}
#adminBtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.matrix th.vt{height:150px;vertical-align:bottom;padding:4px 2px;text-align:center}.matrix th.vt span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:11px;text-transform:none;letter-spacing:0}.matrix td.c{text-align:center;padding:4px 2px}
@media (max-width:860px){.split{grid-template-columns:1fr}.userchip{display:none}}
</style>
</head>
<body>
<!-- ================= SIGN-IN SCREEN (staff PIN, first-time owner setup) ================= -->
<section id="lock" class="lock" aria-label="Staff sign-in"><div class="lk" id="lock-card"></div></section>

<!-- ================= STAFF APPLICATION ================= -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brandbox" id="brandbox"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><a class="btn sm" style="width:100%;background:transparent;color:#cfe0e5;border-color:#2e5560" onclick="openKiosk()">Customer Booking Page</a><div style="margin-top:8px" id="saveState">Saved on this device</div></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn sm menu-btn" onclick="document.getElementById('side').classList.toggle('open')">Menu</button>
      <h1 id="title">My Work</h1>
      <div class="sp"></div>
      <span class="muted small" id="clock"></span>
      <button class="btn sm p" id="posBtn" onclick="go('pos')">Open POS</button>
      <button class="btn sm" id="adminBtn" hidden onclick="go('admin')">Admin</button>
      <div class="userchip" id="userChip" onclick="go('mywork')" title="My Work"></div>
      <button class="btn sm" onclick="lockNow()">Lock</button>
    </header>
    <main class="page" id="modules">
      <!-- Each screen is its own module section. Content is drawn from the database when the screen opens. -->
      <section class="module" id="mod-mywork" data-module="mywork" aria-label="My Work" hidden></section>
      <section class="module" id="mod-dashboard" data-module="dashboard" aria-label="Dashboard" hidden></section>
      <section class="module" id="mod-calendar" data-module="calendar" aria-label="Availability Calendar" hidden></section>
      <section class="module" id="mod-reservations" data-module="reservations" aria-label="Reservations" hidden></section>
      <section class="module" id="mod-checkout" data-module="checkout" aria-label="Check-Out" hidden></section>
      <section class="module" id="mod-checkin" data-module="checkin" aria-label="Check-In" hidden></section>
      <section class="module" id="mod-customers" data-module="customers" aria-label="Customers & Drivers" hidden></section>
      <section class="module" id="mod-pos" data-module="pos" aria-label="Point of Sale (POS)" hidden></section>
      <section class="module" id="mod-payments" data-module="payments" aria-label="Payments" hidden></section>
      <section class="module" id="mod-plans" data-module="plans" aria-label="Payment Plans" hidden></section>
      <section class="module" id="mod-invoices" data-module="invoices" aria-label="Invoices & Receipts" hidden></section>
      <section class="module" id="mod-fleet" data-module="fleet" aria-label="Fleet" hidden></section>
      <section class="module" id="mod-rates" data-module="rates" aria-label="Rates & Pricing" hidden></section>
      <section class="module" id="mod-damage" data-module="damage" aria-label="Damage & Claims" hidden></section>
      <section class="module" id="mod-maint" data-module="maint" aria-label="Maintenance" hidden></section>
      <section class="module" id="mod-compliance" data-module="compliance" aria-label="Compliance" hidden></section>
      <section class="module" id="mod-reports" data-module="reports" aria-label="Reports" hidden></section>
      <section class="module" id="mod-documents" data-module="documents" aria-label="Documents & Templates" hidden></section>
      <section class="module" id="mod-orgdash" data-module="orgdash" aria-label="People Dashboard" hidden></section>
      <section class="module" id="mod-departments" data-module="departments" aria-label="Departments" hidden></section>
      <section class="module" id="mod-jobtitles" data-module="jobtitles" aria-label="Job Titles" hidden></section>
      <section class="module" id="mod-jobdesc" data-module="jobdesc" aria-label="Job Descriptions" hidden></section>
      <section class="module" id="mod-dutyresp" data-module="dutyresp" aria-label="Duties & Responsibilities" hidden></section>
      <section class="module" id="mod-skills" data-module="skills" aria-label="Employee Skills" hidden></section>
      <section class="module" id="mod-orgchart" data-module="orgchart" aria-label="Organizational Structure" hidden></section>
      <section class="module" id="mod-staffing" data-module="staffing" aria-label="Staffing Recommendations" hidden></section>
      <section class="module" id="mod-employees" data-module="employees" aria-label="Employees" hidden></section>
      <section class="module" id="mod-assignments" data-module="assignments" aria-label="Employee Assignments" hidden></section>
      <section class="module" id="mod-peoplereports" data-module="peoplereports" aria-label="People Reports" hidden></section>
      <section class="module" id="mod-admin" data-module="admin" aria-label="Admin Console" hidden></section>
      <section class="module" id="mod-settings" data-module="settings" aria-label="Settings" hidden></section>
    </main>
  </div>
</div>
<div id="modals"></div>
<div id="toast"></div>
<!-- ================= CUSTOMER BOOKING PAGE (opens over everything; no sign-in needed) ================= -->
<div id="kiosk"></div>
<iframe id="printFrame" style="position:fixed;width:0;height:0;border:0;right:0;bottom:0" title="print"></iframe>
<script id="js-core-utilities">
/* ============================================================
   CAR RENTAL SYSTEM — American Samoa
   Single file. Data saved on this device (IndexedDB).
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)||0)*100)/100;
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
function isoDate(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function isoDT(d=new Date()){return `${isoDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
const today=()=>isoDate();
function fmtD(s){if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length<3?s:`${p[1]}/${p[2]}/${p[0]}`}
function fmtDT(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return s;let h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return `${fmtD(isoDate(d))} ${h}:${pad(d.getMinutes())} ${ap}`}
function daysBetween(a,b){return Math.round((new Date(String(b).slice(0,10)+'T00:00')-new Date(String(a).slice(0,10)+'T00:00'))/864e5)}
function addDays(s,n){const d=new Date(String(s).slice(0,10)+'T00:00');d.setDate(d.getDate()+n);return isoDate(d)}
function ageOn(dob,on=today()){if(!dob)return null;const b=new Date(dob+'T00:00'),o=new Date(on.slice(0,10)+'T00:00');let a=o.getFullYear()-b.getFullYear();if(o.getMonth()<b.getMonth()||(o.getMonth()===b.getMonth()&&o.getDate()<b.getDate()))a--;return a}
</script>

<script id="js-data-layer">
/* ================= DATA LAYER =================
   Every record type is kept in its own database store (one row per record, keyed by its ID).
   Screens never hold data of their own — they read and write through S and this layer. */
const DBN='CarRentalSystemDB',DBV=2,KV='kv';
const COLLECTIONS=['customers','vehicles','reservations','agreements','payments','plans','damages','maintenance','vault','templates','sales','shifts','held','letters',
  'departments','deptResponsibilities','jobTitles','duties','responsibilities','skills','jobSkills','employees','employeeSkills','assignments','audit'];
let _db=null;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,DBV);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(KV))db.createObjectStore(KV);COLLECTIONS.forEach(c=>{if(!db.objectStoreNames.contains(c))db.createObjectStore(c,{keyPath:'id'})})};
    r.onsuccess=()=>{_db=r.result;_db.onversionchange=()=>{_db.close();_db=null};res(_db)};
    r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('Database is open in another tab'));
  });
}
const reqP=q=>new Promise(res=>{q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});
async function loadState(){
  try{
    const db=await idb();const t=db.transaction([KV,...COLLECTIONS]);const kv=t.objectStore(KV);
    const keys=['settings','legacy',...COLLECTIONS];
    const vals=await Promise.all([reqP(kv.get('settings')),reqP(kv.get('state')),...COLLECTIONS.map(c=>reqP(t.objectStore(c).getAll()))]);
    const R={};keys.forEach((k,i)=>R[k]=vals[i]);
    if(!R.settings)return R.legacy||null; /* older single-save layout is moved into separate stores on the next save */
    const out={settings:R.settings};
    COLLECTIONS.forEach(c=>{const rows=(R[c]||[]).slice();rows.sort((a,b)=>(a._seq??0)-(b._seq??0));rows.forEach(x=>delete x._seq);out[c]=rows});
    return out;
  }catch(e){try{return JSON.parse(localStorage.getItem('crs_state')||'null')}catch(_){return null}}
}
let saveT;
function save(){clearTimeout(saveT);const s=$('#saveState');if(s)s.textContent='Saving…';saveT=setTimeout(()=>{saveT=null;persist()},250)}
async function persist(){
  COLLECTIONS.forEach(c=>(S[c]=S[c]||[]).forEach(r=>{if(!r.id)r.id=uid()}));
  try{
    const db=await idb();const snap=JSON.parse(JSON.stringify(S));
    await new Promise((res,rej)=>{
      const t=db.transaction([KV,...COLLECTIONS],'readwrite');const kv=t.objectStore(KV);
      kv.put(snap.settings,'settings');kv.delete('state');
      COLLECTIONS.forEach(c=>{const st=t.objectStore(c);st.clear();(snap[c]||[]).forEach((r,i)=>{r._seq=i;st.put(r)})});
      t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
    });
    $('#saveState').textContent='Saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  }catch(e){
    try{localStorage.setItem('crs_state',JSON.stringify(S));$('#saveState').textContent='Saved'}
    catch(e2){$('#saveState').textContent='NOT SAVED';toast('Storage is full — export a backup in Settings and remove large files.','bad')}
  }
}
window.addEventListener('pagehide',()=>{if(saveT){clearTimeout(saveT);saveT=null;persist()}});
function mergeDefaults(d,s){
  if(Array.isArray(d))return Array.isArray(s)?s:d;
  if(d&&typeof d==='object'){const o={...d};if(s&&typeof s==='object')for(const k in s)o[k]=k in d?mergeDefaults(d[k],s[k]):s[k];return o}
  return s===undefined?d:s;
}

const getKey=()=>localStorage.getItem('anthropic_api_key')||'';
const setKey=k=>localStorage.setItem('anthropic_api_key',k.trim());

<script id="js-pricing-service">
/* ---------------- pricing (no mileage — type, make, model, days) ---------------- */
function rateFor(v){
  if(!v)return {daily:0,weekly:0,monthly:0,deposit:0,category:''};
  const m=S.settings.models.find(x=>x.make===v.make&&x.model===v.model);
  const catName=v.category||(m&&m.category)||'';
  const c=S.settings.categories.find(x=>x.name===catName)||{};
  const pick=k=>{const mv=m?num(m[k]):null;return mv!=null&&mv>0?mv:(Number(c[k])||0)};
  return {daily:pick('daily'),weekly:pick('weekly'),monthly:pick('monthly'),deposit:Number(c.deposit)||0,category:catName,fromModel:!!(m&&num(m.daily))};
}
function bestCost(d,r){
  if(d<=0)return 0;const D=r.daily||0,W=r.weekly>0?r.weekly:Infinity,M=r.monthly>0?r.monthly:Infinity,N=d+28;
  const dp=new Array(N+1).fill(Infinity);dp[0]=0;
  for(let i=1;i<=N;i++){dp[i]=dp[i-1]+D;if(i>=7)dp[i]=Math.min(dp[i],dp[i-7]+W);if(i>=28)dp[i]=Math.min(dp[i],dp[i-28]+M)}
  let b=Infinity;for(let k=d;k<=N;k++)b=Math.min(b,dp[k]);return r2(b);
}
function billable(s,e){
  const P=S.settings.policy;const mins=(new Date(e)-new Date(s))/6e4;
  if(!(mins>0))return {days:1,lateHours:0};
  let days=Math.floor(mins/1440),rem=mins-days*1440,lateHours=0;
  if(days===0)return {days:1,lateHours:0};
  if(rem>P.graceMin){const h=Math.ceil(rem/60);if(h<=P.lateCapHours)lateHours=h;else days+=1}
  return {days,lateHours};
}
/* q: {vehicleId,start,end,addons:[{id,qty}],locOut,locIn,promo,customerId,fees:[{id,qty}],extra:[{desc,amount}]} */
function quote(q){
  const v=veh(q.vehicleId);const r=rateFor(v);const P=S.settings.policy;
  const {days,lateHours}=billable(q.start,q.end);
  const base=bestCost(days,r),straight=r2(days*r.daily);
  const lines=[];
  lines.push({desc:`Rental — ${v?v.make+' '+v.model:'vehicle'} (${r.category||'—'}), ${days} day${days>1?'s':''}${base<straight?' · weekly/monthly rate applied':''}`,amount:base});
  // seasonal
  let seas=0;const perDay=days?base/days:0;
  (S.settings.seasons||[]).forEach(se=>{if(!se.start||!se.end||!num(se.pct))return;let n=0;for(let i=0;i<days;i++){const d=addDays(q.start,i);if(d>=se.start&&d<=se.end)n++}if(n){const amt=r2(perDay*n*Number(se.pct)/100);seas+=amt;lines.push({desc:`${se.name||'Seasonal rate'} (${n} day${n>1?'s':''} × ${se.pct}%)`,amount:amt})}});
  if(lateHours)lines.push({desc:`Late return — ${lateHours} hour${lateHours>1?'s':''} × ${money(P.lateHourly)}`,amount:r2(lateHours*P.lateHourly)});
  (q.addons||[]).forEach(a=>{const ad=S.settings.addons.find(x=>x.id===a.id);if(!ad)return;const qty=Number(a.qty)||1;const amt=r2(ad.per==='day'?ad.price*days*qty:ad.price*qty);lines.push({desc:`${ad.name}${qty>1?' ×'+qty:''}${ad.per==='day'?` (${days} day${days>1?'s':''} × ${money(ad.price)})`:''}`,amount:amt})});
  const lo=S.settings.locations.find(x=>x.name===q.locOut),li=S.settings.locations.find(x=>x.name===q.locIn);
  if(lo&&Number(lo.fee))lines.push({desc:`Delivery / pick-up: ${lo.name}`,amount:Number(lo.fee)});
  if(li&&Number(li.fee)&&q.locIn!==q.locOut)lines.push({desc:`Return / collection: ${li.name}`,amount:Number(li.fee)});
  (q.fees||[]).forEach(f=>{const fe=S.settings.fees.find(x=>x.id===f.id);if(!fe)return;const qty=Number(f.qty)||1;lines.push({desc:fe.name+(qty>1?' ×'+qty:''),amount:r2(fe.amount*qty)})});
  (q.extra||[]).forEach(x=>lines.push({desc:x.desc,amount:r2(x.amount)}));
  const subtotal=r2(lines.reduce((s,l)=>s+l.amount,0));
  let discPct=0,discFlat=0,discLabel='';
  const c=cust(q.customerId);if(c&&num(c.discount)){discPct=Number(c.discount);discLabel='Account discount '+discPct+'%'}
  const pr=q.promo&&S.settings.promos.find(p=>p.code&&p.code.toUpperCase()===String(q.promo).toUpperCase()&&(!p.expires||p.expires>=today()));
  if(pr){if(num(pr.pct))discPct+=Number(pr.pct);if(num(pr.flat))discFlat+=Number(pr.flat);discLabel=(discLabel?discLabel+' + ':'')+'Promo '+pr.code}
  const discount=r2(Math.min(subtotal,subtotal*discPct/100+discFlat));
  const tax=r2((subtotal-discount)*(Number(P.taxRate)||0)/100);
  const total=r2(subtotal-discount+tax);
  return {days,lateHours,rate:r,base,straight,seasonal:seas,lines,subtotal,discount,discLabel,tax,total,deposit:r.deposit};

<script id="js-money-service">
/* ---------------- money logic ---------------- */
const NONCASH=['Payment Plan','Deposit Applied'];
function agrTotal(a){return r2(((a.final||a.quote||{}).total||0)+(a.extraCharges||[]).reduce((s,x)=>s+Number(x.amount||0),0))}
function agrPaid(a){return r2(S.payments.filter(p=>(p.agreementId===a.id||(a.resId&&p.resId===a.resId&&!p.agreementId))&&(p.type==='Rental Charge'||p.type==='Reservation Deposit')).reduce((s,p)=>s+(p.refund?-1:1)*p.amount,0))}
function agrBalance(a){return r2(agrTotal(a)-agrPaid(a))}
function secHeld(a){
  const ps=S.payments.filter(p=>p.agreementId===a.id);
  return r2(ps.filter(p=>p.type==='Security Deposit').reduce((s,p)=>s+p.amount,0)-ps.filter(p=>p.type==='Deposit Release').reduce((s,p)=>s+p.amount,0)-ps.filter(p=>p.method==='Deposit Applied').reduce((s,p)=>s+p.amount,0));
}
function resDepositPaid(r){return r2(S.payments.filter(p=>p.resId===r.id&&p.type==='Reservation Deposit').reduce((s,p)=>s+(p.refund?-1:1)*p.amount,0))}
function dmgBilled(d){return r2(Number(d.billed)||0)}
function dmgPaid(d){return r2(S.payments.filter(p=>p.damageId===d.id&&p.type==='Damage Charge').reduce((s,p)=>s+(p.refund?-1:1)*p.amount,0))}
function dmgBalance(d){return r2(dmgBilled(d)-dmgPaid(d))}
function custBalance(c){
  let b=0;S.agreements.filter(a=>a.customerId===c.id&&a.status!=='Draft'&&a.status!=='Void').forEach(a=>b+=Math.max(0,agrBalance(a)));
  S.damages.filter(d=>d.customerId===c.id).forEach(d=>b+=Math.max(0,dmgBalance(d)));
  S.plans.filter(p=>p.customerId===c.id&&p.status==='Active').forEach(p=>b+=planRemaining(p));
  return r2(b);
}
function addPayment(p){const x={id:uid(),date:isoDT(),refund:false,by:USER?.id||'',...p,amount:r2(p.amount)};S.payments.push(x);return x}
</script>
<script id="js-payment-plan-service">
/* ---------------- payment plans ---------------- */
const FREQ={Weekly:{days:7,per:52},'Bi-weekly':{days:14,per:26},'Semi-monthly':{days:15,per:24},Monthly:{months:1,per:12}};
function buildSchedule(principal,n,freq,start,rate){
  const f=FREQ[freq]||FREQ.Monthly;const r=(Number(rate)||0)/100/f.per;n=Math.max(1,Math.round(n));
  const pay=r>0?principal*r/(1-Math.pow(1+r,-n)):principal/n;
  let bal=principal;const out=[];
  for(let i=0;i<n;i++){
    let due;if(f.months){const s0=new Date(start+'T00:00');const y=s0.getFullYear(),mo=s0.getMonth()+i;const last=new Date(y,mo+1,0).getDate();due=isoDate(new Date(y,mo,Math.min(s0.getDate(),last)))}else due=addDays(start,i*f.days);
    const int=r2(bal*r);let prin=i===n-1?r2(bal):r2(pay-int);if(prin>bal)prin=r2(bal);
    bal=r2(bal-prin);out.push({due,principal:prin,interest:int,amount:r2(prin+int),paid:0,lateFee:0,status:'Due',waived:false});
  }
  return out;
}
function instOwed(i){return r2(i.amount+(i.lateFee||0)-(i.paid||0))}
function planRemaining(p){return r2(p.schedule.filter(i=>!i.waived).reduce((s,i)=>s+Math.max(0,instOwed(i)),0))}
function planPayoff(p){ /* remaining principal + any late fees owed; future interest not charged */
  return r2(p.schedule.filter(i=>!i.waived).reduce((s,i)=>{const owed=instOwed(i);if(owed<=0)return s;const paidTowardInt=Math.min(i.paid||0,i.interest);const unpaidInt=i.interest-paidTowardInt;const isPast=i.due<=today();return s+owed-(isPast?0:unpaidInt)},0));
}
function refreshPlans(){
  const P=S.settings.policy;let changed=false;
  S.plans.forEach(p=>{
    if(p.status!=='Active')return;let missed=0;
    p.schedule.forEach(i=>{
      if(i.waived){i.status='Waived';return}
      const owed=instOwed(i);
      if(owed<=0.004){if(i.status!=='Paid'){i.status='Paid';changed=true}return}
      const late=daysBetween(i.due,today())>Number(P.planGraceDays);
      if(late){missed++;if(!i.lateFee&&Number(p.lateFee)>0){i.lateFee=Number(p.lateFee);changed=true}if(i.status!=='Late'){i.status='Late';changed=true}}
      else{const st=i.paid>0?'Partial':'Due';if(i.status!==st){i.status=st;changed=true}}
    });
    if(planRemaining(p)<=0.004){p.status='Completed';changed=true}
    else if(missed>=Number(P.missedToDefault)){p.status='Defaulted';const c=cust(p.customerId);if(c&&!c.dnr){c.dnr=true;c.dnrReason='Payment plan '+p.no+' defaulted';}changed=true}
  });
  if(changed)save();
}
/* apply an amount to a plan, oldest installment first */
function applyToPlan(p,amount){
  let left=r2(amount);
  for(const i of p.schedule){if(left<=0)break;if(i.waived)continue;const owed=instOwed(i);if(owed<=0)continue;const pay=Math.min(owed,left);i.paid=r2((i.paid||0)+pay);left=r2(left-pay)}
  // payoff: if remaining equals only future interest, waive it
  if(left>=0&&planPayoff(p)<=0.004)p.schedule.forEach(i=>{if(instOwed(i)>0&&i.due>today()){i.waived=true;i.status='Waived'}});
  refreshPlans();return left;
}
</script>
<script id="js-availability-service">
/* ---------------- availability ---------------- */
function busyBlocks(vehicleId){
  const B=[];const buf=Number(S.settings.policy.turnaroundHrs)*36e5;
  S.reservations.filter(r=>r.vehicleId===vehicleId&&['Inquiry','Confirmed','Deposit Paid'].includes(r.status)).forEach(r=>B.push({s:new Date(r.start),e:new Date(new Date(r.end).getTime()+buf),type:r.status==='Inquiry'?'inq':'res',ref:r,label:'Reservation '+cName(cust(r.customerId))}));
  S.agreements.filter(a=>a.vehicleId===vehicleId&&['Draft','Open'].includes(a.status)).forEach(a=>{const e=a.status==='Open'&&new Date(a.due)<new Date()?new Date():new Date(a.due);B.push({s:new Date(a.out?.dt||a.start),e:new Date(e.getTime()+buf),type:'out',ref:a,label:'Agreement '+a.no})});
  S.maintenance.filter(m=>m.vehicleId===vehicleId&&m.hold&&m.holdStart).forEach(m=>B.push({s:new Date(m.holdStart+'T00:00'),e:new Date((m.holdEnd||m.holdStart)+'T23:59'),type:'mnt',ref:m,label:'Maintenance: '+(m.work||'')}));
  return B;
}
function conflicts(vehicleId,start,end,ignoreId){
  const s=new Date(start),e=new Date(end);
  return busyBlocks(vehicleId).filter(b=>b.ref.id!==ignoreId&&b.ref.resId!==ignoreId&&!(b.ref.agreementId&&b.ref.agreementId===ignoreId)&&s<b.e&&e>b.s);
}
function vehicleRentable(v,until){
  const issues=[];const u=(until||today()).slice(0,10);
  if(['Out of Service','Sold'].includes(v.status))issues.push('Status is '+v.status);
  if(!v.insExp)issues.push('No insurance expiry on file');else if(v.insExp<u)issues.push('Insurance expires '+fmtD(v.insExp));
  if(!v.regExp)issues.push('No registration expiry on file');else if(v.regExp<u)issues.push('Registration expires '+fmtD(v.regExp));
  if(v.inspExp&&v.inspExp<u)issues.push('Inspection expires '+fmtD(v.inspExp));
  return issues;
}
</script>

    if(pickerId&&document.getElementById(pickerId)){const s=document.getElementById(pickerId);if(![...s.options].some(o=>o.value===x.id))s.add(new Option(cName(x),x.id));s.value=x.id;s.dispatchEvent(new Event('change'))}

async function addPhotos(inp){const arr=EDIT[EDIT._pf]||(EDIT[EDIT._pf]=[]);for(const f of inp.files)arr.push(await resizeImage(f));inp.value='';rerenderModalPhotos()}
function rerenderModalPhotos(){const b=$('#photoBox');if(b&&EDIT)b.innerHTML=photoStrip(EDIT[EDIT._pf],'EDIT.'+EDIT._pf)}
function viewCustomer(id){
  const c=cust(id);const ags=S.agreements.filter(a=>a.customerId===id);const pls=S.plans.filter(p=>p.customerId===id);

<script id="js-module-fleet">
/* ================= FLEET ================= */
PAGES.fleet={t:'Fleet',r(){
  const vs=S.vehicles.slice().sort((a,b)=>(a.make+a.model).localeCompare(b.make+b.model));
  PG().innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><span class="muted">${vs.length} vehicle(s)</span><div style="flex:1"></div><button class="btn p" onclick="editVehicle()">+ Add Vehicle</button></div>
  <div class="tbl"><table><tr><th>Vehicle</th><th>Plate</th><th>Category</th><th class="r">Daily / Weekly / Monthly</th><th>Insurance</th><th>Registration</th><th>Status</th><th class="r">Revenue</th><th class="r">Util. 30d</th></tr>
  ${vs.map(v=>{const r=rateFor(v);const iss=vehicleRentable(v);return `<tr class="click" onclick="editVehicle('${v.id}')"><td><b>${esc(v.year+' '+v.make+' '+v.model)}</b><br><span class="muted small">${esc(v.color||'')} · ${esc(v.seats||'?')} seats</span></td><td>${esc(v.plate||'')}</td><td>${esc(v.category||'')}</td><td class="r">${money(r.daily)} / ${money(r.weekly)} / ${money(r.monthly)}</td><td>${expTag(v.insExp)}</td><td>${expTag(v.regExp)}</td><td><span class="tag ${v.status==='Available'?'ok':v.status==='Rented'?'b':'warn'}">${esc(v.status)}</span>${iss.length&&!['Sold'].includes(v.status)?'<br><span class="tag bad">Not rentable</span>':''}</td><td class="r">${money(vehRevenue(v.id))}</td><td class="r">${utilization(v.id,addDays(today(),-30),today())}%</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No vehicles yet. Add makes, models and rates in Settings first, then add vehicles here.</td></tr>'}</table></div></div>`;
}};
function expTag(d){if(!d)return '<span class="tag bad">Missing</span>';const n=daysBetween(today(),d);return `<span class="tag ${n<0?'bad':n<=30?'warn':'ok'}">${fmtD(d)}</span>`}
function vehRevenue(id){return r2(S.agreements.filter(a=>a.vehicleId===id&&a.status!=='Void'&&a.status!=='Draft').reduce((s,a)=>s+agrTotal(a),0))}
function utilization(id,from,to){
  const span=Math.max(1,daysBetween(from,to)+1);let used=0;
  for(let i=0;i<span;i++){const d=addDays(from,i);const s=new Date(d+'T00:00'),e=new Date(d+'T23:59');if(S.agreements.some(a=>a.vehicleId===id&&['Open','Closed'].includes(a.status)&&new Date(a.out?.dt||a.start)<e&&new Date(a.in?.dt||(a.status==='Open'?new Date():a.due))>s))used++}
  return Math.round(used/span*100);
}
function editVehicle(id){
  const v=id?JSON.parse(JSON.stringify(veh(id))):{id:uid(),status:'Available',photos:[],year:new Date().getFullYear(),transmission:'Automatic',fuel:'Gasoline',ac:true,serviceDays:S.settings.policy.maintIntervalDays};
  EDIT=v;EDIT._pf='photos';const st=S.settings;
  modal(id?'Edit vehicle':'Add vehicle',`
  <div class="grid g4">${F('Plate',I('v_plate',v.plate),'req')}${F('VIN',I('v_vin',v.vin))}${F('Year',I('v_year',v.year,'number'))}${F('Color',SEL('v_color',st.colors,v.color))}
  ${F('Make',SEL('v_make',st.makes,v.make,'onchange="fillModels()"'),'req')}${F('Model',`<select id="v_model" onchange="modelCat()"></select>`,'req')}${F('Category',SEL('v_cat',st.categories.map(c=>c.name),v.category),'req')}${F('Seats',I('v_seats',v.seats,'number'))}
  ${F('Transmission',SEL('v_trans',['Automatic','Manual'],v.transmission,'',null))}${F('Fuel',SEL('v_fuel',['Gasoline','Diesel','Hybrid','Electric'],v.fuel,'',null))}<label class="chk" style="margin-top:20px"><input type="checkbox" id="v_ac" ${v.ac?'checked':''}> Air conditioning</label><label class="chk" style="margin-top:20px"><input type="checkbox" id="v_4wd" ${v.fwd?'checked':''}> 4WD</label></div>
  <div id="v_rate" class="note" style="margin:10px 0"></div>
  <h3>Insurance & registration (required to rent)</h3>
  <div class="grid g4">${F('Insurance carrier',SEL('v_carrier',st.lists.carriers,v.carrier))}${F('Policy number',I('v_policy',v.policyNo))}${F('Liability limits',I('v_limits',v.limits,'text','placeholder="e.g. 20/40/10"'))}${F('Insurance expiry',I('v_insexp',v.insExp,'date'),'req')}
  ${F('Registration expiry',I('v_regexp',v.regExp,'date'),'req')}${F('Safety inspection expiry',I('v_inspexp',v.inspExp,'date'))}${F('Service interval (days)',I('v_svc',v.serviceDays,'number'))}${F('Status',SEL('v_status',['Available','Reserved','Rented','Maintenance','Out of Service','Sold'],v.status,'',null))}</div>
  <h3>Purchase</h3>
  <div class="grid g4">${F('Purchase date',I('v_pdate',v.purchaseDate,'date'))}${F('Purchase price',I('v_pprice',v.purchasePrice,'number'))}${F('Odometer (maintenance only)',I('v_odo',v.odometer,'number'))}</div>
  <h3>Photos</h3><input type="file" accept="image/*" multiple onchange="addPhotos(this)"><div id="photoBox" style="margin-top:8px"></div>
  ${F('Notes',TA('v_notes',v.notes))}`,
  [...(id?[{t:'Delete',c:'bad',f:m=>confirmBox('Delete this vehicle? Rental history stays.',()=>{S.vehicles=S.vehicles.filter(x=>x.id!==id);save();closeModal(m);rerender()})}]:[]),
  {t:'Save vehicle',c:'p',f:m=>{
    Object.assign(EDIT,{plate:V('v_plate').trim().toUpperCase(),vin:V('v_vin'),year:V('v_year'),color:V('v_color'),make:V('v_make'),model:V('v_model'),category:V('v_cat'),seats:V('v_seats'),transmission:V('v_trans'),fuel:V('v_fuel'),ac:V('v_ac'),fwd:V('v_4wd'),carrier:V('v_carrier'),policyNo:V('v_policy'),limits:V('v_limits'),insExp:V('v_insexp'),regExp:V('v_regexp'),inspExp:V('v_inspexp'),serviceDays:V('v_svc'),status:V('v_status'),purchaseDate:V('v_pdate'),purchasePrice:V('v_pprice'),odometer:V('v_odo'),notes:V('v_notes')});
    if(!EDIT.plate||!EDIT.make||!EDIT.model||!EDIT.category){toast('Plate, make, model and category are required','bad');return}
    delete EDIT._pf;const i=S.vehicles.findIndex(x=>x.id===EDIT.id);if(i>=0)S.vehicles[i]=EDIT;else S.vehicles.push(EDIT);save();closeModal(m);toast('Vehicle saved','ok');rerender();
  }}],true);
  fillModels(v.model);rerenderModalPhotos();
}
function fillModels(sel){const mk=V('v_make');const ms=S.settings.models.filter(m=>m.make===mk).map(m=>m.model);const cur=sel??V('v_model');if(cur&&!ms.includes(cur))ms.push(cur);$('#v_model').innerHTML=opts(ms,cur,ms.length?'— Select —':'Add models for this make in Settings');showRate()}
function modelCat(){const m=S.settings.models.find(x=>x.make===V('v_make')&&x.model===V('v_model'));if(m&&m.category)$('#v_cat').value=m.category;showRate()}
function showRate(){setTimeout(()=>{const r=rateFor({make:V('v_make'),model:V('v_model'),category:V('v_cat')});const b=$('#v_rate');if(b)b.innerHTML=`Rate for this vehicle: <b>${money(r.daily)}/day · ${money(r.weekly)}/week · ${money(r.monthly)}/month</b> · deposit ${money(r.deposit)} <span class="muted">(${r.fromModel?'set for this make/model':'from category'} — change in Settings → Rates)</span>`},0)}
document.addEventListener('change',e=>{if(e.target.id==='v_cat')showRate()});
</script>
<script id="js-module-reservations">
/* ================= RESERVATIONS ================= */
let RF='Active';
PAGES.reservations={t:'Reservations',r(){
  const act=['Inquiry','Confirmed','Deposit Paid'];
  const list=S.reservations.filter(r=>RF==='All'||(RF==='Active'?act.includes(r.status):r.status===RF)).sort((a,b)=>a.start.localeCompare(b.start));
  PG().innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><select style="max-width:180px" onchange="RF=this.value;rerender()">${opts(['Active','Inquiry','Confirmed','Deposit Paid','Converted','Cancelled','No-Show','All'],RF,null)}</select><div style="flex:1"></div><button class="btn p" onclick="editReservation()">+ New Reservation</button></div>
  <div class="tbl"><table><tr><th>Pick-up</th><th>Return</th><th>Customer</th><th>Vehicle</th><th>Status</th><th class="r">Quote</th><th class="r">Deposit paid</th><th></th></tr>
  ${list.map(r=>`<tr class="click" onclick="editReservation('${r.id}')"><td>${fmtDT(r.start)}</td><td>${fmtDT(r.end)}</td><td>${esc(cName(cust(r.customerId)))}${r.source==='Booking page'?' <span class="tag b">Online</span>':''}</td><td>${esc(r.vehicleId?vLabel(veh(r.vehicleId)):(r.category||'')+' (any)')}</td><td><span class="tag ${r.status==='Cancelled'||r.status==='No-Show'?'bad':r.status==='Inquiry'?'warn':'ok'}">${r.status}</span></td><td class="r">${r.vehicleId?money(quote(resQ(r)).total):'—'}</td><td class="r">${money(resDepositPaid(r))}</td><td>${act.includes(r.status)?`<button class="btn sm" onclick="event.stopPropagation();go('checkout',{resId:'${r.id}'})">Check-Out</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No reservations</td></tr>'}</table></div></div>`;
}};
const resQ=r=>({vehicleId:r.vehicleId,start:r.start,end:r.end,addons:r.addons,locOut:r.locOut,locIn:r.locIn,promo:r.promo,customerId:r.customerId});
function editReservation(id,pre={}){
  const r=id?JSON.parse(JSON.stringify(resv(id))):{id:uid(),status:'Confirmed',start:isoDT(new Date(Date.now()+864e5)).slice(0,11)+'09:00',end:isoDT(new Date(Date.now()+2*864e5)).slice(0,11)+'09:00',addons:[],locOut:S.settings.locations[0]?.name,locIn:S.settings.locations[0]?.name,created:isoDT(),...pre};
  if(pre.vehicleId&&!r.category)r.category=veh(pre.vehicleId)?.category;
  EDIT=r;
  modal(id?'Reservation':'New reservation',`
  <div class="grid g2">${F('Customer',custPicker('r_cust',r.customerId,'resQuote()'),'req')}${F('Status',SEL('r_status',['Inquiry','Confirmed','Deposit Paid','Converted','Cancelled','No-Show'],r.status,'',null))}</div>
  <div class="grid g4" style="margin-top:10px">${F('Pick-up date & time',I('r_start',r.start,'datetime-local','onchange="resVehicles();resQuote()"'),'req')}${F('Return date & time',I('r_end',r.end,'datetime-local','onchange="resVehicles();resQuote()"'),'req')}${F('Pick-up location',SEL('r_lo',S.settings.locations.map(l=>l.name),r.locOut,'onchange="resQuote()"',null))}${F('Return location',SEL('r_li',S.settings.locations.map(l=>l.name),r.locIn,'onchange="resQuote()"',null))}
  ${F('Category requested',SEL('r_cat',S.settings.categories.map(c=>c.name),r.category,'onchange="resVehicles();resQuote()"'))}<div style="grid-column:span 2">${F('Vehicle',`<select id="r_veh" onchange="resQuote()"></select>`)}</div>${F('Promo code',I('r_promo',r.promo,'text','oninput="resQuote()"'))}</div>
  <h3>Add-ons</h3><div class="grid g3">${S.settings.addons.map(a=>{const cur=(r.addons||[]).find(x=>x.id===a.id);return `<label class="chk"><input type="checkbox" class="r_ad" data-id="${a.id}" ${cur?'checked':''} onchange="resQuote()"> ${esc(a.name)} — ${money(a.price)}/${a.per} <input type="number" min="1" value="${cur?.qty||1}" class="r_adq" data-id="${a.id}" style="width:54px;padding:2px 4px" oninput="resQuote()"></label>`}).join('')}</div>
  ${F('Notes',TA('r_notes',r.notes))}
  <div id="r_conf" style="margin-top:10px"></div>
  <div class="card" style="margin-top:12px;background:var(--soft)"><h2>Live quote</h2><div id="r_quote"></div></div>
  ${id?`<p class="muted small">Reservation deposit paid: <b>${money(resDepositPaid(r))}</b>. Cancellation window: ${S.settings.policy.cancelHours} hours before pick-up.</p>`:''}`,
  [{t:'Save',c:'p',f:m=>{if(saveRes()){closeModal(m);rerender()}}},
   {t:'Take deposit (POS)',f:m=>{if(!saveRes())return;closeModal(m);posAddResDeposit(EDIT.id)}},
   {t:'Convert to Check-Out',c:'ok',f:m=>{if(!saveRes())return;closeModal(m);go('checkout',{resId:EDIT.id})}}],true);
  resVehicles(r.vehicleId);resQuote();
}
function resVehicles(sel){
  const cat=V('r_cat'),s=V('r_start'),e=V('r_end');const cur=sel??V('r_veh');
  const vs=S.vehicles.filter(v=>!['Sold','Out of Service'].includes(v.status)&&(!cat||v.category===cat));
  $('#r_veh').innerHTML=opts(vs.map(v=>{const c=conflicts(v.id,s,e,EDIT.id).length;const iss=vehicleRentable(v,e);return {v:v.id,l:vLabel(v)+(c?' — BOOKED':'')+(iss.length?' — NOT RENTABLE':'')}}),cur,'Any vehicle in category');
}
function readResForm(){
  const r=EDIT;Object.assign(r,{customerId:V('r_cust'),status:V('r_status'),start:V('r_start'),end:V('r_end'),locOut:V('r_lo'),locIn:V('r_li'),category:V('r_cat'),vehicleId:V('r_veh'),promo:V('r_promo').trim(),notes:V('r_notes'),
    addons:$$('.r_ad').filter(x=>x.checked).map(x=>({id:x.dataset.id,qty:Number($(`.r_adq[data-id="${x.dataset.id}"]`).value)||1}))});
  if(!r.vehicleId&&r.category){const v=S.vehicles.find(v=>v.category===r.category);r._qv=v?.id}else r._qv=r.vehicleId;
  return r;
}
function resQuote(){
  const r=readResForm();const box=$('#r_quote');if(!box)return;
  const c=$('#r_conf');let warn='';
  if(r.vehicleId){const cf=conflicts(r.vehicleId,r.start,r.end,r.id);if(cf.length)warn+=`<div class="alert bad">This vehicle is already booked: ${cf.map(b=>esc(b.label)+' ('+fmtD(b.s.toISOString?isoDate(b.s):b.s)+')').join('; ')}</div>`;const iss=vehicleRentable(veh(r.vehicleId),r.end);if(iss.length)warn+=`<div class="alert warn">${iss.map(esc).join(' · ')}</div>`}
  const cu=cust(r.customerId);if(cu?.dnr)warn+=`<div class="alert bad">Customer is flagged Do Not Rent: ${esc(cu.dnrReason||'')}</div>`;
  if(new Date(r.end)<=new Date(r.start))warn+='<div class="alert bad">Return must be after pick-up.</div>';
  c.innerHTML=warn;
  if(!r._qv){box.innerHTML='<div class="muted">Pick a category or vehicle to see the price.</div>';return}
  box.innerHTML=quoteHTML(quote({...resQ(r),vehicleId:r._qv}),true);
}
function quoteHTML(q,showDeposit){
  return q.lines.map(l=>`<div class="sumline"><span>${esc(l.desc)}</span><span>${money(l.amount)}</span></div>`).join('')+
  (q.discount?`<div class="sumline"><span>${esc(q.discLabel)}</span><span>-${money(q.discount)}</span></div>`:'')+
  (q.tax?`<div class="sumline"><span>${esc(S.settings.policy.taxLabel)} ${S.settings.policy.taxRate}%</span><span>${money(q.tax)}</span></div>`:'')+
  `<div class="sumline t"><span>Total (${q.days} day${q.days>1?'s':''})</span><span>${money(q.total)}</span></div>`+
  (q.base<q.straight?`<div class="muted small">Straight daily price would be ${money(q.straight)} — customer saves ${money(q.straight-q.base)}.</div>`:'')+
  (showDeposit?`<div class="sumline muted"><span>Security deposit (refundable, held separately)</span><span>${money(q.deposit)}</span></div><div class="sumline muted"><span>Reservation deposit</span><span>${money(S.settings.policy.resDeposit)}</span></div>`:'');
}
function saveRes(){
  const r=readResForm();delete r._qv;
  if(!r.customerId){toast('Choose a customer','bad');return false}
  if(new Date(r.end)<=new Date(r.start)){toast('Return must be after pick-up','bad');return false}
  if(r.vehicleId&&conflicts(r.vehicleId,r.start,r.end,r.id).length&&!['Cancelled','No-Show','Converted'].includes(r.status)){toast('That vehicle is already booked for those dates','bad');return false}
  const i=S.reservations.findIndex(x=>x.id===r.id);if(i>=0)S.reservations[i]=r;else S.reservations.push(r);
  if(r.vehicleId&&['Confirmed','Deposit Paid'].includes(r.status)){const v=veh(r.vehicleId);if(v&&v.status==='Available'&&r.start.slice(0,10)<=addDays(today(),1))v.status='Reserved'}
  save();toast('Reservation saved','ok');return true;
}

<script id="js-module-signature-pad-car-diagram">
/* ================= SIGNATURE PAD & CAR DIAGRAM ================= */
const SIG={};
function sigPad(id,data,locked){return `<canvas class="sig" id="${id}" width="600" height="160" data-locked="${locked?1:0}"></canvas>${locked?'':`<button type="button" class="btn sm" style="margin-top:4px" onclick="clearSig('${id}')">Clear</button>`}`}
function initSig(id,data){
  const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#111';SIG[id]={drawn:!!data};
  if(data){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=data}
  if(c.dataset.locked==='1')return;
  let down=false;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!down)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();SIG[id].drawn=true};
  c.onpointerup=()=>{down=false;sigChanged(id)};
}
function clearSig(id){const c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height);SIG[id].drawn=false;sigChanged(id)}
function sigData(id){const c=document.getElementById(id);return c&&SIG[id]?.drawn?c.toDataURL('image/png'):''}
function sigChanged(){if(CUR==='checkout')coRefresh()}
function carSVG(id,marks,marks2,click){
  const m=(arr,col)=>(arr||[]).map((p,i)=>`<g><circle cx="${p.x}" cy="${p.y}" r="9" fill="${col}"/><text x="${p.x}" y="${p.y+4}" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">${col==='#b83227'?'N':''}${i+1}</text></g>`).join('');
  return `<svg id="${id}" class="cardiag" viewBox="0 0 200 360" ${click?`onclick="${click}(event,this)"`:''} style="${click?'':'cursor:default'}">
  <text x="100" y="14" font-size="10" text-anchor="middle" fill="#888">FRONT</text>
  <rect x="45" y="22" width="110" height="316" rx="38" fill="#f4f6f8" stroke="#6b7884" stroke-width="2"/>
  <rect x="58" y="80" width="84" height="46" rx="8" fill="#dfe8ee" stroke="#8a97a3"/><rect x="58" y="240" width="84" height="40" rx="8" fill="#dfe8ee" stroke="#8a97a3"/>
  <rect x="62" y="130" width="76" height="106" rx="6" fill="none" stroke="#b5c0c9"/>
  <rect x="30" y="66" width="16" height="44" rx="5" fill="#555"/><rect x="154" y="66" width="16" height="44" rx="5" fill="#555"/><rect x="30" y="252" width="16" height="44" rx="5" fill="#555"/><rect x="154" y="252" width="16" height="44" rx="5" fill="#555"/>
  <text x="18" y="185" font-size="10" fill="#888" transform="rotate(-90 18 185)">DRIVER</text><text x="186" y="170" font-size="10" fill="#888" transform="rotate(90 186 170)">PASSENGER</text>
  <text x="100" y="354" font-size="10" text-anchor="middle" fill="#888">REAR</text>${m(marks,'#0e5a6b')}${m(marks2,'#b83227')}</svg>`;
}
function svgPoint(e,svg){const r=svg.getBoundingClientRect();return {x:Math.round((e.clientX-r.left)*200/r.width),y:Math.round((e.clientY-r.top)*360/r.height)}}
</script>

}
PAGES.checkout={t:'Check-Out (Rental Agreements)',r(arg){
  if(arg&&arg.resId){const r=resv(arg.resId);const ex=S.agreements.find(a=>a.resId===r.id&&a.status==='Draft');

    <div class="grid g3" style="margin-top:12px">${F('Damage coverage',SEL('co_ins',["Renter's own auto insurance",'Collision Damage Waiver (CDW)','Declined — renter fully responsible'],CO.ins,'onchange="coInsChange()"'),'req')}${F('Renter insurer & policy (if own)',I('co_insd',CO.insDetail))}${F('Children under 4 riding?',SEL('co_kids',['No','Yes'],CO.children,'onchange="coRefresh()"',null))}</div>
   </div>
   <div class="card"><h2>Vehicle condition at pick-up</h2>
    <div class="grid" style="grid-template-columns:240px 1fr">
     <div>${carSVG('co_svg',CO.out.marks,null,'coMark')}<div class="muted small">Tap the car to mark existing damage.</div><button class="btn sm" onclick="coReadForm();CO.out.marks.pop();coCond()">Undo last mark</button></div>
     <div><div class="grid g2">${F('Fuel level out',SEL('co_fuel',FUEL,CO.out.fuel,'',null))}${F('Odometer (maintenance only — no mileage charge)',I('co_odo',CO.out.odo,'number'))}</div>
      ${F('Damage / condition notes (numbers match the diagram)',TA('co_dn',CO.out.notes,'rows=4'))}
      <h3>Equipment checklist</h3>${st.lists.equipment.map(e=>`<label class="chk"><input type="checkbox" class="co_eq" value="${esc(e)}" ${CO.out.equip.includes(e)?'checked':''}> ${esc(e)}</label>`).join('')}
      <h3>Photos (up to 8)</h3><input type="file" accept="image/*" multiple capture="environment" onchange="coPhotos(this)"><div id="photoBox" style="margin-top:6px"></div></div>
    </div></div>
   <div class="card"><h2>Renter acknowledgments</h2>${st.legal.acks.map((a,i)=>`<label class="chk" style="margin-bottom:6px"><input type="checkbox" class="co_ack" value="${i}" ${CO.acks.includes(i)?'checked':''} onchange="coRefresh()"> ${esc(a)}</label>`).join('')}
    <p class="muted small">Agreement uses policy version ${esc(st.legal.version)} (effective ${fmtD(st.legal.effective)}). <a href="#" onclick="coReadForm();printAgreement(CO,true);return false">Preview full agreement</a></p></div>
   <div class="card"><h2>Signatures</h2><div class="grid g2"><div>${F('Renter signature','')}${sigPad('sig_c')}</div><div>${F('Staff signature','')}${sigPad('sig_s')}</div></div></div>
  </div>
  <div style="position:sticky;top:70px">
   <div class="card"><h2>Charges</h2><div id="co_quote"></div></div>
   <div class="card"><h2>Security deposit</h2><div id="co_dep"></div><details style="margin-top:8px"><summary class="small muted">Deposit override</summary>${F('Reason (recorded on agreement)',I('co_ovr',CO.depOverride||'','text','oninput="CO.depOverride=this.value.trim();coRefresh()"'))}</details></div>
   <div class="card"><h2>Release checks</h2><ul class="checks" id="co_checks"></ul>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="coSaveDraft(true)">Save draft</button><button class="btn" onclick="coReadForm();printAgreement(CO,true)">Print preview</button><button class="btn ok lg" id="co_release" onclick="coRelease()" style="flex:1">Release vehicle</button></div>
    <button class="btn bad sm" style="margin-top:8px" onclick="coDiscard()">Discard draft</button></div>
  </div></div>`;
  coVehicles(CO.vehicleId);coDrivers();rerenderModalPhotos();initSig('sig_c',CO.sigCust);initSig('sig_s',CO.sigStaff);coRefresh();

function coVehicles(sel){
  const cur=sel??V('co_veh');const s=V('co_start'),e=V('co_due');
  const vs=S.vehicles.filter(v=>!['Sold','Out of Service','Rented'].includes(v.status)||v.id===cur);
  $('#co_veh').innerHTML=opts(vs.map(v=>{const c=conflicts(v.id,s,e,CO.resId||CO.id).filter(b=>b.ref.id!==CO.id);const iss=vehicleRentable(v,e);return {v:v.id,l:`${vLabel(v)} · ${v.category}${c.length?' — BOOKED':''}${iss.length?' — NOT RENTABLE':''}${v.status==='Maintenance'?' — IN MAINTENANCE':''}`}}),cur);
}
function coDrivers(){$('#co_drv').innerHTML=CO.drivers.map((d,i)=>`<div class="grid g4" style="margin-bottom:8px;align-items:end">${F('Name',I('dr_n'+i,d.name))}${F('License no.',I('dr_l'+i,d.lic))}${F('License expiry',I('dr_e'+i,d.exp,'date'))}<div class="row" style="flex-wrap:nowrap">${F('Date of birth',I('dr_b'+i,d.dob,'date'))}<button class="btn sm bad" onclick="coReadForm();CO.drivers.splice(${i},1);coDrivers();coRefresh()">×</button></div></div>`).join('')||'<p class="muted small">No additional drivers.</p>'}
function coPhotos(inp){EDIT=CO.out;EDIT._pf='photos';(async()=>{for(const f of inp.files){if(CO.out.photos.length>=8)break;CO.out.photos.push(await resizeImage(f))}inp.value='';rerenderModalPhotos()})()}
function coMark(e,svg){coReadForm();const p=svgPoint(e,svg);CO.out.marks.push(p);const n=CO.out.marks.length;const ta=$('#co_dn');ta.value=(ta.value?ta.value.trimEnd()+'\n':'')+n+': ';coCond();$('#co_dn').focus()}
function coCond(){$('#co_svg').outerHTML=carSVG('co_svg',CO.out.marks,null,'coMark')}
function coInsChange(){const v=V('co_ins');const cdw=S.settings.addons.find(a=>a.cdw);if(cdw){const b=$(`.co_ad[data-id="${cdw.id}"]`);if(b)b.checked=v.startsWith('Collision')}coRefresh()}
function coReadForm(){
  if(!$('#co_no'))return CO;
  Object.assign(CO,{no:V('co_no').trim(),customerId:V('co_cust'),start:V('co_start'),due:V('co_due'),locOut:V('co_lo'),locIn:V('co_li'),vehicleId:V('co_veh'),promo:V('co_promo').trim(),ins:V('co_ins'),insDetail:V('co_insd'),children:V('co_kids'),
    addons:$$('.co_ad').filter(x=>x.checked).map(x=>({id:x.dataset.id,qty:Number($(`.co_adq[data-id="${x.dataset.id}"]`).value)||1})),
    acks:$$('.co_ack').filter(x=>x.checked).map(x=>+x.value),
    drivers:CO.drivers.map((d,i)=>({name:V('dr_n'+i),lic:V('dr_l'+i),exp:V('dr_e'+i),dob:V('dr_b'+i)}))});
  Object.assign(CO.out,{fuel:V('co_fuel'),odo:V('co_odo'),notes:V('co_dn'),equip:$$('.co_eq').filter(x=>x.checked).map(x=>x.value)});
  CO.sigCust=sigData('sig_c')||'';CO.sigStaff=sigData('sig_s')||'';
  return CO;
}
function coQ(a){return {vehicleId:a.vehicleId,start:a.start,end:a.due,addons:a.addons,locOut:a.locOut,locIn:a.locIn,promo:a.promo,customerId:a.customerId}}
function coChecks(a){
  const P=S.settings.policy;const c=cust(a.customerId),v=veh(a.vehicleId);const due=(a.due||'').slice(0,10);const L=[];
  const add=(ok,label,lvl)=>L.push({ok,label,lvl:ok?'ok':(lvl||'no')});
  add(!!c,'Primary renter selected');
  if(c){
    add(!c.dnr,c.dnr?'Customer is flagged DO NOT RENT':'Customer not on do-not-rent list');
    add(!!c.licNo,c.licNo?'License number on file':'License number missing');
    add(!!c.licExp&&c.licExp>=due,c.licExp?(c.licExp>=due?'License valid through return ('+fmtD(c.licExp)+')':'License expires '+fmtD(c.licExp)+' — before return'):'License expiry missing');
    const age=ageOn(c.dob);add(age!=null&&age>=P.minAge,age==null?'Date of birth missing (age check)':`Renter age ${age} (minimum ${P.minAge})`);
    if((c.licType||'').startsWith('Foreign')){
      const arr=c.arrival;const d=arr?daysBetween(arr,due):null;const hasPermit=!!(c.visitorPermit&&(!c.visitorPermitExp||c.visitorPermitExp>=due));
      const ok=hasPermit||(d!=null&&d<P.foreignDays);
      add(ok,hasPermit?'OMV visitor permit on file':(d==null?'Foreign license: arrival date needed for the 30-day rule':`Foreign license: day ${d+1} of ${P.foreignDays} at return${ok?'':' — needs OMV visitor permit or local license'}`));
      if(c.licType==='Foreign + International Driving Permit')add(!!c.idpNo,c.idpNo?'International Driving Permit on file':'International Driving Permit number missing');
    }
  }
  a.drivers.forEach((d,i)=>{add(!!(d.name&&d.lic&&d.exp&&d.exp>=due),`Driver ${i+2}: ${d.name||'(no name)'} — ${d.lic?(d.exp>=due?'license valid':'license expired / no expiry'):'no license'}`);if(d.dob){const ag=ageOn(d.dob);add(ag>=P.minAge,`Driver ${i+2} age ${ag} (minimum ${P.minAge})`)}});
  add(!!v,'Vehicle selected');
  if(v){const iss=vehicleRentable(v,due);add(!iss.length,iss.length?iss.join(' · '):'Vehicle insurance & registration current through return');
    const cf=conflicts(v.id,a.start,a.due,a.resId||a.id).filter(b=>b.ref.id!==a.id);add(!cf.length,cf.length?'Vehicle booked: '+cf.map(b=>b.label).join('; '):'No booking conflicts');
    add(v.status!=='Maintenance',v.status==='Maintenance'?'Vehicle is in maintenance':'Vehicle not in maintenance')}
  add(new Date(a.due)>new Date(a.start),'Return is after pick-up');
  add(!!a.ins,a.ins?'Damage coverage: '+a.ins:'Choose damage coverage option');
  if(a.children==='Yes'){const has=a.addons.some(x=>S.settings.addons.find(y=>y.id===x.id)?.childSeat);add(has,has?'Child seat added (children under 4)':'Children under 4 riding — add a child seat')}
  add(a.acks.length===S.settings.legal.acks.length,`Acknowledgments ${a.acks.length}/${S.settings.legal.acks.length}`);
  const need=rateFor(v).deposit;const held=secHeld(a);
  add(held>=need||!!a.depOverride,held>=need?`Security deposit collected (${money(held)})`:a.depOverride?'Deposit override: '+a.depOverride:`Security deposit ${money(held)} of ${money(need)} collected`);
  add(!!a.sigCust,a.sigCust?'Renter signed':'Renter signature needed');
  add(!!a.sigStaff,a.sigStaff?'Staff signed':'Staff signature needed');
  return L;
}
function coRefresh(){
  coReadForm();const a=CO;
  if(a.vehicleId){const q=quote(coQ(a));$('#co_quote').innerHTML=quoteHTML(q,false)+`<div class="sumline"><span>Paid toward rental</span><span>${money(agrPaid(a))}</span></div><div class="sumline"><b>Balance</b><b>${money(q.total-agrPaid(a))}</b></div>`}else $('#co_quote').innerHTML='<div class="muted">Choose a vehicle.</div>';
  const need=rateFor(veh(a.vehicleId)).deposit,held=secHeld(a);
  $('#co_dep').innerHTML=`<div class="sumline"><span>Required</span><span>${money(need)}</span></div><div class="sumline"><span>Collected</span><b>${money(held)}</b></div>
   <button class="btn p" style="width:100%;margin-top:8px" onclick="coToPOS()">Collect deposit & payment at POS</button>
`;
  const L=coChecks(a);$('#co_checks').innerHTML=L.map(x=>`<li class="${x.ok?'ok':'no'}"><span class="i">${x.ok?'✓':'✗'}</span><span>${esc(x.label)}</span></li>`).join('');
  $('#co_release').disabled=L.some(x=>!x.ok);
}
function coSaveDraft(msg){
  coReadForm();if(!CO.customerId){toast('Choose the renter first','bad');return false}
  const P=S.settings.policy;if(!S.agreements.find(x=>x.id===CO.id)&&CO.no===P.agreementPrefix+P.nextAgreement)P.nextAgreement++;
  if(S.agreements.some(x=>x.no===CO.no&&x.id!==CO.id)){toast('Agreement number already used','bad');return false}
  CO.quote=CO.vehicleId?quote(coQ(CO)):null;
  const i=S.agreements.findIndex(x=>x.id===CO.id);const copy=JSON.parse(JSON.stringify(CO));if(i>=0)S.agreements[i]=copy;else S.agreements.push(copy);
  // move reservation deposits onto agreement
  if(CO.resId)S.payments.filter(p=>p.resId===CO.resId&&!p.agreementId).forEach(p=>p.agreementId=CO.id);
  save();if(msg)toast('Draft saved','ok');return true;
}
function coToPOS(){if(!coSaveDraft())return;const a=agr(CO.id);if(!a.vehicleId){toast('Choose a vehicle first','bad');return}
  posReset();POS.customerId=a.customerId;const need=rateFor(veh(a.vehicleId)).deposit,held=secHeld(a);
  if(need-held>0)POS.cart.push({kind:'secdep',refId:a.id,desc:`Security deposit — ${a.no}`,qty:1,price:r2(need-held),taxable:false});
  const bal=agrBalance(a);if(bal>0)POS.cart.push({kind:'agreement',refId:a.id,desc:`Rental charges — ${a.no}`,qty:1,price:bal,taxable:false,editable:true});
  POS.returnTo={tab:'checkout',arg:a.id};go('pos');}
function coRelease(){
  coReadForm();const L=coChecks(CO);if(L.some(x=>!x.ok)){toast('Resolve all release checks first','bad');return}
  if(!coSaveDraft())return;const a=agr(CO.id);
  a.status='Open';a.out.dt=a.start;a.released=isoDT();a.releasedBy=USER?.id||'';a.quote=quote(coQ(a));a.policyVersion=S.settings.legal.version;
  a.legalSnapshot=JSON.parse(JSON.stringify({bizProtect:S.settings.legal.bizProtect,custProtect:S.settings.legal.custProtect,acks:S.settings.legal.acks,terms:S.settings.legal.terms,cancellation:S.settings.legal.cancellation,privacy:S.settings.legal.privacy}));
  const v=veh(a.vehicleId);v.status='Rented';
  if(a.resId){const r=resv(a.resId);if(r){r.status='Converted';r.agreementId=a.id}}
  save();toast('Vehicle released — agreement '+a.no+' is open','ok');CO=null;go('checkout',a.id);
}
function coDiscard(){if(secHeld(CO)>0||S.payments.some(p=>p.agreementId===CO.id&&!p.resId)){toast('Payments are recorded on this draft — refund them first or release the vehicle','bad');return}confirmBox('Discard this draft agreement?',()=>{S.agreements=S.agreements.filter(x=>x.id!==CO.id||x.status!=='Draft');S.payments.filter(p=>p.agreementId===CO.id).forEach(p=>{if(p.resId)p.agreementId=undefined});save();CO=null;go('checkout')})}
function coView(){
  const a=agr(CO.id)||CO;const c=cust(a.customerId),v=veh(a.vehicleId);
  PG().innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Agreement ${esc(a.no)}</h2><span class="tag ${a.status==='Open'?'b':'ok'}">${a.status}</span><div style="flex:1"></div>
   <button class="btn" onclick="printAgreement(agr('${a.id}'))">Print agreement</button>${a.status==='Open'?`<button class="btn p" onclick="go('checkin','${a.id}')">Check-In</button>`:''}<button class="btn" onclick="CO=null;go('checkout',{})">New agreement</button></div>
   <div class="grid g3" style="margin-top:12px"><div><b>${esc(cFormal(c))}</b><br>${esc(c?.phone||'')}<br>License ${esc(c?.licNo||'')}${a.drivers.length?'<br>Also: '+a.drivers.map(d=>esc(d.name)).join(', '):''}</div><div>${esc(vLabel(v))}<br>Out ${fmtDT(a.out.dt)} · Fuel ${a.out.fuel}<br>Due ${fmtDT(a.due)}</div><div>Total ${money(agrTotal(a))}<br>Paid ${money(agrPaid(a))}<br><b>Balance ${money(agrBalance(a))}</b><br>Deposit held ${money(secHeld(a))}</div></div>
   <p class="note small" style="margin-top:12px">This agreement is locked. Changes are added as dated amendments.</p>
   <h3>Amendments</h3>${(a.amendments||[]).map(m=>`<div class="small">${fmtDT(m.dt)} — ${esc(m.text)}</div>`).join('')||'<div class="muted small">None</div>'}
   <div class="row" style="margin-top:8px"><input id="amd" placeholder="e.g. Return extended to 10/20/2026 5:00 PM by phone"><button class="btn" onclick="addAmendment('${a.id}')">Add amendment</button></div>
   ${a.status==='Open'?`<h3>Extend rental</h3><div class="row">${I('ext_due',a.due,'datetime-local','style="max-width:230px"')}<button class="btn" onclick="extendRental('${a.id}')">Extend due date</button></div>`:''}
  </div>`;
}
function addAmendment(id){const t=V('amd').trim();if(!t)return;const a=agr(id);(a.amendments=a.amendments||[]).push({dt:isoDT(),text:t});save();coView()}
function extendRental(id){const a=agr(id);const nd=V('ext_due');if(new Date(nd)<=new Date(a.due)){toast('New due date must be later','bad');return}
  const cf=conflicts(a.vehicleId,a.due,nd,a.id).filter(b=>b.ref.id!==a.id);if(cf.length){toast('Vehicle is booked: '+cf[0].label,'bad');return}
  (a.amendments=a.amendments||[]).push({dt:isoDT(),text:`Due date extended from ${fmtDT(a.due)} to ${fmtDT(nd)}`});a.due=nd;a.quote=quote(coQ(a));save();toast('Rental extended','ok');coView()}

<script id="js-module-check-in">
/* ================= CHECK-IN ================= */
let CI=null;
PAGES.checkin={t:'Check-In (Returns)',r(arg){
