  <div class="tbl"><table><tr><th>ID</th><th>Name</th><th>Primary job title</th><th>Other titles</th><th>Department</th><th>Reports to</th><th>Phone</th><th>Sign-in</th><th>Status</th></tr>
  ${L.map(e=>{const p=primaryAsg(e),t=p&&jt(p.jobTitleId),others=activeAsg(e).filter(a=>a.type!=='Primary').map(a=>jt(a.jobTitleId)?.name).filter(Boolean);
    return `<tr class="click" onclick="viewEmployee('${e.id}')"><td>${e.id}</td><td><b>${esc(eName(e))}</b>${e.isOwner?' <span class="tag b">Owner</span>':''}</td><td>${esc(t?.name||'—')}</td><td class="small">${esc(others.join(', '))}</td><td>${esc(dept(t?.departmentId)?.name||'')}</td><td>${esc(e.reportsTo?eName(emp(e.reportsTo)):'—')}</td><td>${esc(e.phone||'')}</td><td>${e.pinHash?'<span class="tag ok">PIN set</span>':'<span class="tag warn">No PIN</span>'}</td><td>${statusTag(e.status)}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No employees match</td></tr>'}</table></div>
  <p class="muted small">Employee records hold only personal and contact details. Job descriptions, duties and responsibilities come from the job titles assigned to them.</p></div>`);
}};
function editEmployee(id){
  const e=id?emp(id):{first:'',last:'',status:'Active',hire:today(),reportsTo:'',location:S.settings.locations[0]?.name||''};
  if(id&&e.id!==USER.id&&!isOwnerUser()&&empRank(e)>myRank()){toast('Your authority level cannot change this employee','bad');return}
  const own=isOwnerUser(),desc=id?empDescendants(id):new Set();
  modal(id?'Edit employee '+id:'New employee',`
   <div class="grid g3">${F('First name',I('em_f',e.first),'req')}${F('Last name',I('em_l',e.last),'req')}${F('Status',SEL('em_st',['Active','On Leave','Inactive'],e.status,'',null))}
   ${F('Phone',I('em_ph',e.phone,'tel'))}${F('Email',I('em_em',e.email,'email'))}${F('Hire date',I('em_h',e.hire,'date'))}
   ${F('Reports to',SEL('em_rep',eOpt(true).filter(o=>o.v!==id&&!desc.has(o.v)),e.reportsTo,'','— Nobody (top) —'))}${F('Work location',SEL('em_loc',S.settings.locations.map(l=>l.name),e.location))}${F('Emergency contact (name & phone)',I('em_ec',e.emergency))}</div>
   ${id?'':`<h3>Primary job title</h3><div class="grid g3">${F('Job title',SEL('em_t',tOpt(true).filter(o=>canAssignTitle(jt(o.v))),'','','— Assign later —'))}${F('Start date',I('em_ts',today(),'date'))}</div><p class="muted small">Add more job titles later under Employee Assignments.</p>`}
   <h3>Sign-in PIN</h3><div class="grid g3">${F(id&&e.pinHash?'New PIN (leave blank to keep)':'PIN (4–8 digits)',I('em_p','','password','inputmode="numeric" autocomplete="new-password"'))}${F('Confirm PIN',I('em_p2','','password','inputmode="numeric" autocomplete="new-password"'))}<div class="muted small" style="align-self:end">${e.pinHash?'A PIN is set.':'No PIN — this person cannot sign in yet.'}</div></div>
   ${own?`<label class="chk" style="margin-top:8px"><input type="checkbox" id="em_own" ${e.isOwner?'checked':''}> Business owner — full access to every screen and Settings</label>`:''}
   ${F('Notes',TA('em_n',e.notes))}`,
   [{t:'Save employee',c:'p',f:m=>{if(saveEmployee(id))closeModal(m)}}],true);
}
function saveEmployee(id){
  const first=V('em_f').trim(),last=V('em_l').trim();if(!first||!last){toast('Enter first and last name','bad');return false}
  const p=V('em_p'),p2=V('em_p2');if(p||p2){if(!/^\d{4,8}$/.test(p)){toast('PIN must be 4 to 8 digits','bad');return false}if(p!==p2){toast('PINs do not match','bad');return false}}
  let e=id&&emp(id);const isNew=!e,own=isOwnerUser(),st=V('em_st');
  if(e&&e.isOwner&&!own&&p){toast('Only the owner can change the owner\'s PIN','bad');return false}
  const ownFlag=own?!!V('em_own'):!!e?.isOwner;
  const owners=S.employees.filter(x=>x.isOwner&&x.status!=='Inactive'&&x.id!==id).length;
  if(e&&e.isOwner&&(!ownFlag||st==='Inactive')&&!owners){toast('Keep at least one active owner','bad');return false}
  if(e&&st==='Inactive'&&e.id===USER.id){toast('You cannot deactivate yourself','bad');return false}
  const rep=V('em_rep');if(rep&&!emp(rep)){toast('Reports-to employee not found','bad');return false}
  if(id&&rep&&(rep===id||empDescendants(id).has(rep))){toast('That reporting line would loop','bad');return false}
  const tId=isNew?V('em_t'):'';if(tId){const t=jt(tId);if(!t||t.status!=='Active'||!canAssignTitle(t)){toast('Choose an active job title you are allowed to assign','bad');return false}}
  const was=e?.status;
  if(isNew){e={id:nextId('employees'),created:isoDT()};S.employees.push(e)}
  Object.assign(e,{first,last,status:st,phone:V('em_ph').trim(),email:V('em_em').trim(),hire:V('em_h'),reportsTo:rep,location:V('em_loc'),emergency:V('em_ec').trim(),notes:V('em_n'),isOwner:ownFlag,updated:isoDT()});
  if(p)e.pinHash=pinHash(e.id,p);
  if(tId)S.assignments.push({id:nextId('assignments'),employeeId:e.id,jobTitleId:tId,type:'Primary',start:V('em_ts')||today(),end:'',status:'Active',by:USER.id,created:isoDT()});
  if(st==='Inactive'&&was!=='Inactive')activeAsg(e).forEach(a=>{a.status='Ended';a.end=today();a.endReason='Employee deactivated'});
  audit(`${isNew?'Created':'Updated'} employee ${e.id} ${eName(e)}${p?' (PIN set)':''}`);save();toast('Employee saved','ok');
  if(e.id===USER.id){USER=e;renderUserChip();renderNav()}rerender();return true;
}
function viewEmployee(id){
  const e=emp(id);if(!e)return;const asg=S.assignments.filter(a=>a.employeeId===id);const act=activeAsg(e),past=asg.filter(a=>a.status!=='Active');
  const reports=S.employees.filter(x=>x.reportsTo===id&&x.status!=='Inactive');const sk=S.employeeSkills.filter(x=>x.employeeId===id);
  modal(eName(e)+' · '+e.id,`<div class="row">${statusTag(e.status)}${e.isOwner?'<span class="tag b">Owner</span>':''}<span class="tag ${e.pinHash?'ok':'warn'}">${e.pinHash?'Can sign in':'No PIN'}</span></div>
   <div class="grid g3" style="margin-top:10px"><div class="small">${esc(e.phone||'—')}<br>${esc(e.email||'')}<br>${esc(e.location||'')}</div><div class="small">Hired ${fmtD(e.hire)||'—'}<br>Reports to: <b>${esc(e.reportsTo?eName(emp(e.reportsTo)):'—')}</b></div><div class="small">Direct reports: ${reports.map(r=>esc(eName(r))).join(', ')||'none'}</div></div>
   <h3>Current job assignments</h3>${act.length?act.map(a=>{const t=jt(a.jobTitleId);return `<div class="card" style="box-shadow:none;margin-bottom:10px"><div class="row"><b>${esc(t?.name||'(missing title)')}</b><span class="tag ${a.type==='Primary'?'b':''}">${a.type}</span><span class="muted small">${a.id} · ${esc(dept(t?.departmentId)?.name||'')} · since ${fmtD(a.start)}</span>${t&&t.status!=='Active'?'<span class="tag bad">Title inactive</span>':''}</div>
     <div class="grid g2"><div><b class="small">Duties</b>${lst(titleDuties(a.jobTitleId))}</div><div><b class="small">Responsibilities</b>${lst(titleResps(a.jobTitleId))}</div></div></div>`}).join(''):'<p class="muted">No current job title.</p>'}
   ${past.length?`<h3>Past assignments</h3><table><tr><th>ID</th><th>Job title</th><th>Type</th><th>From</th><th>To</th><th>Reason</th></tr>${past.map(a=>`<tr><td>${a.id}</td><td>${esc(jt(a.jobTitleId)?.name||'')}</td><td>${a.type}</td><td>${fmtD(a.start)}</td><td>${fmtD(a.end)}</td><td class="small">${esc(a.endReason||'')}</td></tr>`).join('')}</table>`:''}
   <h3>Skills</h3>${sk.length?sk.map(x=>`<span class="tag" style="margin:2px">${esc(skill(x.skillId)?.name||'')} · ${esc(x.level)}</span>`).join(''):'<p class="muted">None recorded</p>'}
   ${e.notes&&can('employees')?`<h3>Notes</h3><p>${esc(e.notes)}</p>`:''}`,
   [...(can('employees')?[{t:'Edit',f:m=>{closeModal(m);editEmployee(id)}}]:[]),...(can('assignments')&&e.status!=='Inactive'?[{t:'Assign job title',c:'p',f:m=>{closeModal(m);editAssignment({employeeId:id})}}]:[])],true);
}
</script>
<script id="js-people-employee-assignments">
/* ================= EMPLOYEE ASSIGNMENTS ================= */
let ASF={q:'',dept:'',title:'',st:'Active'};
PAGES.assignments={t:'Employee Assignments',r(){
  const q=ASF.q.toLowerCase();
  const L=S.assignments.filter(a=>{const e=emp(a.employeeId),t=jt(a.jobTitleId);if(ASF.st!=='All'&&a.status!==ASF.st)return false;if(ASF.dept&&t?.departmentId!==ASF.dept)return false;if(ASF.title&&a.jobTitleId!==ASF.title)return false;return !q||(a.id+' '+eName(e)+' '+(t?.name||'')).toLowerCase().includes(q)})
    .sort((a,b)=>eName(emp(a.employeeId)).localeCompare(eName(emp(b.employeeId)))||(a.type==='Primary'?-1:1));
  mount(`<div class="card" id="as-card"><div class="row" style="margin-bottom:10px">
   <input id="as_q" placeholder="Search employee or title…" value="${esc(ASF.q)}" style="max-width:230px" oninput="ASF.q=this.value;rerender();keepFocus('as_q')">
   <select id="as_fd" style="max-width:210px" onchange="ASF.dept=this.value;ASF.title='';rerender()">${opts(dOpt(),ASF.dept,'All departments')}</select>
   <select id="as_ft" style="max-width:230px" onchange="ASF.title=this.value;rerender()">${opts(tOpt(false,ASF.dept),ASF.title,'All job titles')}</select>
   <select id="as_fst" style="max-width:120px" onchange="ASF.st=this.value;rerender()">${opts(['Active','Ended','All'],ASF.st,null)}</select>
   <div style="flex:1"></div><button class="btn p" onclick="editAssignment()">+ Assign job title</button></div>
  <div class="tbl"><table><tr><th>ID</th><th>Employee</th><th>Job title</th><th>Department</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Assigned by</th><th></th></tr>
  ${L.map(a=>{const e=emp(a.employeeId),t=jt(a.jobTitleId);return `<tr><td>${a.id}</td><td class="click" onclick="viewEmployee('${a.employeeId}')"><b>${esc(eName(e))}</b></td><td class="click" onclick="go('jobdesc','${a.jobTitleId}')">${esc(t?.name||'(missing)')}${t&&t.status!=='Active'?' <span class="tag bad">inactive</span>':''}</td><td>${esc(dept(t?.departmentId)?.name||'')}</td><td><span class="tag ${a.type==='Primary'?'b':''}">${a.type}</span></td><td>${fmtD(a.start)}</td><td>${fmtD(a.end)}</td><td>${statusTag(a.status)}</td><td class="small">${esc(a.by?eName(emp(a.by)):'')}</td><td style="white-space:nowrap">${a.status==='Active'?`${a.type!=='Primary'?`<button class="btn sm" onclick="makePrimary('${a.id}')">Make primary</button> `:''}<button class="btn sm bad" onclick="endAssignment('${a.id}')">End</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="10" class="empty">No assignments match</td></tr>'}</table></div>
  <p class="muted small">Ending an assignment keeps it on record as history. Each assignment links one employee to one job title; the title's duties and responsibilities are never copied into the employee record.</p></div>`);
}};
function editAssignment(pre={}){
  modal('Assign a job title',`<div class="grid g2">${F('Employee',SEL('as_e',eOpt(true),pre.employeeId||'','onchange="asHint()"'),'req')}${F('Job title',SEL('as_t',tOpt(true).filter(o=>canAssignTitle(jt(o.v))),pre.jobTitleId||'','onchange="asHint()"'),'req')}${F('Assignment type',SEL('as_ty',['Primary','Additional'],'','',null))}${F('Start date',I('as_s',today(),'date'),'req')}</div>${F('Notes',I('as_n',''))}<div id="as_hint" style="margin-top:8px"></div>`,
  [{t:'Save assignment',c:'p',f:m=>{if(saveAssignment())closeModal(m)}}]);
  const e=emp(pre.employeeId);if(e)$('#as_ty').value=primaryAsg(e)?'Additional':'Primary';asHint();
}
function asHint(){const e=emp(V('as_e')),t=jt(V('as_t'));const b=$('#as_hint');if(!b)return;if(!e){b.innerHTML='';return}
  const act=activeAsg(e);if(!V('as_t'))$('#as_ty').value=primaryAsg(e)?'Additional':'Primary';
  b.innerHTML=`<div class="note">${esc(eName(e))} currently holds: ${act.map(a=>esc((jt(a.jobTitleId)?.name||'')+' ('+a.type+')')).join(', ')||'no job title'}.${t&&act.some(a=>a.jobTitleId===t.id)?' <b>They already hold this title.</b>':''}</div>`}
function saveAssignment(){
  const e=emp(V('as_e')),t=jt(V('as_t')),type=V('as_ty'),start=V('as_s');
  if(!e||e.status==='Inactive'){toast('Choose a current employee','bad');return false}
  if(!t||t.status!=='Active'){toast('Choose an active job title','bad');return false}
  if(!start){toast('Enter the start date','bad');return false}
  if(!canAssignTitle(t)){toast('Your authority level cannot assign this job title','bad');return false}
  if(e.id===USER.id&&!isOwnerUser()){toast('Only the owner can change your own job titles','bad');return false}
  if(activeAsg(e).some(a=>a.jobTitleId===t.id)){toast('This employee already holds that job title','bad');return false}
  const old=type==='Primary'&&primaryAsg(e);
  if(old)old.type='Additional';
  const a={id:nextId('assignments'),employeeId:e.id,jobTitleId:t.id,type,start,end:'',status:'Active',notes:V('as_n').trim(),by:USER.id,created:isoDT()};S.assignments.push(a);
  audit(`Assigned ${t.id} ${t.name} to ${e.id} as ${type}${old?' (previous primary '+old.id+' is now additional)':''}`);save();toast('Assignment saved','ok');
  if(e.id===USER.id){renderUserChip();renderNav()}rerender();return true;
}
function makePrimary(id){const a=S.assignments.find(x=>x.id===id);const e=emp(a.employeeId),t=jt(a.jobTitleId);if(!canAssignTitle(t)){toast('Your authority level cannot change this assignment','bad');return}
  const old=primaryAsg(e);if(old)old.type='Additional';a.type='Primary';audit(`Made ${id} primary for ${e.id}`);save();if(e.id===USER.id)renderUserChip();rerender()}
function endAssignment(id){
  const a=S.assignments.find(x=>x.id===id);const e=emp(a.employeeId),t=jt(a.jobTitleId);
  if(t&&!canAssignTitle(t)){toast('Your authority level cannot end this assignment','bad');return}
  if(e?.id===USER.id&&!isOwnerUser()){toast('Only the owner can change your own job titles','bad');return}
  modal('End assignment '+id,`<p>${esc(eName(e))} — ${esc(t?.name||'')}</p><div class="grid g2">${F('End date',I('ae_d',today(),'date'),'req')}${F('Reason',SEL('ae_r',['Changed job','Left the company','Temporary assignment finished','Entered in error','Other'],'','',null))}</div>`,
  [{t:'End assignment',c:'p',f:m=>{if(!V('ae_d')){toast('Enter the end date','bad');return}a.status='Ended';a.end=V('ae_d');a.endReason=V('ae_r');audit(`Ended ${id} (${a.endReason})`);save();closeModal(m);if(e?.id===USER.id){renderUserChip();renderNav()}rerender()}}]);
}
</script>
<script id="js-people-people-reports">
/* ================= PEOPLE REPORTS ================= */
let PRT='headcount';
PAGES.peoplereports={t:'People Reports',r(){
  const tabs=[['headcount','Headcount'],['vacancy','Vacancies'],['todo','Records to complete'],['integrity','Data integrity check'],['activity','Activity log']];let h='';
  const tbl=(key,file,head,rows)=>{window._csv[key]=[head,...rows];return `<div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn sm" onclick="downloadFile('${file}',toCSV(window._csv['${key}']),'text/csv')">CSV</button></div><div class="tbl"><table><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${head.length}" class="empty">Nothing to show</td></tr>`}</table></div>`};
  if(PRT==='headcount'){
    h=`<h3>By department</h3>`+tbl('hc1','headcount-by-department.csv',['Department','Active job titles','Employees','Primary assignments','Additional assignments'],deptList(true).map(d=>{const ts=deptTitles(d.id).map(t=>t.id);const A=S.assignments.filter(a=>a.status==='Active'&&ts.includes(a.jobTitleId));return [d.name,deptTitles(d.id).filter(t=>t.status==='Active').length,deptEmployees(d.id).length,A.filter(a=>a.type==='Primary').length,A.filter(a=>a.type!=='Primary').length]}))+
      `<h3>By job title</h3>`+tbl('hc2','headcount-by-title.csv',['Job title','Department','Employees'],titleList(true).map(t=>[t.name,dept(t.departmentId)?.name||'',titleHolders(t.id).length]));
  }else if(PRT==='vacancy'){const size=curSize();
    h=`<p class="muted small">Company size: ${size}.</p>`+tbl('vac','vacancies.csv',['Job title','Department',`Recommended (${size})`,'Filled','Open'],titleList(true).map(t=>{const r=Number(t.staffing?.[size])||0,f=titleHolders(t.id).length;return [t.name,dept(t.departmentId)?.name||'',r,f,r-f]}).filter(r=>r[4]>0));
  }else if(PRT==='todo'){h=tbl('todo','records-to-complete.csv',['Area','What is missing'],recordsToComplete().map(x=>[x.area,x.msg]))}
  else if(PRT==='integrity'){const I=integrityIssues();
    h=`<div class="alert ${I.length?'bad':'ok'}">${I.length?I.length+' problem(s) found.':'No problems found: every ID is unique, every link points to an existing record, and no reporting line loops.'}</div><button class="btn sm" style="margin-bottom:8px" onclick="rerender()">Run check again</button>`+tbl('int','integrity.csv',['Level','Area','Problem'],I.map(x=>[x.lvl,x.area,x.msg]));
  }else{const L=S.audit.slice(-400).reverse();h=tbl('act','activity-log.csv',['Date','Employee','Action'],L.map(a=>[fmtDT(a.dt),eName(emp(a.employeeId)),a.action]))}
  mount(`<div class="card" id="pr-card"><div class="tabs">${tabs.map(([k,l])=>`<a class="${PRT===k?'on':''}" onclick="PRT='${k}';rerender()">${l}</a>`).join('')}</div>${h}</div>`);
}};
</script>
<script id="js-app-start">
/* ================= START ================= */
(async function init(){
  const d=await loadState();if(d)S=mergeDefaults(defaults(),d);
  if(!S.departments.length&&!S.jobTitles.length&&!S.settings.people.seeded)seedOrg();
  refreshPlans();renderNav();save();
  const tick=()=>{$('#clock').textContent=new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};tick();setInterval(tick,30000);
  const sid=sessionStorage.getItem('crs_user');const e=sid&&emp(sid);
  if(e&&e.status!=='Inactive'&&e.pinHash&&!needsSetup())startSession(e,true);else showLock();
  if(/[?&]booking/.test(location.search))openKiosk();
})();
</script>
