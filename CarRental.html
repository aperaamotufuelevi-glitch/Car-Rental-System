<script id="js-org-service">
/* ================= ORGANIZATION SERVICE =================
   Departments, job titles, duties, responsibilities, skills, employees and assignments are
   separate records linked only by IDs. All lookups and rules for them live here. */
const RANK={Owner:5,Executive:4,Manager:3,Supervisor:2,Staff:1};
const AUTH_LEVELS=Object.keys(RANK);
const SIZES=['Small','Medium','Large'];
const SIZE_HINT={Small:'about 3–5 employees; one person may hold several job titles',Medium:'about 6–20 employees; specialized staff in each department',Large:'20+ employees; managers and supervisors per department, more than one location'};
const SKILL_LEVELS=['Basic','Working','Advanced'];
const ID_FMT={departments:['DEP-',3],deptResponsibilities:['DRS-',3],jobTitles:['JT-',3],duties:['DUT-',4],responsibilities:['RSP-',4],skills:['SKL-',3],jobSkills:['JSK-',4],employees:['EMP-',3],employeeSkills:['ESK-',4],assignments:['ASG-',4]};
/* IDs are never reused, even after a record is deleted */
function nextId(coll){
  const [p,w]=ID_FMT[coll];const C=S.settings.people.idCounters;let mx=Number(C[coll])||0;
  S[coll].forEach(r=>{const s=String(r.id);if(s.startsWith(p)){const n=parseInt(s.slice(p.length),10);if(n>mx)mx=n}});
  let n=mx+1,id;do{id=p+String(n).padStart(w,'0');n++}while(S[coll].some(r=>r.id===id));
  C[coll]=n-1;return id;
}
const dept=id=>S.departments.find(x=>x.id===id);
const jt=id=>S.jobTitles.find(x=>x.id===id);
const emp=id=>S.employees.find(x=>x.id===id);
const skill=id=>S.skills.find(x=>x.id===id);
const eName=e=>e?(`${e.first||''} ${e.last||''}`.trim()||e.id):'—';
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const activeAsg=e=>e?S.assignments.filter(a=>a.employeeId===e.id&&a.status==='Active').sort((a,b)=>(a.type==='Primary'?0:1)-(b.type==='Primary'?0:1)):[];
const primaryAsg=e=>activeAsg(e).find(a=>a.type==='Primary');
const empTitles=e=>activeAsg(e).map(a=>jt(a.jobTitleId)).filter(Boolean);
const titleDuties=id=>S.duties.filter(d=>d.jobTitleId===id).sort(byOrder);
const titleResps=id=>S.responsibilities.filter(d=>d.jobTitleId===id).sort(byOrder);
const titleSkills=id=>S.jobSkills.filter(x=>x.jobTitleId===id);
const titleHolders=(id,all)=>S.assignments.filter(a=>a.jobTitleId===id&&(all||a.status==='Active')).map(a=>({a,e:emp(a.employeeId)})).filter(x=>x.e);
const deptTitles=id=>S.jobTitles.filter(t=>t.departmentId===id).sort((a,b)=>a.name.localeCompare(b.name));
const deptEmployees=id=>[...new Set(S.assignments.filter(a=>a.status==='Active'&&jt(a.jobTitleId)?.departmentId===id).map(a=>a.employeeId))].map(emp).filter(e=>e&&e.status!=='Inactive');
function audit(action){S.audit.push({id:uid(),dt:isoDT(),employeeId:USER?.id||'',action});if(S.audit.length>3000)S.audit.splice(0,S.audit.length-3000)}
function empRank(e){if(!e)return 0;if(e.isOwner)return 5;return Math.max(0,...empTitles(e).filter(t=>t.status==='Active').map(t=>RANK[t.authority]||1))}
const myRank=()=>empRank(USER);
const titleRank=t=>(t&&(t.access||[]).includes('*'))?5:(RANK[t?.authority]||1);
function wouldCycleTitle(id,parent){let p=parent;const seen=new Set();while(p&&!seen.has(p)){if(p===id)return true;seen.add(p);p=jt(p)?.reportsTo}return false}
function empDescendants(id){const out=new Set();const walk=x=>S.employees.filter(e=>e.reportsTo===x&&!out.has(e.id)).forEach(e=>{out.add(e.id);walk(e.id)});walk(id);return out}
function denyRank(rank,what){if(isOwnerUser()||rank<=myRank())return false;toast('Your authority level cannot change '+what,'bad');return true}
const canAssignTitle=t=>t&&(isOwnerUser()||titleRank(t)<=myRank());

/* ---- integrity check: duplicate IDs, broken links, loops ---- */
function integrityIssues(){
  const I=[];const add=(lvl,area,msg)=>I.push({lvl,area,msg});
  COLLECTIONS.forEach(c=>{const seen=new Set();(S[c]||[]).forEach(r=>{if(!r.id)add('Error',c,'Record without an ID');else if(seen.has(r.id))add('Error',c,'Duplicate ID '+r.id);else seen.add(r.id)})});
  S.departments.forEach(d=>{if(d.managerId&&!emp(d.managerId))add('Warning','Departments',`${d.id} manager ${d.managerId} no longer exists`)});
  S.deptResponsibilities.forEach(r=>{if(!dept(r.departmentId))add('Error','Department responsibilities',`${r.id} points to missing department ${r.departmentId}`)});
  S.jobTitles.forEach(t=>{if(!dept(t.departmentId))add('Error','Job titles',`${t.id} ${t.name} has no valid department`);if(t.reportsTo&&!jt(t.reportsTo))add('Error','Job titles',`${t.id} reports to missing title ${t.reportsTo}`);if(t.reportsTo&&wouldCycleTitle(t.id,t.reportsTo))add('Error','Job titles',`${t.id} reporting line loops back to itself`)});
  const dupName=(arr,area)=>{const m={};arr.forEach(x=>{const k=(x.name||'').trim().toLowerCase();if(m[k])add('Error',area,`Name "${x.name}" used by ${m[k]} and ${x.id}`);else m[k]=x.id})};
  dupName(S.departments,'Departments');dupName(S.jobTitles,'Job titles');dupName(S.skills,'Skills');
  [['duties','Duties'],['responsibilities','Responsibilities']].forEach(([c,area])=>{const m={};S[c].forEach(r=>{if(!jt(r.jobTitleId))add('Error',area,`${r.id} points to missing job title ${r.jobTitleId}`);const k=r.jobTitleId+'|'+(r.text||'').trim().toLowerCase();if(m[k])add('Warning',area,`${r.id} repeats ${m[k]} on the same title`);else m[k]=r.id})});
  S.jobSkills.forEach(x=>{if(!jt(x.jobTitleId))add('Error','Required skills',`${x.id} points to missing title`);if(!skill(x.skillId))add('Error','Required skills',`${x.id} points to missing skill`)});
  S.employeeSkills.forEach(x=>{if(!emp(x.employeeId))add('Error','Employee skills',`${x.id} points to missing employee`);if(!skill(x.skillId))add('Error','Employee skills',`${x.id} points to missing skill`)});
  S.assignments.forEach(a=>{if(!emp(a.employeeId))add('Error','Assignments',`${a.id} points to missing employee ${a.employeeId}`);const t=jt(a.jobTitleId);if(!t)add('Error','Assignments',`${a.id} points to missing job title ${a.jobTitleId}`);else if(a.status==='Active'&&t.status!=='Active')add('Warning','Assignments',`${a.id} is active on inactive title ${t.name}`)});
  S.employees.forEach(e=>{if(e.reportsTo&&!emp(e.reportsTo))add('Warning','Employees',`${e.id} reports to missing employee`);if(e.reportsTo&&(e.reportsTo===e.id||empDescendants(e.id).has(e.reportsTo)))add('Error','Employees',`${e.id} reporting line loops`);
    const pr=activeAsg(e).filter(a=>a.type==='Primary');if(pr.length>1)add('Error','Employees',`${e.id} has ${pr.length} active primary titles`);
    const pairs={};activeAsg(e).forEach(a=>{if(pairs[a.jobTitleId])add('Warning','Assignments',`${e.id} holds ${a.jobTitleId} twice (${pairs[a.jobTitleId]}, ${a.id})`);else pairs[a.jobTitleId]=a.id});
    if(e.status==='Inactive'&&activeAsg(e).length)add('Warning','Employees',`${e.id} is inactive but still has active assignments`)});
  if(!S.employees.some(e=>e.isOwner&&e.status!=='Inactive'))add('Error','Employees','No active owner account');
  const ids={};document.querySelectorAll('[id]').forEach(el=>{ids[el.id]=(ids[el.id]||0)+1});Object.entries(ids).filter(([,n])=>n>1).forEach(([k,n])=>add('Error','Screen',`Element ID "${k}" appears ${n} times`));
  return I;
}
</script>
<script id="js-auth-service">
/* ================= SIGN-IN SERVICE — employee PIN and workspace access =================
   What each person can open comes from the job titles assigned to them (job title → Workspace access). */
let USER=null;
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a))}
  const mp=Math.pow,maxWord=mp(2,32);let i,j,result='';const words=[];const bitLen=ascii.length*8;
  let hash=sha256.h=sha256.h||[];const k=sha256.k=sha256.k||[];let pc=k.length;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*maxWord)|0;k[pc++]=(mp(c,1/3)*maxWord)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
  return result;
}
const pinHash=(id,pin)=>sha256('crs|'+id+'|'+pin);
function isOwnerUser(){return !!USER&&(USER.isOwner||empTitles(USER).some(t=>t.status==='Active'&&(t.access||[]).includes('*')))}
function myAccess(){ /* null = everything */
  if(!USER)return new Set();if(isOwnerUser())return null;
  const s=new Set(['mywork']);empTitles(USER).filter(t=>t.status==='Active').forEach(t=>(t.access||[]).forEach(k=>s.add(k)));return s;
}
function can(k){if(!USER)return false;if(ADMIN_KEYS.includes(k))return isOwnerUser();const a=myAccess();return a===null||a.has(k)}
const needsSetup=()=>!S.employees.some(e=>e.isOwner&&e.pinHash&&e.status!=='Inactive');
const FAILS={};let lastAct=Date.now();

function showLock(){$('#app').hidden=true;$('#lock').hidden=false;renderLock()}
function renderLock(){
  const b=S.settings.biz;const box=$('#lock-card');
  const head=`<div style="text-align:center">${b.logo?`<img src="${b.logo}" alt="" style="max-height:70px;max-width:200px">`:`<div class="lg lk-lg">CR</div>`}<h2 style="margin:8px 0 2px">${esc(b.name||'Car Rental System')}</h2><p class="muted" style="margin:0 0 16px">Staff sign-in</p></div>`;
  if(needsSetup()){
    box.innerHTML=head+`<div class="note" style="margin-bottom:12px">First-time setup: create the owner account. The owner has full access, sets up job titles, and gives each employee their own PIN.</div>
    <div class="grid g2">${F('First name',I('lk_f',''),'req')}${F('Last name',I('lk_l',''),'req')}${F('Owner PIN (4–8 digits)',I('lk_p','','password','inputmode="numeric" autocomplete="new-password"'),'req')}${F('Confirm PIN',I('lk_p2','','password','inputmode="numeric" autocomplete="new-password"'),'req')}</div>
    <button class="btn p lg" style="width:100%;margin-top:14px" onclick="ownerSetup()">Create owner account</button>`;
  }else{
    const list=S.employees.filter(e=>e.status!=='Inactive'&&e.pinHash).sort((a,b)=>eName(a).localeCompare(eName(b)));
    const last=localStorage.getItem('crs_last_user')||'';
    box.innerHTML=head+`${F('Your name',SEL('lk_e',list.map(e=>({v:e.id,l:eName(e)+' — '+(jt(primaryAsg(e)?.jobTitleId)?.name||(e.isOwner?'Owner':'Staff'))})),last,'','— Choose your name —'),'req')}
    <div style="margin-top:10px">${F('PIN',I('lk_pin','','password','inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')signIn()"'),'req')}</div>
    <div id="lk_msg" class="small" style="color:var(--bad);min-height:18px;margin-top:6px"></div>
    <button class="btn p lg" style="width:100%" onclick="signIn()">Sign in</button>`;
  }
  box.innerHTML+=`<div style="text-align:center;margin-top:18px"><a href="#" class="small muted" onclick="openKiosk();return false">Customer booking page</a></div>`;
  setTimeout(()=>{const f=$('#lk_pin')&&$('#lk_e').value?$('#lk_pin'):$('#lock-card input, #lock-card select');f&&f.focus()},50);
}
function ownerSetup(){
  const f=V('lk_f').trim(),l=V('lk_l').trim(),p=V('lk_p'),p2=V('lk_p2');
  if(!f||!l){toast('Enter your first and last name','bad');return}
  if(!/^\d{4,8}$/.test(p)){toast('PIN must be 4 to 8 digits','bad');return}
  if(p!==p2){toast('PINs do not match','bad');return}
  if(!S.jobTitles.length)seedOrg();
  const e={id:nextId('employees'),first:f,last:l,status:'Active',isOwner:true,hire:today(),created:isoDT(),location:S.settings.locations[0]?.name||''};
  e.pinHash=pinHash(e.id,p);S.employees.push(e);
  const t=S.jobTitles.find(x=>(x.access||[]).includes('*')&&x.status==='Active');
  if(t)S.assignments.push({id:nextId('assignments'),employeeId:e.id,jobTitleId:t.id,type:'Primary',start:today(),end:'',status:'Active',by:e.id,created:isoDT()});
  USER=e;audit('Owner account created');save();startSession(e);
}
function signIn(){
  const id=V('lk_e'),pin=V('lk_pin');const msg=$('#lk_msg');
  if(!id){msg.textContent='Choose your name';return}
  const f=FAILS[id]||{n:0,until:0};if(Date.now()<f.until){msg.textContent=`Too many tries. Wait ${Math.ceil((f.until-Date.now())/1000)} seconds.`;return}
  const e=emp(id);
  if(!e||e.status==='Inactive'||!e.pinHash||pinHash(e.id,pin)!==e.pinHash){S.audit.push({id:uid(),dt:isoDT(),employeeId:id,action:'Failed sign-in (wrong PIN)'});save();f.n++;if(f.n>=5){f.until=Date.now()+60000;f.n=0}FAILS[id]=f;msg.textContent='Name or PIN is not correct';$('#lk_pin').value='';$('#lk_pin').focus();return}
  delete FAILS[id];localStorage.setItem('crs_last_user',id);startSession(e);
}
function startSession(e,resumed){
  USER=e;sessionStorage.setItem('crs_user',e.id);if(!resumed){audit('Signed in');save()}
  $('#lock').hidden=true;$('#app').hidden=false;lastAct=Date.now();renderUserChip();
  go(isOwnerUser()?'dashboard':'mywork');
}
function lockNow(){
  if(USER){audit('Signed out');save()}
  const s=document.getElementById('mod-'+CUR);if(s){s.innerHTML='';s.hidden=true}
  USER=null;ADMIN_UNTIL=0;sessionStorage.removeItem('crs_user');$('#modals').innerHTML='';CO=null;CI=null;posReset();showLock();
}
function renderUserChip(){
  if(!USER)return;const t=jt(primaryAsg(USER)?.jobTitleId);
  $('#userChip').innerHTML=`<b>${esc(eName(USER))}</b><span class="muted small">${esc(t?.name||(USER.isOwner?'Business Owner':'No job title'))}</span>`;
  $('#posBtn').hidden=!can('pos');renderAdminBtn();
}
function changePin(){
  modal('Change my PIN',`<div class="grid g3">${F('Current PIN',I('cp_o','','password','inputmode="numeric" autocomplete="current-password"'))}${F('New PIN (4–8 digits)',I('cp_n','','password','inputmode="numeric" autocomplete="new-password"'))}${F('Confirm new PIN',I('cp_c','','password','inputmode="numeric" autocomplete="new-password"'))}</div>`,
  [{t:'Change PIN',c:'p',f:m=>{if(pinHash(USER.id,V('cp_o'))!==USER.pinHash){toast('Current PIN is not correct','bad');return}if(!/^\d{4,8}$/.test(V('cp_n'))){toast('PIN must be 4 to 8 digits','bad');return}if(V('cp_n')!==V('cp_c')){toast('New PINs do not match','bad');return}USER.pinHash=pinHash(USER.id,V('cp_n'));audit('Changed own PIN');save();closeModal(m);toast('PIN changed','ok')}}]);
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{const m=Number(S.settings.people?.autoLockMin)||0;if(USER&&m>0&&Date.now()-lastAct>m*60000){lockNow();toast('Locked after '+m+' minutes without activity')}},20000);
</script>
<script id="js-admin-service">
/* ================= ADMIN SERVICE — owner-only, password protected =================
   The admin password is separate from the owner's sign-in PIN. It is asked for before the
   Admin Console or Settings opens, and again after a period without activity. */
let ADMIN_UNTIL=0;
const adminCfg=()=>S.settings.admin;
const bytes=s=>unescape(encodeURIComponent(String(s)));
function adminHash(pw,salt){let h='crs-admin|'+salt+'|'+bytes(pw);for(let i=0;i<1500;i++)h=sha256(h+'|'+salt);return h}
function randCode(n){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(n);crypto.getRandomValues(r);return [...r].map(x=>a[x%a.length]).join('')}
const newSalt=()=>randCode(16);
const newRecovery=()=>{const c=randCode(12);return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8)};
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function strongPw(p){return p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p)}
const adminTimeout=()=>(Number(adminCfg().timeoutMin)||10)*60000;
const adminUnlocked=()=>isOwnerUser()&&Date.now()<ADMIN_UNTIL;
function unlockAdmin(){ADMIN_UNTIL=Date.now()+adminTimeout();adminCfg().failN=0;adminCfg().lockUntil=0;renderAdminBtn()}
function lockAdmin(msg){ADMIN_UNTIL=0;renderAdminBtn();if(ADMIN_KEYS.includes(CUR)&&USER)go(isOwnerUser()?'dashboard':'mywork');if(msg)toast(msg)}
function renderAdminBtn(){const b=$('#adminBtn');if(!b)return;b.hidden=!isOwnerUser();const on=adminUnlocked();b.textContent=on?'Admin unlocked':'Admin';b.classList.toggle('ok',on)}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(adminUnlocked())ADMIN_UNTIL=Date.now()+adminTimeout()},true));
setInterval(()=>{if(USER&&ADMIN_UNTIL&&Date.now()>=ADMIN_UNTIL){ADMIN_UNTIL=0;renderAdminBtn();if(ADMIN_KEYS.includes(CUR)){go(isOwnerUser()?'dashboard':'mywork');toast('Admin section locked after no activity')}}},15000);

function showRecoveryCode(code,then){
  modal('Your admin recovery code',`<p>Write this code down and keep it somewhere safe, away from the computer. It is the <b>only</b> way to reset the admin password if you forget it. It will not be shown again.</p>
   <div style="font:700 26px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:14px;border:2px dashed var(--brand);border-radius:10px;margin:10px 0">${code}</div>
   <label class="chk"><input type="checkbox" id="rc_ok"> I have written the recovery code down</label>`,
   [{t:'Print code',f:()=>printHTML(letterhead()+`<h1>Admin recovery code</h1><p style="font:700 28px monospace;letter-spacing:.1em">${code}</p><p>Created ${fmtDT(isoDT())}. Keep this paper in a safe place.</p>`)},
    {t:'Done',c:'p',f:m=>{if(!V('rc_ok')){toast('Tick the box once the code is written down','bad');return}closeModal(m);then&&then()}}]);
}
function adminPrompt(then){
  if(!isOwnerUser()){toast('The Admin section is for the owner only','bad');return}
  const A=adminCfg();
  if(!A.passHash){
    modal('Create your admin password',`<p class="muted">The admin password protects Settings and the Admin Console. It is separate from your sign-in PIN — use something only you know.</p>
     <div class="grid g3">${F('Your sign-in PIN',I('ap_pin','','password','inputmode="numeric" autocomplete="current-password"'),'req')}${F('New admin password',I('ap_n','','password','autocomplete="new-password"'),'req')}${F('Confirm admin password',I('ap_c','','password','autocomplete="new-password"'),'req')}</div>
     <p class="muted small">At least 8 characters, with letters and numbers.</p>`,
     [{t:'Create password',c:'p',f:m=>{
       if(pinHash(USER.id,V('ap_pin'))!==USER.pinHash){toast('Your PIN is not correct','bad');return}
       const n=V('ap_n');if(!strongPw(n)){toast('Use at least 8 characters with letters and numbers','bad');return}if(n!==V('ap_c')){toast('Passwords do not match','bad');return}
       const code=newRecovery();A.salt=newSalt();A.passHash=adminHash(n,A.salt);A.recoveryHash=adminHash(normCode(code),A.salt);
       audit('Admin password created');save();closeModal(m);unlockAdmin();showRecoveryCode(code,then)}}]);
    return;
  }
  if(Date.now()<(A.lockUntil||0)){toast(`Admin is locked after too many wrong passwords. Try again in ${Math.ceil((A.lockUntil-Date.now())/60000)} minute(s).`,'bad');return}
  const id=modal('Admin password required',`<p class="muted">Enter your admin password to open the Admin section.</p>${F('Admin password',I('ap_p','','password','autocomplete="current-password" onkeydown="if(event.key===\'Enter\')adminTry()"'))}
    <div id="ap_msg" class="small" style="color:var(--bad);min-height:18px;margin-top:6px"></div><a href="#" class="small" onclick="closeTopModal();adminRecover();return false">Forgot admin password?</a>`,
    [{t:'Unlock',c:'p',f:()=>adminTry()}]);
  window._adminThen=then;window._adminModal=id;setTimeout(()=>keepFocus('ap_p'),50);
}
function adminTry(){
  const A=adminCfg();
  if(adminHash(V('ap_p'),A.salt)===A.passHash){closeModal(window._adminModal);unlockAdmin();audit('Admin section unlocked');save();const t=window._adminThen;window._adminThen=null;t&&t();return}
  A.failN=(A.failN||0)+1;audit('Wrong admin password');
  if(A.failN>=5){A.lockUntil=Date.now()+5*60000;A.failN=0;save();closeModal(window._adminModal);toast('Too many wrong passwords — Admin is locked for 5 minutes','bad');return}
  save();$('#ap_msg').textContent=`Password is not correct (${5-A.failN} tries left)`;$('#ap_p').value='';keepFocus('ap_p');
}
function adminRecover(){
  modal('Reset admin password',`<p class="muted">Use the recovery code you wrote down when you created the admin password.</p>
   <div class="grid g2">${F('Recovery code',I('ar_c','','text','placeholder="XXXX-XXXX-XXXX" autocomplete="off"'),'req')}${F('Your sign-in PIN',I('ar_pin','','password','inputmode="numeric"'),'req')}${F('New admin password',I('ar_n','','password','autocomplete="new-password"'),'req')}${F('Confirm new password',I('ar_x','','password','autocomplete="new-password"'),'req')}</div>`,
   [{t:'Reset password',c:'p',f:m=>{const A=adminCfg();
     if(Date.now()<(A.lockUntil||0)){toast('Admin is locked for a few minutes after too many wrong tries','bad');return}
     if(pinHash(USER.id,V('ar_pin'))!==USER.pinHash||adminHash(normCode(V('ar_c')),A.salt)!==A.recoveryHash){A.failN=(A.failN||0)+1;if(A.failN>=5){A.lockUntil=Date.now()+5*60000;A.failN=0}audit('Failed admin password reset');save();toast('Recovery code or PIN is not correct','bad');return}
     const n=V('ar_n');if(!strongPw(n)){toast('Use at least 8 characters with letters and numbers','bad');return}if(n!==V('ar_x')){toast('Passwords do not match','bad');return}
     const code=newRecovery();A.salt=newSalt();A.passHash=adminHash(n,A.salt);A.recoveryHash=adminHash(normCode(code),A.salt);
     audit('Admin password reset with recovery code');save();closeModal(m);unlockAdmin();showRecoveryCode(code,()=>go('admin'))}}]);
}
function adminBackup(){adminCfg().lastBackup=isoDT();audit('Full backup exported');save();downloadFile('car-rental-backup-'+today()+'.json',JSON.stringify(S),'application/json');rerender()}
const lastSignIn=id=>{for(let i=S.audit.length-1;i>=0;i--){const a=S.audit[i];if(a.employeeId===id&&a.action==='Signed in')return a.dt}return ''};

/* ================= ADMIN CONSOLE ================= */
let ADT='overview',ADL={emp:'',q:''};
PAGES.admin={t:'Admin Console',r(){
  const A=adminCfg();const tabs=[['overview','Overview'],['staff','Staff sign-in'],['access','Workspace access'],['log','Activity log'],['security','Security']];let h='';
  const head=`<div class="card" id="ad-head" style="padding:10px 14px"><div class="row"><span class="tag ok">Admin unlocked</span><span class="muted small">Locks after ${A.timeoutMin} minutes without activity, or when you sign out.</span><div style="flex:1"></div><button class="btn sm" onclick="go('settings')">Settings</button><button class="btn sm bad" onclick="lockAdmin('Admin section locked')">Lock admin now</button></div></div>`;
  if(ADT==='overview'){
    const td=today();const fails=S.audit.filter(a=>a.dt.slice(0,10)===td&&/^Failed sign-in|^Wrong admin/.test(a.action)).length;
    const signIn=S.employees.filter(e=>e.status!=='Inactive'&&e.pinHash).length;const owners=S.employees.filter(e=>e.isOwner&&e.status!=='Inactive');
    const iss=integrityIssues().length;const lb=A.lastBackup;
    h=`<div class="kpis"><div class="kpi"><small>Staff who can sign in</small><b>${signIn}</b></div><div class="kpi"><small>Owner accounts</small><b>${owners.length}</b></div><div class="kpi"><small>Failed sign-ins today</small><b style="color:${fails?'var(--bad)':''}">${fails}</b></div><div class="kpi"><small>Last backup</small><b style="font-size:15px;color:${!lb||daysBetween(lb,td)>7?'var(--bad)':''}">${lb?fmtDT(lb):'Never'}</b></div><div class="kpi"><small>Data problems</small><b style="color:${iss?'var(--bad)':''}">${iss}</b></div></div>
     <div class="row"><button class="btn p" onclick="adminBackup()">Export full backup now</button><button class="btn" onclick="go('settings','ai')">Restore / erase data</button><button class="btn" onclick="go('employees')">Employees</button><button class="btn" onclick="go('jobtitles')">Job titles</button><button class="btn" onclick="PRT='integrity';go('peoplereports')">Data integrity check</button></div>
     <h3>Owner accounts</h3><p>${owners.map(o=>esc(eName(o))+' ('+o.id+')').join(', ')}</p>
     <h3>Recent security events</h3>${adminLogTable(S.audit.filter(a=>/sign|admin|PIN|owner|backup/i.test(a.action)).slice(-15).reverse())}`;
  }else if(ADT==='staff'){
    const L=S.employees.slice().sort((a,b)=>eName(a).localeCompare(eName(b)));
    h=`<p class="muted small">Reset a PIN when someone forgets it, or remove a PIN to stop that person signing in. Removing a PIN does not change their job records.</p><div class="tbl"><table><tr><th>ID</th><th>Name</th><th>Job titles</th><th>Status</th><th>Sign-in</th><th>Last sign-in</th><th></th></tr>${L.map(e=>`<tr><td>${e.id}</td><td><b>${esc(eName(e))}</b>${e.isOwner?' <span class="tag b">Owner</span>':''}</td><td class="small">${esc(empTitles(e).map(t=>t.name).join(', ')||'—')}</td><td>${statusTag(e.status)}</td><td>${e.pinHash?'<span class="tag ok">PIN set</span>':'<span class="tag warn">No PIN</span>'}</td><td class="small">${fmtDT(lastSignIn(e.id))||'—'}</td><td style="white-space:nowrap"><button class="btn sm" onclick="adResetPin('${e.id}')">${e.pinHash?'Reset PIN':'Set PIN'}</button>${e.pinHash&&e.id!==USER.id?` <button class="btn sm bad" onclick="adRemovePin('${e.id}')">Remove PIN</button>`:''} <button class="btn sm" onclick="adOwner('${e.id}')">${e.isOwner?'Remove owner':'Make owner'}</button></td></tr>`).join('')}</table></div>`;
  }else if(ADT==='access'){
    const cols=accessGroups().flatMap(([,items])=>items);const T=titleList(true);
    h=`<p class="muted small">Tick the screens each job title can open. Every employee gets the screens of all the job titles assigned to them. Settings and the Admin Console are never given to a job title — they are owner only.</p>
    <div class="tbl"><table class="matrix"><tr><th>Job title</th>${cols.map(([k,l])=>`<th class="vt" title="${esc(l)}"><span>${esc(l)}</span></th>`).join('')}</tr>
    ${T.map(t=>{const all=(t.access||[]).includes('*');return `<tr><td style="white-space:nowrap"><b>${esc(t.name)}</b><br><span class="muted small">${titleHolders(t.id).length} employee(s)</span></td>${all?`<td colspan="${cols.length}"><span class="tag b">Full access (owner level)</span></td>`:cols.map(([k])=>`<td class="c"><input type="checkbox" ${(t.access||[]).includes(k)?'checked':''} onchange="adAccess('${t.id}','${k}',this.checked)" aria-label="${esc(t.name+' — '+accessLabel(k))}"></td>`).join('')}</tr>`}).join('')}</table></div>`;
  }else if(ADT==='log'){
    const q=ADL.q.toLowerCase();const L=S.audit.filter(a=>(!ADL.emp||a.employeeId===ADL.emp)&&(!q||a.action.toLowerCase().includes(q))).slice(-500).reverse();
    window._csv.adlog=[['Date','Employee','Action'],...L.map(a=>[fmtDT(a.dt),eName(emp(a.employeeId)),a.action])];
    h=`<div class="row" style="margin-bottom:10px"><select id="ad_le" style="max-width:240px" onchange="ADL.emp=this.value;rerender()">${opts(eOpt(false),ADL.emp,'All employees')}</select><input id="ad_lq" placeholder="Search actions…" value="${esc(ADL.q)}" style="max-width:240px" oninput="ADL.q=this.value;rerender();keepFocus('ad_lq')"><div style="flex:1"></div><button class="btn sm" onclick="downloadFile('activity-log.csv',toCSV(window._csv.adlog),'text/csv')">CSV</button></div>${adminLogTable(L)}`;
  }else{
    h=`<div class="grid g2" style="align-items:start"><div class="card" style="box-shadow:none"><h2>Change admin password</h2><div class="grid g3">${F('Current password',I('as_o','','password','autocomplete="current-password"'))}${F('New password',I('as_n','','password','autocomplete="new-password"'))}${F('Confirm',I('as_c','','password','autocomplete="new-password"'))}</div><button class="btn p" style="margin-top:8px" onclick="adChangePw()">Change password</button>
      <h3>Recovery code</h3><p class="muted small">Make a new recovery code if the old one was lost or seen by someone else. The old code stops working.</p>${F('Current password',I('as_r','','password','autocomplete="current-password"'))}<button class="btn" style="margin-top:8px" onclick="adNewCode()">Make a new recovery code</button></div>
     <div class="card" style="box-shadow:none"><h2>Locking</h2>${F('Lock the Admin section after no activity for',`<select onchange="adminCfg().timeoutMin=Number(this.value);save();unlockAdmin();rerender()">${opts([5,10,15,30].map(v=>({v,l:v+' minutes'})),A.timeoutMin,null)}</select>`)}
      <div style="margin-top:10px">${F('Lock the whole screen (all staff) after no activity for',`<select onchange="setS('people.autoLockMin',Number(this.value))">${opts([{v:0,l:'Never'},{v:5,l:'5 minutes'},{v:10,l:'10 minutes'},{v:15,l:'15 minutes'},{v:30,l:'30 minutes'},{v:60,l:'1 hour'}],S.settings.people.autoLockMin,null)}</select>`)}</div>
      <p class="muted small" style="margin-top:10px">Staff PINs lock for 1 minute after 5 wrong tries. The admin password locks for 5 minutes after 5 wrong tries. Everything is stored on this device only — export a backup regularly.</p></div></div>`;
  }
  mount(head+`<div class="card" id="ad-card"><div class="tabs">${tabs.map(([k,l])=>`<a class="${ADT===k?'on':''}" onclick="ADT='${k}';rerender()">${l}</a>`).join('')}</div>${h}</div>`);
}};
function adminLogTable(L){return L.length?`<div class="tbl"><table><tr><th>Date</th><th>Employee</th><th>Action</th></tr>${L.map(a=>`<tr><td class="small" style="white-space:nowrap">${fmtDT(a.dt)}</td><td class="small">${esc(a.employeeId?eName(emp(a.employeeId)):'—')}</td><td class="small">${esc(a.action)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No activity</div>'}
function adResetPin(id){const e=emp(id);
  modal(`${e.pinHash?'Reset':'Set'} PIN — ${eName(e)}`,`<div class="grid g2">${F('New PIN (4–8 digits)',I('ad_p','','password','inputmode="numeric" autocomplete="new-password"'))}${F('Confirm PIN',I('ad_p2','','password','inputmode="numeric" autocomplete="new-password"'))}</div><p class="muted small">Give the new PIN to ${esc(e.first||'the employee')} in person.</p>`,
  [{t:'Save PIN',c:'p',f:m=>{const p=V('ad_p');if(!/^\d{4,8}$/.test(p)){toast('PIN must be 4 to 8 digits','bad');return}if(p!==V('ad_p2')){toast('PINs do not match','bad');return}const had=!!e.pinHash;e.pinHash=pinHash(e.id,p);delete FAILS[e.id];audit(`PIN ${had?'reset':'set'} for ${e.id} by admin`);save();closeModal(m);toast('PIN saved','ok');rerender()}}])}
function adRemovePin(id){const e=emp(id);if(e.isOwner&&!S.employees.some(x=>x.id!==id&&x.isOwner&&x.pinHash&&x.status!=='Inactive')){toast('This is the only owner who can sign in','bad');return}
  confirmBox(`Remove ${eName(e)}'s PIN? They will not be able to sign in until a new PIN is set.`,()=>{e.pinHash='';audit('PIN removed for '+id);save();rerender()})}
function adOwner(id){const e=emp(id);
  if(e.isOwner){if(!S.employees.some(x=>x.id!==id&&x.isOwner&&x.status!=='Inactive'&&x.pinHash)){toast('Keep at least one owner who can sign in','bad');return}
    confirmBox(`Remove owner rights from ${eName(e)}? They keep only the screens of their job titles.`,()=>{e.isOwner=false;audit('Owner rights removed from '+id);save();if(id===USER.id){ADMIN_UNTIL=0;renderUserChip();go('mywork')}else rerender()})}
  else{if(e.status==='Inactive'){toast('Reactivate this employee first','bad');return}confirmBox(`Give ${eName(e)} owner rights? Owners can open every screen and the Admin section (with the admin password).`,()=>{e.isOwner=true;audit('Owner rights given to '+id);save();rerender()})}}
function adAccess(tid,k,on){const t=jt(tid);if(!t)return;const a=new Set(t.access||[]);on?a.add(k):a.delete(k);t.access=[...a];audit(`${on?'Gave':'Removed'} "${accessLabel(k)}" ${on?'to':'from'} ${t.name}`);save();if(empTitles(USER).some(x=>x.id===tid))renderNav()}
function adChangePw(){const A=adminCfg();if(adminHash(V('as_o'),A.salt)!==A.passHash){toast('Current password is not correct','bad');return}const n=V('as_n');if(!strongPw(n)){toast('Use at least 8 characters with letters and numbers','bad');return}if(n!==V('as_c')){toast('Passwords do not match','bad');return}
  const code=newRecovery();A.salt=newSalt();A.passHash=adminHash(n,A.salt);A.recoveryHash=adminHash(normCode(code),A.salt);audit('Admin password changed');save();showRecoveryCode(code,()=>rerender())}
function adNewCode(){const A=adminCfg();if(adminHash(V('as_r'),A.salt)!==A.passHash){toast('Password is not correct','bad');return}const code=newRecovery();A.recoveryHash=adminHash(normCode(code),A.salt);audit('New admin recovery code made');save();showRecoveryCode(code,()=>rerender())}
</script>

function seedOrg(){
  const has=(coll,name)=>S[coll].find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());
  const acc=a=>a==='ALL'?['*']:a==='NOSETTINGS'?moduleKeys().filter(k=>k!=='settings'):a.slice();
  let added=0;
  SEED.skills.forEach(([n,c])=>{if(!has('skills',n)){S.skills.push({id:nextId('skills'),name:n,category:c,description:'',status:'Active'});added++}});
  SEED.departments.forEach(([n,ds,rs])=>{if(has('departments',n))return;const d={id:nextId('departments'),name:n,description:ds,managerId:'',status:'Active',created:isoDT()};S.departments.push(d);
    rs.forEach(t=>S.deptResponsibilities.push({id:nextId('deptResponsibilities'),departmentId:d.id,text:t}));added++});
  const made=[];
  SEED.titles.forEach(s=>{if(has('jobTitles',s.n))return;const dp=has('departments',SEED.departments[s.d-1][0]);
    const t={id:nextId('jobTitles'),name:s.n,departmentId:dp?.id||'',description:s.desc,qualifications:s.q,minExperience:s.x,reportsTo:'',authority:s.a,employmentType:s.t,
      staffing:{Small:s.st[0],Medium:s.st[1],Large:s.st[2]},staffNote:s.note||'',status:'Active',access:acc(s.acc),created:isoDT()};
    S.jobTitles.push(t);made.push([t,s]);added++;
    s.du.forEach((x,i)=>S.duties.push({id:nextId('duties'),jobTitleId:t.id,text:x,order:i+1}));
    s.rs.forEach((x,i)=>S.responsibilities.push({id:nextId('responsibilities'),jobTitleId:t.id,text:x,order:i+1}));
    s.sk.forEach(([sn,l,r])=>{const k=has('skills',sn);if(k)S.jobSkills.push({id:nextId('jobSkills'),jobTitleId:t.id,skillId:k.id,level:l,required:r})});
  });
  made.forEach(([t,s])=>{if(s.r){const p=has('jobTitles',s.r);if(p&&p.id!==t.id)t.reportsTo=p.id}});
  S.settings.people.seeded=true;return added;
}
</script>

const lst=(rows,empty)=>rows.length?`<ol class="dl">${rows.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ol>`:`<p class="muted small">${empty||'None listed'}</p>`;

<script id="js-people-my-work-each-person-s-own-workspace">
/* ================= MY WORK — each person's own workspace ================= */
PAGES.mywork={t:'My Work',r(){
  const e=USER;const act=activeAsg(e);const td=today(),now=new Date();const Q=[];
  const q=(when,what,who,click,lvl)=>Q.push({when,what,who,click,lvl});
  if(can('reservations')||can('checkout'))S.reservations.filter(r=>['Confirmed','Deposit Paid','Inquiry'].includes(r.status)&&r.start.slice(0,10)===td).forEach(r=>q(fmtDT(r.start).split(' ').slice(1).join(' '),'Pick-up',cName(cust(r.customerId))+' · '+(r.vehicleId?vLabel(veh(r.vehicleId)):(r.category||'')+' (any)'),can('checkout')?`go('checkout',{resId:'${r.id}'})`:`go('reservations')`));
  if(can('reservations'))S.reservations.filter(r=>r.status==='Inquiry').forEach(r=>q(fmtD(r.start),'Booking request to answer',cName(cust(r.customerId))+' · '+(r.category||''),`go('reservations')`,'warn'));
  if(can('checkin')){S.agreements.filter(a=>a.status==='Open').forEach(a=>{const late=new Date(a.due)<now;if(late||a.due.slice(0,10)===td)q(fmtDT(a.due),late?'Overdue return':'Return due',a.no+' · '+cName(cust(a.customerId))+' · '+vLabel(veh(a.vehicleId)),`go('checkin','${a.id}')`,late?'bad':'')})}
  if(can('maint'))S.maintenance.filter(m=>m.status==='Open').forEach(m=>q(fmtD(m.date),'Open maintenance',vLabel(veh(m.vehicleId))+' · '+(m.work||''),`editMaint('${m.id}')`));
  if(can('damage'))S.damages.filter(d=>!['Paid','Closed'].includes(d.status)).forEach(d=>q(fmtD(d.date),'Damage record: '+d.status,vLabel(veh(d.vehicleId)),`editDamage('${d.id}')`,'warn'));
  if(can('plans'))S.plans.filter(p=>p.status==='Active').forEach(p=>p.schedule.forEach((i,ix)=>{if(i.status==='Late')q(fmtD(i.due),'Late plan installment',p.no+' #'+(ix+1)+' · '+cName(cust(p.customerId)),`viewPlan('${p.id}')`,'bad')}));
  if(can('payments'))S.agreements.filter(a=>a.status==='Closed'&&secHeld(a)>0.004&&a.in&&daysBetween(a.in.dt,td)>S.settings.policy.depositRefundDays).forEach(a=>q(fmtD(a.in.dt),'Deposit refund overdue',a.no+' · '+money(secHeld(a)),`go('payments')`,'bad'));
  if(can('compliance'))complianceItems().filter(x=>x.days<=30).forEach(x=>q(x.date?fmtD(x.date):'—',x.what,x.who,`go('compliance')`,x.days<0?'bad':'warn'));
  if(isOwnerUser()){const lb=S.settings.admin.lastBackup;if(!lb||daysBetween(lb,td)>7)q('—','No data backup in the last 7 days',lb?'Last backup '+fmtD(lb):'Never backed up',`go('admin')`,'bad');if(!S.settings.admin.passHash)q('—','Set your admin password','Protects Settings and the Admin Console',`go('admin')`,'warn')}
  if(can('employees'))S.employees.filter(x=>x.status==='Active'&&!x.pinHash).forEach(x=>q('—','Employee has no sign-in PIN',eName(x),`editEmployee('${x.id}')`,'warn'));
  const screens=accessGroups().flatMap(([,items])=>items).filter(([k])=>can(k));
  const tnames=act.map(a=>jt(a.jobTitleId)?.name).filter(Boolean);
  mount(`<div class="card" id="mw-head"><div class="row"><div><h2 style="margin:0">${esc(eName(e))}</h2><span class="muted">${e.id} · ${esc(tnames.join(' · ')||(e.isOwner?'Business Owner':'No job title assigned yet'))}</span></div><div style="flex:1"></div><button class="btn sm" onclick="changePin()">Change my PIN</button><button class="btn sm" onclick="lockNow()">Lock / switch user</button></div></div>
  <div class="grid g2" style="align-items:start">
   <div class="card" id="mw-queue"><h2>Today's work <span class="tag">${Q.length}</span></h2>${Q.length?`<div class="tbl"><table><tr><th>When</th><th>What</th><th>Details</th></tr>${Q.map(x=>`<tr class="click" onclick="${x.click}"><td style="white-space:nowrap">${esc(x.when)}</td><td><span class="tag ${x.lvl||'b'}">${esc(x.what)}</span></td><td>${esc(x.who)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nothing waiting for you right now.</div>'}</div>
   <div class="card" id="mw-screens"><h2>Your workspace</h2><p class="muted small" style="margin-top:-6px">The screens your job title${act.length>1?'s give':' gives'} you.</p><div class="mw-tiles">${screens.map(([k,l])=>`<button class="btn" onclick="go('${k}')">${esc(l)}</button>`).join('')||'<p class="muted">No screens yet — ask the owner to assign your job title.</p>'}</div></div>
  </div>
  ${act.map(a=>{const t=jt(a.jobTitleId);if(!t)return '';return `<div class="card" id="mw-job-${a.id}"><div class="row"><h2 style="margin:0">${esc(t.name)}</h2><span class="tag ${a.type==='Primary'?'b':''}">${a.type} job</span><span class="muted small">${esc(dept(t.departmentId)?.name||'')} · reports to ${esc(jt(t.reportsTo)?.name||'—')}</span></div>
   <p>${esc(t.description||'')}</p><div class="grid g2"><div><h3>My duties — tasks I perform</h3>${lst(titleDuties(t.id))}</div><div><h3>My responsibilities — what I am accountable for</h3>${lst(titleResps(t.id))}</div></div></div>`}).join('')}`);
}};
</script>

function recordsToComplete(){
  const R=[];const add=(area,msg)=>R.push({area,msg});
  titleList(true).forEach(t=>{if(!titleDuties(t.id).length)add('Job title',`${t.name}: no duties`);if(!titleResps(t.id).length)add('Job title',`${t.name}: no responsibilities`);if(!titleSkills(t.id).length)add('Job title',`${t.name}: no required skills`);if(!(t.description||'').trim())add('Job title',`${t.name}: no job description`)});
  deptList(true).forEach(d=>{if(!d.managerId)add('Department',`${d.name}: no manager named`)});
  empList(true).forEach(e=>{if(!primaryAsg(e))add('Employee',`${eName(e)}: no primary job title`);if(!e.pinHash&&e.status==='Active')add('Employee',`${eName(e)}: no sign-in PIN`);if(!e.reportsTo&&!e.isOwner)add('Employee',`${eName(e)}: no reporting manager`)});
  return R;
}
</script>

   ${F('Department description',TA('dp_desc',d.description))}
   <h3>Department responsibilities <span class="muted small" style="text-transform:none;letter-spacing:0">— each is its own record</span></h3><div id="dp_resps"></div>
   <div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="dp_newr" placeholder="Add a responsibility for this department" onkeydown="if(event.key==='Enter')dpAddResp()"><button class="btn sm" type="button" onclick="dpAddResp()">Add</button></div>
   <p class="muted small">Deactivating keeps the department's history; its job titles and assignments are not deleted.</p>`,
   [{t:'Save department',c:'p',f:m=>{if(saveDept(id))closeModal(m)}}],true);
  dpResps();
}
function dpResps(){const live=DRS_EDIT.filter(r=>!r.del);$('#dp_resps').innerHTML=live.length?`<table>${DRS_EDIT.map((r,i)=>r.del?'':`<tr><td style="width:76px" class="muted small">${r.id||'new'}</td><td><input id="dpr_${i}" value="${esc(r.text)}" onchange="DRS_EDIT[${i}].text=this.value"></td><td style="width:40px"><button class="btn sm bad" type="button" onclick="DRS_EDIT[${i}].del=true;dpResps()">×</button></td></tr>`).join('')}</table>`:'<p class="muted small">None yet.</p>'}
function dpAddResp(){const v=V('dp_newr').trim();if(!v)return;if(DRS_EDIT.some(r=>!r.del&&r.text.trim().toLowerCase()===v.toLowerCase())){toast('Already listed','bad');return}DRS_EDIT.push({text:v});$('#dp_newr').value='';dpResps();keepFocus('dp_newr')}
function saveDept(id){
  const name=V('dp_name').trim();if(!name){toast('Enter the department name','bad');return false}
  if(S.departments.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){toast('Another department already has that name','bad');return false}
  const mgr=V('dp_mgr');if(mgr&&!emp(mgr)){toast('Manager not found','bad');return false}
  let d=id&&dept(id);const isNew=!d;
  if(isNew){d={id:nextId('departments'),created:isoDT()};S.departments.push(d)}
  Object.assign(d,{name,description:V('dp_desc').trim(),managerId:mgr,status:V('dp_st'),updated:isoDT()});
  DRS_EDIT.forEach(r=>{const txt=(r.text||'').trim();
    if(r.id){const rec=S.deptResponsibilities.find(x=>x.id===r.id&&x.departmentId===d.id);if(!rec)return;if(r.del||!txt)S.deptResponsibilities=S.deptResponsibilities.filter(x=>x.id!==r.id);else rec.text=txt}
    else if(!r.del&&txt)S.deptResponsibilities.push({id:nextId('deptResponsibilities'),departmentId:d.id,text:txt})});
  audit(`${isNew?'Created':'Updated'} department ${d.id} ${d.name}`);save();toast('Department saved','ok');rerender();return true;
}
function viewDept(id){
  const d=dept(id);const ts=deptTitles(id);const es=deptEmployees(id);const rs=S.deptResponsibilities.filter(r=>r.departmentId===id);
  modal(d.name+' · '+d.id,`<div class="row">${statusTag(d.status)}<span>Manager: <b>${esc(d.managerId?eName(emp(d.managerId)):'—')}</b></span></div><p>${esc(d.description||'')}</p>
   <h3>Department responsibilities</h3>${rs.length?`<ol class="dl">${rs.map(r=>`<li>${esc(r.text)} <span class="muted small">${r.id}</span></li>`).join('')}</ol>`:'<p class="muted">None recorded</p>'}
   <h3>Job titles in this department</h3><table><tr><th>ID</th><th>Title</th><th>Authority</th><th>Status</th><th class="r">Assigned</th></tr>${ts.map(t=>`<tr class="click" onclick="closeTopModal();go('jobdesc','${t.id}')"><td>${t.id}</td><td>${esc(t.name)}</td><td>${esc(t.authority)}</td><td>${statusTag(t.status)}</td><td class="r">${titleHolders(t.id).length}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">None</td></tr>'}</table>
   <h3>Assigned employees</h3>${es.length?es.map(e=>`<span class="tag b" style="margin:2px">${esc(eName(e))}</span>`).join(''):'<p class="muted">None</p>'}`,
   [{t:'Edit',c:'p',f:m=>{closeModal(m);editDept(id)}}],true);
}
</script>
<script id="js-people-job-titles">
/* ================= JOB TITLES ================= */
let JTF={q:'',dept:'',size:'',st:'Active'};
PAGES.jobtitles={t:'Job Titles',r(){
  const q=JTF.q.toLowerCase();
  const L=S.jobTitles.filter(t=>(JTF.st==='All'||t.status===JTF.st)&&(!JTF.dept||t.departmentId===JTF.dept)&&(!JTF.size||Number(t.staffing?.[JTF.size])>0)&&(!q||(t.id+' '+t.name+' '+(t.description||'')).toLowerCase().includes(q)))
    .sort((a,b)=>(dept(a.departmentId)?.name||'').localeCompare(dept(b.departmentId)?.name||'')||a.name.localeCompare(b.name));
  mount(`<div class="card" id="jt-card"><div class="row" style="margin-bottom:10px">
   <input id="jt_q" placeholder="Search job titles…" value="${esc(JTF.q)}" style="max-width:230px" oninput="JTF.q=this.value;rerender();keepFocus('jt_q')">
   <select id="jt_fd" style="max-width:220px" onchange="JTF.dept=this.value;rerender()">${opts(dOpt(),JTF.dept,'All departments')}</select>
   <select id="jt_fs" style="max-width:200px" onchange="JTF.size=this.value;rerender()">${opts(SIZES.map(s=>({v:s,l:'Used in a '+s.toLowerCase()+' business'})),JTF.size,'All company sizes')}</select>
   <select id="jt_fst" style="max-width:130px" onchange="JTF.st=this.value;rerender()">${opts(['Active','Inactive','All'],JTF.st,null)}</select>
   <div style="flex:1"></div><button class="btn p" onclick="editTitle()">+ New job title</button></div>
  <div class="tbl"><table><tr><th>ID</th><th>Job title</th><th>Department</th><th>Authority</th><th>Type</th><th>Reports to</th><th class="r">Duties / resp.</th><th class="r">Recommended (${curSize()})</th><th class="r">Assigned</th><th>Status</th><th></th></tr>
  ${L.map(t=>`<tr class="click" onclick="go('jobdesc','${t.id}')"><td>${t.id}</td><td><b>${esc(t.name)}</b></td><td>${esc(dept(t.departmentId)?.name||'—')}</td><td>${esc(t.authority)}</td><td>${esc(t.employmentType||'')}</td><td>${esc(jt(t.reportsTo)?.name||'—')}</td><td class="r">${titleDuties(t.id).length} / ${titleResps(t.id).length}</td><td class="r">${Number(t.staffing?.[curSize()])||0}</td><td class="r">${titleHolders(t.id).length}</td><td>${statusTag(t.status)}</td><td style="white-space:nowrap" onclick="event.stopPropagation()"><button class="btn sm" onclick="editTitle('${t.id}')">Edit</button> <button class="btn sm" onclick="copyTitle('${t.id}')">Duplicate</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">No job titles match</td></tr>'}</table></div>
  <p class="muted small">Click a title to open its job description. Each title keeps its own duties, responsibilities and skills; Duplicate copies them into new, separate records.</p></div>`);
}};
function editTitle(id){
  const t=id?jt(id):{name:'',departmentId:JTF.dept||'',description:'',qualifications:'',minExperience:'',reportsTo:'',authority:'Staff',employmentType:'Full-time',staffing:{Small:0,Medium:1,Large:1},staffNote:'',status:'Active',access:[]};
  if(id&&denyRank(titleRank(t),'this job title'))return;
  const L=S.settings.lists,own=isOwnerUser(),mine=myAccess(),all=(t.access||[]).includes('*');
  const levels=AUTH_LEVELS.filter(a=>own||RANK[a]<=myRank());
  modal(id?`Edit job title ${id}`:'New job title',`
   <div class="grid g3">${F('Job title name (one title only)',I('jt_name',t.name),'req')}${F('Department',SEL('jt_dept',dOpt(!id),t.departmentId),'req')}${F('Reports to (job title)',SEL('jt_rep',tOpt(false).filter(o=>!id||!wouldCycleTitle(id,o.v)),t.reportsTo,'','— Top of organization —'))}
   ${F('Authority level',SEL('jt_auth',levels,t.authority,'',null))}${F('Employment type',SEL('jt_type',L.employmentTypes,t.employmentType))}${F('Minimum experience',SEL('jt_exp',L.experienceLevels,t.minExperience))}</div>
   ${F('Job description',TA('jt_desc',t.description,'rows=3'))}${F('Required qualifications',TA('jt_qual',t.qualifications,'rows=2'))}
   <h3>Recommended staffing by company size</h3><div class="grid g4">${SIZES.map(s=>F(s+' business',I('jt_s'+s,t.staffing?.[s]??0,'number','min=0 step=1'))).join('')}${F('Status',SEL('jt_st',['Active','Inactive'],t.status,'',null))}</div>
   ${F('Staffing note',I('jt_note',t.staffNote,'text','placeholder="e.g. in a small business the inspector also details vehicles"'))}
   <h3>Workspace access — screens a person with this job title can open</h3>
   ${own?`<label class="chk"><input type="checkbox" id="jt_all" ${all?'checked':''} onchange="$$('.jt_acc').forEach(x=>{if(x.dataset.ok==='1')x.disabled=this.checked})"> Full access to every screen, including Settings (owner level)</label>`:''}
   <div class="grid g4" style="margin-top:6px">${accessGroups().map(([g,items])=>`<div><b class="small">${esc(g)}</b>${items.map(([k,l])=>{const ok=own||mine?.has(k);return `<label class="chk"><input type="checkbox" class="jt_acc" data-ok="${ok?1:0}" value="${k}" ${(t.access||[]).includes(k)?'checked':''} ${(!ok||all)?'disabled':''}> ${esc(l)}</label>`}).join('')}</div>`).join('')}</div>
   <p class="muted small">Duties, responsibilities and required skills are separate records: edit them in Duties & Responsibilities and Employee Skills.</p>`,
   [...(id?[{t:'Delete',c:'bad',f:()=>deleteTitle(id)}]:[]),{t:'Save job title',c:'p',f:m=>{if(saveTitle(id))closeModal(m)}}],true);
}
function saveTitle(id){
  const name=V('jt_name').trim();if(!name){toast('Enter the job title','bad');return false}
  if(S.jobTitles.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){toast('A job title with that name already exists','bad');return false}
  const dep=dept(V('jt_dept'));if(!dep){toast('Choose the department','bad');return false}
  if(dep.status!=='Active'&&(!id||jt(id).departmentId!==dep.id)){toast('That department is inactive','bad');return false}
  const rep=V('jt_rep');if(rep&&!jt(rep)){toast('Reports-to title not found','bad');return false}
  if(id&&rep&&wouldCycleTitle(id,rep)){toast('That reporting line would loop back to this title','bad');return false}
  const auth=V('jt_auth');if(denyRank(RANK[auth],'a title at that authority level'))return false;
  const own=isOwnerUser(),prev=id?(jt(id).access||[]):[];let access;
  if(own&&V('jt_all'))access=['*'];
  else{const sel=$$('.jt_acc').filter(x=>x.checked&&x.dataset.ok==='1').map(x=>x.value);const locked=prev.filter(k=>k!=='*'&&!(own||myAccess()?.has(k)));access=[...new Set([...sel,...locked])];if(!own&&prev.includes('*'))access=['*']}
  let t=id&&jt(id);const isNew=!t;
  if(isNew){t={id:nextId('jobTitles'),created:isoDT()};S.jobTitles.push(t)}
  Object.assign(t,{name,departmentId:dep.id,reportsTo:rep,authority:auth,employmentType:V('jt_type'),minExperience:V('jt_exp'),description:V('jt_desc').trim(),qualifications:V('jt_qual').trim(),
    staffing:Object.fromEntries(SIZES.map(s=>[s,Math.max(0,Math.round(VN('jt_s'+s)))])),staffNote:V('jt_note').trim(),status:V('jt_st'),access,updated:isoDT()});
  audit(`${isNew?'Created':'Updated'} job title ${t.id} ${t.name}`);save();toast('Job title saved','ok');
  if(USER&&empTitles(USER).some(x=>x.id===t.id)){renderUserChip();renderNav()}rerender();return true;
}
function deleteTitle(id){
  if(S.assignments.some(a=>a.jobTitleId===id)){toast('This title has assignment history — set it to Inactive instead','bad');return}
  if(S.jobTitles.some(t=>t.reportsTo===id)){toast('Other titles report to this one — change them first','bad');return}
  const t=jt(id);confirmBox(`Delete ${t.name} (${id}) and its own duties, responsibilities and required skills? No other title is affected.`,()=>{
    S.jobTitles=S.jobTitles.filter(x=>x.id!==id);S.duties=S.duties.filter(x=>x.jobTitleId!==id);S.responsibilities=S.responsibilities.filter(x=>x.jobTitleId!==id);S.jobSkills=S.jobSkills.filter(x=>x.jobTitleId!==id);
    audit('Deleted job title '+id+' '+t.name);save();closeTopModal();toast('Job title deleted','ok');rerender()});
}
function copyTitle(id){
  const s=jt(id);if(denyRank(titleRank(s),'this job title'))return;
  let n='Copy of '+s.name,k=2;while(S.jobTitles.some(x=>x.name.toLowerCase()===n.toLowerCase()))n=`Copy of ${s.name} (${k++})`;
  const t={...JSON.parse(JSON.stringify(s)),id:nextId('jobTitles'),name:n,status:'Inactive',created:isoDT(),updated:''};
  if(!isOwnerUser()&&(t.access||[]).includes('*'))t.access=[];
  S.jobTitles.push(t);
  titleDuties(id).forEach(d=>S.duties.push({id:nextId('duties'),jobTitleId:t.id,text:d.text,order:d.order}));
  titleResps(id).forEach(d=>S.responsibilities.push({id:nextId('responsibilities'),jobTitleId:t.id,text:d.text,order:d.order}));
  titleSkills(id).forEach(x=>S.jobSkills.push({id:nextId('jobSkills'),jobTitleId:t.id,skillId:x.skillId,level:x.level,required:x.required}));
  audit(`Duplicated ${s.id} as ${t.id}`);save();toast(`${t.id} created (inactive) with its own copies`,'ok');rerender();editTitle(t.id);
}
</script>
<script id="js-people-job-descriptions">
/* ================= JOB DESCRIPTIONS ================= */
let JD={sel:'',q:'',dept:''};
PAGES.jobdesc={t:'Job Descriptions',r(arg){
  if(arg&&jt(arg)){JD.sel=arg;JD.dept='';JD.q=''}
  const q=JD.q.toLowerCase();
  const L=S.jobTitles.filter(t=>(!JD.dept||t.departmentId===JD.dept)&&(!q||(t.id+' '+t.name).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  if(!JD.sel||!jt(JD.sel))JD.sel=L[0]?.id||'';
  mount(`<div class="split" id="jd-layout"><div class="card" id="jd-list">
   <input id="jd_q" placeholder="Search titles…" value="${esc(JD.q)}" oninput="JD.q=this.value;rerender();keepFocus('jd_q')"><select id="jd_fd" style="margin-top:6px" onchange="JD.dept=this.value;rerender()">${opts(dOpt(),JD.dept,'All departments')}</select>
   <div style="margin-top:8px">${L.map(t=>`<div class="jd-item ${t.id===JD.sel?'on':''}" data-id="${t.id}" onclick="jdSelect('${t.id}')"><b>${esc(t.name)}</b>${t.status!=='Active'?' <span class="tag bad">Inactive</span>':''}<br><span class="muted small">${t.id} · ${esc(dept(t.departmentId)?.name||'')}</span></div>`).join('')||'<div class="empty">No titles</div>'}</div></div>
   <div class="card" id="jd-detail"></div></div>`);

function jdSelect(id){JD.sel=id;$$('#jd-list .jd-item').forEach(x=>x.classList.toggle('on',x.dataset.id===id));jdDetail();if(innerWidth<860)$('#jd-detail').scrollIntoView({behavior:'smooth'})}
function jdBody(t){

  return `<div class="grid g3" style="margin:12px 0">
   <div><span class="muted small">Department</span><br><b>${esc(d?.name||'—')}</b></div><div><span class="muted small">Reports to</span><br><b>${esc(jt(t.reportsTo)?.name||'Top of organization')}</b></div><div><span class="muted small">Authority level</span><br><b>${esc(t.authority)}</b></div>
   <div><span class="muted small">Employment type</span><br><b>${esc(t.employmentType||'—')}</b></div><div><span class="muted small">Minimum experience</span><br><b>${esc(t.minExperience||'—')}</b></div><div><span class="muted small">Recommended staffing</span><br><b>${SIZES.map(s=>s+' '+(Number(t.staffing?.[s])||0)).join(' · ')}</b></div></div>
  <h3>Job description</h3><p style="white-space:pre-wrap">${esc(t.description||'—')}</p>
  <h3>Required qualifications</h3><p style="white-space:pre-wrap">${esc(t.qualifications||'—')}</p>
  <h3>Required skills</h3>${sk.length?`<table><tr><th>Skill</th><th>Level</th><th>Required / preferred</th></tr>${sk.map(x=>`<tr><td>${esc(skill(x.skillId)?.name||'(removed skill)')}</td><td>${esc(x.level)}</td><td>${esc(x.required)}</td></tr>`).join('')}</table>`:'<p class="muted">None listed</p>'}
  <div class="grid g2"><div><h3>Duties — tasks performed</h3>${lst(titleDuties(t.id))}</div><div><h3>Responsibilities — accountable for</h3>${lst(titleResps(t.id))}</div></div>`;
}
function jdDetail(){
  const box=$('#jd-detail');const t=jt(JD.sel);if(!t){box.innerHTML='<div class="empty">Choose a job title</div>';return}
  const holders=titleHolders(t.id),past=titleHolders(t.id,true).filter(x=>x.a.status!=='Active');
  box.innerHTML=`<div class="row"><h2 style="margin:0">${esc(t.name)}</h2><span class="tag">${t.id}</span>${statusTag(t.status)}<div style="flex:1"></div>${can('jobtitles')?`<button class="btn sm" onclick="editTitle('${t.id}')">Edit title</button>`:''}${can('dutyresp')?`<button class="btn sm" onclick="go('dutyresp','${t.id}')">Edit duties & responsibilities</button>`:''}<button class="btn sm p" onclick="printJD('${t.id}')">Print</button></div>

  ${past.length?`<p class="muted small">${past.length} past assignment(s) are kept on record.</p>`:''}`;

function printJD(id){const t=jt(id);printHTML(letterhead()+`<h1>Job Description — ${esc(t.name)}</h1><div class="muted">${t.id} · ${esc(dept(t.departmentId)?.name||'')} · Printed ${fmtD(today())}</div>`+jdBody(t)+`<h2>Acknowledgment</h2><table><tr><td style="width:50%;height:60px;vertical-align:bottom">Employee signature / date</td><td style="vertical-align:bottom">Supervisor signature / date</td></tr></table>`)}
</script>
<script id="js-people-duties-responsibilities">
/* ================= DUTIES & RESPONSIBILITIES ================= */
let DU={title:'',dept:''};
PAGES.dutyresp={t:'Duties & Responsibilities',r(arg){
  if(arg&&jt(arg)){DU.title=arg;DU.dept=''}
  const L=titleList(false,DU.dept);const t=jt(DU.title);
  mount(`<div class="card" id="du-pick"><div class="row"><select id="du_fd" style="max-width:220px" onchange="DU.dept=this.value;DU.title='';rerender()">${opts(dOpt(),DU.dept,'All departments')}</select><select id="du_t" style="max-width:320px" onchange="DU.title=this.value;rerender()">${opts(L.map(x=>({v:x.id,l:x.name+' · '+x.id})),DU.title,'— Choose a job title —')}</select>${t?`<button class="btn sm" onclick="DU.title='';rerender()">Back to overview</button>`:''}</div>
  <p class="muted small" style="margin:8px 0 0"><b>Duties</b> are the specific tasks the person performs. <b>Responsibilities</b> are the outcomes and obligations the person is accountable for. They are stored separately, and each belongs only to the selected job title.</p></div>
  ${t?duPanels(t):`<div class="card" id="du-overview"><h2>Overview</h2><div class="tbl"><table><tr><th>Job title</th><th>Department</th><th class="r">Duties</th><th class="r">Responsibilities</th><th></th></tr>${L.map(x=>{const nd=titleDuties(x.id).length,nr=titleResps(x.id).length;return `<tr class="click" onclick="DU.title='${x.id}';rerender()"><td><b>${esc(x.name)}</b> <span class="muted small">${x.id}</span></td><td>${esc(dept(x.departmentId)?.name||'')}</td><td class="r">${nd}</td><td class="r">${nr}</td><td>${!nd||!nr?'<span class="tag warn">Incomplete</span>':''}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No job titles</td></tr>'}</table></div></div>`}`);
}};
function duPanels(t){
  const panel=(coll,label,hint,pfx)=>{const rows=duRows(coll,t.id);
    return `<div class="card" id="du-${coll}"><h2>${label} <span class="tag">${rows.length}</span></h2><p class="muted small" style="margin-top:-6px">${hint}</p>
    <table>${rows.map((r,i)=>`<tr><td style="width:80px" class="muted small">${r.id}</td><td><input id="${pfx}_${r.id}" value="${esc(r.text)}" onchange="duSet('${coll}','${r.id}',this.value)"></td><td style="width:112px;white-space:nowrap"><button class="btn sm" ${i?'':'disabled'} onclick="duMove('${coll}','${r.id}',-1)">↑</button> <button class="btn sm" ${i<rows.length-1?'':'disabled'} onclick="duMove('${coll}','${r.id}',1)">↓</button> <button class="btn sm bad" onclick="duDel('${coll}','${r.id}')">×</button></td></tr>`).join('')||'<tr><td class="muted">None yet</td></tr>'}</table>
    <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="${pfx}_new" placeholder="Add a ${coll==='duties'?'duty':'responsibility'}" onkeydown="if(event.key==='Enter')duAdd('${coll}','${t.id}','${pfx}_new')"><button class="btn p sm" onclick="duAdd('${coll}','${t.id}','${pfx}_new')">Add</button></div></div>`};
  return `<div class="card" id="du-head" style="padding:10px 14px"><div class="row"><b>${esc(t.name)}</b><span class="tag">${t.id}</span><span class="muted">${esc(dept(t.departmentId)?.name||'')}</span>${statusTag(t.status)}<div style="flex:1"></div>
   <select id="du_copy" style="max-width:240px">${opts(tOpt(false).filter(o=>o.v!==t.id),'','Copy from another title…')}</select><button class="btn sm" onclick="duCopy('${t.id}')">Copy in</button>${can('jobdesc')?`<button class="btn sm" onclick="go('jobdesc','${t.id}')">View job description</button>`:''}</div></div>
   <div class="grid g2" style="align-items:start">${panel('duties','Duties','Specific tasks this employee performs.','dud')}${panel('responsibilities','Responsibilities','Areas, outcomes and obligations this employee is accountable for.','dur')}</div>`;
}
const duRows=(coll,tid)=>coll==='duties'?titleDuties(tid):titleResps(tid);
const duRankOk=tid=>!denyRank(titleRank(jt(tid)),'this job title');
function duAdd(coll,tid,inp){
  if(!jt(tid)){toast('Job title not found','bad');return}if(!duRankOk(tid))return;
  const v=V(inp).trim();if(!v){toast('Type the text first','bad');return}
  const rows=duRows(coll,tid);if(rows.some(r=>r.text.trim().toLowerCase()===v.toLowerCase())){toast('Already listed for this title','bad');return}
  S[coll].push({id:nextId(coll),jobTitleId:tid,text:v,order:(rows.length?Math.max(...rows.map(r=>r.order||0)):0)+1,created:isoDT()});
  audit(`Added ${coll==='duties'?'duty':'responsibility'} to ${tid}`);save();rerender();keepFocus(inp);
}
function duSet(coll,id,v){
  const r=S[coll].find(x=>x.id===id);if(!r)return;if(!duRankOk(r.jobTitleId)){rerender();return}
  v=v.trim();if(!v){toast('Text cannot be empty — use × to remove it','bad');rerender();return}
  if(duRows(coll,r.jobTitleId).some(x=>x.id!==id&&x.text.trim().toLowerCase()===v.toLowerCase())){toast('Already listed for this title','bad');rerender();return}
  r.text=v;r.updated=isoDT();audit('Edited '+id);save();toast('Saved '+id,'ok');
}
function duMove(coll,id,dir){const r=S[coll].find(x=>x.id===id);if(!r||!duRankOk(r.jobTitleId))return;const rows=duRows(coll,r.jobTitleId);rows.forEach((x,i)=>x.order=i+1);const i=rows.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=rows.length)return;[rows[i].order,rows[j].order]=[rows[j].order,rows[i].order];save();rerender()}
function duDel(coll,id){const r=S[coll].find(x=>x.id===id);if(!r||!duRankOk(r.jobTitleId))return;confirmBox(`Remove ${id} from ${jt(r.jobTitleId)?.name}? No other job title is affected.`,()=>{S[coll]=S[coll].filter(x=>x.id!==id);audit('Removed '+id);save();rerender()})}
function duCopy(tid){
  const src=V('du_copy');if(!src){toast('Choose the title to copy from','bad');return}if(!duRankOk(tid))return;let n=0;
  ['duties','responsibilities'].forEach(coll=>duRows(coll,src).forEach(r=>{const rows=duRows(coll,tid);if(rows.some(x=>x.text.trim().toLowerCase()===r.text.trim().toLowerCase()))return;S[coll].push({id:nextId(coll),jobTitleId:tid,text:r.text,order:rows.length+1,created:isoDT()});n++}));
  audit(`Copied ${n} item(s) from ${src} into ${tid}`);save();toast(n+' item(s) copied as new, separate records','ok');rerender();
}
</script>

  else{const G=skillGaps();h=`<div class="row" style="margin-bottom:8px"><span class="muted small">Required skills from each person's current job titles that are missing or below the required level.</span><div style="flex:1"></div>${csvBtn('gap','skills-gap.csv',[['Employee','Job title','Skill','Required level','Has'],...G.map(g=>[g.e,g.t,g.s,g.need,g.has])])}</div>

<script id="js-people-organizational-structure">
/* ================= ORGANIZATIONAL STRUCTURE ================= */
let OC={view:'people',dept:''};
PAGES.orgchart={t:'Organizational Structure',r(){
  const tabs=[['people','People — who reports to whom'],['titles','Job title hierarchy'],['dept','By department']];let h='';
  if(OC.view==='people'){
    const act=empList(true),ids=new Set(act.map(e=>e.id)),seen=new Set();
    const kids=id=>act.filter(e=>e.reportsTo===id);
    const node=e=>{if(seen.has(e.id))return '';seen.add(e.id);const p=primaryAsg(e),t=p&&jt(p.jobTitleId),extra=activeAsg(e).length-(p?1:0),ch=kids(e.id);
      return `<li><div class="node" onclick="viewEmployee('${e.id}')"><b>${esc(eName(e))}</b>${e.isOwner?' <span class="tag b">Owner</span>':''}<br><span class="small">${esc(t?.name||'No primary title')}</span>${extra>0?` <span class="tag">+${extra} more</span>`:''}<br><span class="muted small">${esc(dept(t?.departmentId)?.name||'')}${e.status!=='Active'?' · '+e.status:''}</span></div>${ch.length?`<ul>${ch.map(node).join('')}</ul>`:''}</li>`};
    const roots=act.filter(e=>!e.reportsTo||!ids.has(e.reportsTo)||e.reportsTo===e.id);
    let tree=roots.map(node).join('');const left=act.filter(e=>!seen.has(e.id));if(left.length)tree+=left.map(node).join('');
    h=act.length?`<div class="tree"><ul>${tree}</ul></div>`:'<div class="empty">No employees yet — add them in Employees.</div>';
  }else if(OC.view==='titles'){
    const L=titleList(true),ids=new Set(L.map(t=>t.id)),seen=new Set();
    const node=t=>{if(seen.has(t.id))return '';seen.add(t.id);const ch=L.filter(x=>x.reportsTo===t.id),hs=titleHolders(t.id);
      return `<li><div class="node" onclick="go('jobdesc','${t.id}')"><b>${esc(t.name)}</b> <span class="tag">${esc(t.authority)}</span><br><span class="muted small">${esc(dept(t.departmentId)?.name||'')}</span><br><span class="small">${hs.length?hs.map(x=>esc(eName(x.e))).join(', '):'<span class="muted">Vacant</span>'}</span></div>${ch.length?`<ul>${ch.map(node).join('')}</ul>`:''}</li>`};
    h=`<div class="tree"><ul>${L.filter(t=>!t.reportsTo||!ids.has(t.reportsTo)).map(node).join('')}${L.filter(t=>!seen.has(t.id)).map(node).join('')}</ul></div>`;
  }else{
    h=`<div class="row" style="margin-bottom:10px"><select id="oc_fd" style="max-width:240px" onchange="OC.dept=this.value;rerender()">${opts(dOpt(true),OC.dept,'All departments')}</select></div>`+
    deptList(true).filter(d=>!OC.dept||d.id===OC.dept).map(d=>{const ts=deptTitles(d.id).filter(t=>t.status==='Active');const ids=new Set(ts.map(t=>t.id)),seen=new Set();
      const node=t=>{if(seen.has(t.id))return '';seen.add(t.id);const ch=ts.filter(x=>x.reportsTo===t.id),hs=titleHolders(t.id);return `<li><div class="node" onclick="go('jobdesc','${t.id}')"><b>${esc(t.name)}</b> <span class="muted small">${t.id}</span><br><span class="small">${hs.length?hs.map(x=>esc(eName(x.e))).join(', '):'<span class="muted">Vacant</span>'}</span></div>${ch.length?`<ul>${ch.map(node).join('')}</ul>`:''}</li>`};
      return `<div class="card" style="box-shadow:none"><h2>${esc(d.name)} <span class="muted small">${d.id} · manager: ${esc(d.managerId?eName(emp(d.managerId)):'—')}</span></h2>${ts.length?`<div class="tree"><ul>${ts.filter(t=>!t.reportsTo||!ids.has(t.reportsTo)).map(node).join('')}${ts.filter(t=>!seen.has(t.id)).map(node).join('')}</ul></div>`:'<p class="muted">No active job titles</p>'}</div>`}).join('');
  }
  mount(`<div class="card" id="oc-card"><div class="tabs">${tabs.map(([k,l])=>`<a class="${OC.view===k?'on':''}" onclick="OC.view='${k}';rerender()">${l}</a>`).join('')}</div>${h}
  <p class="muted small">Hierarchy: Business Owner → General Manager → department managers → supervisors → employees. Lines come from each employee's "Reports to" and each job title's "Reports to".</p></div>`);
}};
</script>
