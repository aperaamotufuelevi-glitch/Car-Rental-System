  <div class="card"><h2>Recently returned</h2><table>${recent.map(a=>`<tr class="click" onclick="go('checkin','${a.id}')"><td>${esc(a.no)}</td><td>${esc(cName(cust(a.customerId)))}</td><td>${fmtDT(a.in?.dt)}</td><td class="r">Balance ${money(agrBalance(a))}</td><td class="r">Deposit held ${money(secHeld(a))}</td></tr>`).join('')||'<tr><td class="muted">None</td></tr>'}</table></div>`;
}};
function ciForm(a){
  CI={dt:isoDT(),loc:a.locIn,fuel:a.out.fuel,clean:'',fees:[],marks:[],notes:'',photos:[],toMaint:false};
  const fees=S.settings.fees.filter(f=>f.kind==='other');
  PG().innerHTML=`<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start">
  <div><div class="card"><h2>Return — ${esc(a.no)}</h2><p>${esc(cFormal(cust(a.customerId)))} · ${esc(vLabel(veh(a.vehicleId)))}<br><span class="muted">Out ${fmtDT(a.out.dt)} · Due ${fmtDT(a.due)} · Fuel out: ${a.out.fuel}</span></p>
   <div class="grid g3">${F('Actual return date & time',I('ci_dt',CI.dt,'datetime-local','onchange="ciCalc()"'),'req')}${F('Return location',SEL('ci_loc',S.settings.locations.map(l=>l.name),CI.loc,'onchange="ciCalc()"',null))}${F('Fuel level in',SEL('ci_fuel',FUEL,CI.fuel,'onchange="ciCalc()"',null))}
   ${F('Cleaning',SEL('ci_clean',S.settings.fees.filter(f=>f.kind==='clean').map(f=>({v:f.id,l:f.name+' — '+money(f.amount)})),'','onchange="ciCalc()"','None'))}${F('Odometer (maintenance only)',I('ci_odo','', 'number'))}</div>
   <h3>Other fees</h3>${fees.map(f=>`<label class="chk"><input type="checkbox" class="ci_fe" data-id="${f.id}" onchange="ciCalc()"> ${esc(f.name)} — ${money(f.amount)}</label>`).join('')||'<p class="muted small">Add fees in Settings.</p>'}</div>
  <div class="card"><h2>Condition compare</h2><div class="grid g2"><div><b class="small">At pick-up</b>${carSVG('ci_out',a.out.marks)}<div class="small" style="white-space:pre-wrap">${esc(a.out.notes||'No notes')}</div>${a.out.photos.length?`<div class="photos" style="margin-top:6px">${a.out.photos.map(p=>`<img src="${p}" onclick="viewImg(this.src)">`).join('')}</div>`:''}</div>
   <div><b class="small">At return — tap to mark NEW damage</b>${carSVG('ci_svg',a.out.marks,CI.marks,'ciMark')}${F('New damage notes',TA('ci_notes','','rows=3'))}<input type="file" accept="image/*" multiple capture="environment" onchange="ciPhotos(this)"><div id="photoBox"></div></div></div>
   <label class="chk" style="margin-top:8px"><input type="checkbox" id="ci_mnt"> Send vehicle to maintenance after return</label></div></div>
  <div style="position:sticky;top:70px"><div class="card"><h2>Final charges</h2><div id="ci_sum"></div><button class="btn ok lg" style="width:100%;margin-top:10px" onclick="ciClose('${a.id}')">Close agreement</button></div></div></div>`;
  ciCalc(a.id);
}
function ciMark(e,svg){CI.marks.push(svgPoint(e,svg));$('#ci_svg').outerHTML=carSVG('ci_svg',agr(CI.aid).out.marks,CI.marks,'ciMark');const t=$('#ci_notes');t.value=(t.value?t.value.trimEnd()+'\n':'')+'N'+CI.marks.length+': ';t.focus()}
function ciPhotos(inp){EDIT=CI;EDIT._pf='photos';(async()=>{for(const f of inp.files)CI.photos.push(await resizeImage(f));inp.value='';rerenderModalPhotos()})()}
function ciQuote(a){
  const fees=[];const fo=FUEL.indexOf(a.out.fuel),fi=FUEL.indexOf(V('ci_fuel'));const fuelFee=S.settings.fees.find(f=>f.kind==='fuel');
  const extra=[];if(fuelFee&&fi<fo){const q=Math.ceil((fo-fi)/2);extra.push({desc:`Refuel — returned ${V('ci_fuel')} vs ${a.out.fuel} out (${q} × 1/4 tank)`,amount:q*fuelFee.amount})}
  if(V('ci_clean'))fees.push({id:V('ci_clean'),qty:1});$$('.ci_fe').filter(x=>x.checked).forEach(x=>fees.push({id:x.dataset.id,qty:1}));
  return quote({...coQ(a),end:V('ci_dt'),locIn:V('ci_loc'),fees,extra});
}
function ciCalc(id){if(id)CI.aid=id;const a=agr(CI.aid);const q=ciQuote(a);const extra=(a.extraCharges||[]).reduce((s,x)=>s+x.amount,0);const paid=agrPaid(a),held=secHeld(a);const bal=r2(q.total+extra-paid);
  $('#ci_sum').innerHTML=quoteHTML(q,false)+(extra?`<div class="sumline"><span>Charges added during rental</span><span>${money(extra)}</span></div>`:'')+`<div class="sumline"><span>Paid</span><span>-${money(paid)}</span></div><div class="sumline t"><span>${bal>=0?'Balance due':'Credit due to renter'}</span><span>${money(Math.abs(bal))}</span></div><div class="sumline muted"><span>Security deposit held</span><span>${money(held)}</span></div>`;}
function ciClose(id){
  const a=agr(id);const q=ciQuote(a);
  a.final=q;a.in={dt:V('ci_dt'),loc:V('ci_loc'),fuel:V('ci_fuel'),odo:V('ci_odo'),marks:CI.marks,notes:V('ci_notes'),photos:CI.photos,by:USER?.id||''};a.status='Closed';
  const v=veh(a.vehicleId);if(v){v.status=V('ci_mnt')?'Maintenance':'Available';if(V('ci_odo'))v.odometer=V('ci_odo')}
  if(V('ci_mnt'))S.maintenance.push({id:uid(),vehicleId:a.vehicleId,date:today(),work:'Inspection after return '+a.no,cost:0,hold:true,holdStart:today(),holdEnd:addDays(today(),1),status:'Open'});
  let dm=null;
  if(CI.marks.length||V('ci_notes').trim()){dm={id:uid(),agreementId:a.id,vehicleId:a.vehicleId,customerId:a.customerId,date:V('ci_dt').slice(0,10),place:'',desc:V('ci_notes'),photos:CI.photos.slice(),status:'Reported',estimate:0,actual:0,lossDays:0,billed:0,created:isoDT()};S.damages.push(dm)}
  save();toast('Agreement closed','ok');ciSettle(a);
  if(dm)setTimeout(()=>{toast('New damage recorded — complete the damage record','');editDamage(dm.id)},300);
}
function ciSettle(a){
  const bal=agrBalance(a),held=secHeld(a);
  PG().innerHTML=`<div class="card" style="max-width:640px"><h2>Settle ${esc(a.no)}</h2>
   <div class="sumline"><span>Final total</span><span>${money(agrTotal(a))}</span></div><div class="sumline"><span>Paid</span><span>${money(agrPaid(a))}</span></div>
   <div class="sumline t"><span>${bal>=0?'Balance due':'Credit owed to renter'}</span><span>${money(Math.abs(bal))}</span></div>
   <div class="sumline"><span>Security deposit held</span><b>${money(held)}</b></div>
   <div class="row" style="margin-top:14px">
    ${bal>0&&held>0?`<button class="btn p" onclick="applyDeposit('${a.id}')">Apply deposit to balance (${money(Math.min(bal,held))})</button>`:''}
    ${bal>0?`<button class="btn p" onclick="posAddAgreement('${a.id}')">Collect balance at POS</button><button class="btn" onclick="newPlan({customerId:'${a.customerId}',agreementId:'${a.id}',amount:${bal}})">Payment plan for balance</button>`:''}
    ${held>0&&bal<=0?`<button class="btn ok" onclick="releaseDeposit('${a.id}')">Refund deposit (${money(held)})</button>`:''}
    ${bal<0?`<button class="btn" onclick="refundCredit('${a.id}')">Refund credit ${money(-bal)}</button>`:''}
   </div>
   <div class="row" style="margin-top:14px"><button class="btn" onclick="printInvoice('${a.id}')">Print final invoice</button><button class="btn" onclick="printAgreement(agr('${a.id}'))">Print agreement</button><button class="btn" onclick="go('checkin')">Back to returns</button></div>
   <p class="muted small" style="margin-top:10px">Deposit refund deadline: ${fmtD(addDays((a.in?.dt||today()).slice(0,10),S.settings.policy.depositRefundDays))} (${S.settings.policy.depositRefundDays} days after return, set in Settings).</p></div>`;
}
function applyDeposit(id){const a=agr(id);const amt=Math.min(agrBalance(a),secHeld(a));if(amt<=0)return;addPayment({amount:amt,method:'Deposit Applied',type:'Rental Charge',agreementId:id,customerId:a.customerId,note:'Security deposit applied to balance'});save();toast('Deposit applied','ok');ciSettle(a)}
function releaseDeposit(id,amount){
  const a=agr(id);const held=secHeld(a);
  modal('Refund security deposit',`<div class="grid g2">${F('Amount',I('rd_amt',amount??held,'number','step=0.01'))}${F('Method',SEL('rd_m',S.settings.lists.payMethods,'Cash','',null))}</div>${F('Note',I('rd_n',''))}`,
  [{t:'Record refund',c:'p',f:m=>{const amt=VN('rd_amt');if(amt<=0||amt>held+0.001){toast('Amount must be between 0 and '+money(held),'bad');return}
    if(V('rd_m')==='Cash'&&!cashOut(amt,'Deposit refund '+a.no))return;
    addPayment({amount:amt,method:V('rd_m'),type:'Deposit Release',agreementId:id,customerId:a.customerId,note:V('rd_n')});save();closeModal(m);toast('Deposit refund recorded','ok');if(CUR==='checkin')ciSettle(a);else rerender()}}]);
}
function refundCredit(id){const a=agr(id);const amt=-agrBalance(a);
  modal('Refund credit',`<div class="grid g2">${F('Amount',I('rc_amt',amt,'number','step=0.01'))}${F('Method',SEL('rc_m',S.settings.lists.payMethods,'Cash','',null))}</div>`,[{t:'Record refund',c:'p',f:m=>{const x=VN('rc_amt');if(V('rc_m')==='Cash'&&!cashOut(x,'Credit refund '+a.no))return;addPayment({amount:x,method:V('rc_m'),type:'Rental Charge',refund:true,agreementId:id,customerId:a.customerId,note:'Credit refund'});save();closeModal(m);ciSettle(a)}}])}
</script>
<script id="js-module-point-of-sale">
/* ================= POINT OF SALE ================= */
const DENOMS=[100,50,20,10,5,1,0.25,0.10,0.05,0.01];
const dLabel=d=>d>=1?'$'+d:Math.round(d*100)+'¢';
let POS={};
function posReset(){POS={cart:[],customerId:'',link:'',tenders:[],method:'Cash',entry:'',discPct:0,discFlat:0,tab:'balances',q:'',returnTo:null,plan:null}}
posReset();
const openShift=()=>S.shifts.find(s=>s.status==='Open');
function shiftExpected(sh){return r2(sh.openFloat+sh.events.reduce((s,e)=>s+(['Sale','Paid In'].includes(e.type)?e.amount:['Paid Out','Refund','Void'].includes(e.type)?-e.amount:0),0))}
function cashOut(amount,reason){const sh=openShift();if(!sh){toast('Open the cash drawer in POS before paying out cash','bad');return false}if(amount>shiftExpected(sh)+0.001){toast('Not enough cash in the drawer ('+money(shiftExpected(sh))+')','bad');return false}sh.events.push({dt:isoDT(),type:'Refund',amount:r2(amount),reason});return true}
function changeBreakdown(amt){let c=Math.round(amt*100);const out=[];for(const d of DENOMS){const dc=Math.round(d*100);const n=Math.floor(c/dc);if(n){out.push([d,n]);c-=n*dc}}return out}

function posTotals(){
  const rate=Number(S.settings.policy.taxRate)||0;
  const lines=POS.cart.map(l=>r2(l.qty*l.price));const gross=r2(lines.reduce((s,x)=>s+x,0));
  const disc=r2(Math.min(gross,gross*(Number(POS.discPct)||0)/100+(Number(POS.discFlat)||0)));
  const k=gross>0?(gross-disc)/gross:1;let tax=0;
  const nets=POS.cart.map((l,i)=>{const after=lines[i]*k;const t=l.taxable?after*rate/100:0;tax+=t;return r2(after+t)});
  const total=r2(nets.reduce((s,x)=>s+x,0));
  const tendered=r2(POS.tenders.reduce((s,t)=>s+t.amount,0));
  const cash=r2(POS.tenders.filter(t=>t.method==='Cash').reduce((s,t)=>s+t.amount,0));
  const planAmt=POS.plan?r2(POS.plan.principal):0;
  const remaining=r2(total-tendered-planAmt);
  const change=remaining<0?r2(Math.min(cash,-remaining)):0;
  return {gross,disc,tax:r2(tax),total,nets,tendered,cash,remaining:Math.max(0,remaining),change,planAmt};
}
PAGES.pos={t:'Point of Sale (POS)',r(){
  const sh=openShift();
  PG().innerHTML=`
  <div class="card" style="padding:10px 14px"><div class="row">
    ${sh?`<span class="tag ok">Drawer open · ${fmtDT(sh.openDt)}</span><span class="muted small">Expected cash: <b>${money(shiftExpected(sh))}</b></span>
      <button class="btn sm" onclick="drawerMove('Paid In')">Paid In</button><button class="btn sm" onclick="drawerMove('Paid Out')">Paid Out</button><button class="btn sm" onclick="drawerMove('No Sale')">No Sale</button><button class="btn sm" onclick="printShift(openShift(),'X')">X Report</button><button class="btn sm bad" onclick="closeShift()">Close drawer</button>`
      :`<span class="tag warn">Cash drawer closed</span><button class="btn sm p" onclick="openShiftModal()">Open drawer</button><span class="muted small">Card, check and transfer sales work without the drawer.</span>`}
    <div style="flex:1"></div><button class="btn sm" onclick="salesHistory()">Sales history</button><button class="btn sm" onclick="heldSales()">Held (${S.held.length})</button>
  </div></div>
  <div class="pos" style="margin-top:14px">
   <div class="card"><div class="tabs" id="posTabs"></div><input id="posQ" placeholder="Search…" value="${esc(POS.q)}" oninput="POS.q=this.value;posCatalog()" style="margin-bottom:10px"><div id="posCat"></div></div>
   <div class="card"><h2>Sale</h2>
    ${F('Customer',custPicker('pos_cust',POS.customerId,'POS.customerId=this.value;POS.link=\'\';posCart();posCatalog()'))}
    <div id="posLink" style="margin-top:8px"></div>
    <div class="tbl" style="margin-top:8px"><table class="cart" id="posCart"></table></div>
    <div class="grid g2" style="margin-top:8px">${F('Discount %',I('pos_dp',POS.discPct||'','number','min=0 max=100 oninput="POS.discPct=+this.value;posPay()"'))}${F('Discount $',I('pos_df',POS.discFlat||'','number','min=0 step=0.01 oninput="POS.discFlat=+this.value;posPay()"'))}</div>
    <div id="posSum" style="margin-top:8px"></div>
   </div>
   <div class="card pay" id="posPay"></div>
  </div>`;
  posCatalog();posCart();
}};
function posCatalog(){
  const tabs=[['balances','Balances'],['deposits','Deposits'],['addons','Add-ons & Fees'],['products','Products'],['custom','Custom']];
  $('#posTabs').innerHTML=tabs.map(([k,l])=>`<a class="${POS.tab===k?'on':''}" onclick="POS.tab='${k}';posCatalog()">${l}</a>`).join('');
  const q=POS.q.toLowerCase(),m=s=>!q||s.toLowerCase().includes(q);const cf=POS.customerId;let h='';
  if(POS.tab==='balances'){
    const ag=S.agreements.filter(a=>['Open','Closed','Draft'].includes(a.status)&&agrBalance(a)>0.004&&(!cf||a.customerId===cf)&&m(a.no+' '+cName(cust(a.customerId))));
    const dm=S.damages.filter(d=>dmgBalance(d)>0.004&&(!cf||d.customerId===cf)&&m('damage '+cName(cust(d.customerId))));
    const pl=S.plans.filter(p=>p.status==='Active'&&(!cf||p.customerId===cf)&&m(p.no+' '+cName(cust(p.customerId))));
    h+=ag.map(a=>`<div class="bal" onclick="posAdd({kind:'agreement',refId:'${a.id}',desc:'Rental balance — ${esc(a.no)}',qty:1,price:${agrBalance(a)},taxable:false,editable:true})"><div><b>${esc(a.no)}</b> <span class="tag">${a.status}</span><br><span class="small muted">${esc(cName(cust(a.customerId)))}</span></div><span class="a">${money(agrBalance(a))}</span></div>`).join('');
    h+=dm.map(d=>`<div class="bal" onclick="posAdd({kind:'damage',refId:'${d.id}',desc:'Damage charge — ${esc(veh(d.vehicleId)?.plate||'')} ${fmtD(d.date)}',qty:1,price:${dmgBalance(d)},taxable:false,editable:true})"><div><b>Damage</b> ${fmtD(d.date)}<br><span class="small muted">${esc(cName(cust(d.customerId)))}</span></div><span class="a">${money(dmgBalance(d))}</span></div>`).join('');
    h+=pl.map(p=>{const nx=p.schedule.findIndex(i=>!i.waived&&instOwed(i)>0);const i=p.schedule[nx];return `<div class="bal" onclick="posAdd({kind:'plan',refId:'${p.id}',desc:'${esc(p.no)} installment ${nx+1}',qty:1,price:${instOwed(i)},taxable:false,editable:true})"><div><b>${esc(p.no)}</b> installment ${nx+1} <span class="tag ${i.status==='Late'?'bad':''}">${i.status} ${fmtD(i.due)}</span><br><span class="small muted">${esc(cName(cust(p.customerId)))}</span></div><span class="a">${money(instOwed(i))}</span></div><div class="bal" onclick="posAdd({kind:'plan',refId:'${p.id}',desc:'${esc(p.no)} payoff',qty:1,price:${planPayoff(p)},taxable:false,editable:true})"><div class="small">${esc(p.no)} — pay off in full (no future interest)</div><span class="a">${money(planPayoff(p))}</span></div>`}).join('');
    h=h||'<div class="empty">No open balances'+(cf?' for this customer':'')+'</div>';
  }else if(POS.tab==='deposits'){
    S.agreements.filter(a=>['Draft','Open'].includes(a.status)&&(!cf||a.customerId===cf)&&m(a.no+' '+cName(cust(a.customerId)))).forEach(a=>{const need=r2(rateFor(veh(a.vehicleId)).deposit-secHeld(a));
      h+=`<div class="bal" onclick="posAdd({kind:'secdep',refId:'${a.id}',desc:'Security deposit — ${esc(a.no)}',qty:1,price:${Math.max(need,0)||rateFor(veh(a.vehicleId)).deposit},taxable:false,editable:true})"><div><b>Security deposit</b> ${esc(a.no)}<br><span class="small muted">${esc(cName(cust(a.customerId)))} · held ${money(secHeld(a))}</span></div><span class="a">${money(Math.max(need,0))}</span></div>`});
    S.reservations.filter(r=>['Inquiry','Confirmed'].includes(r.status)&&(!cf||r.customerId===cf)&&m(cName(cust(r.customerId)))).forEach(r=>{h+=`<div class="bal" onclick="posAddResDeposit('${r.id}',true)"><div><b>Reservation deposit</b> ${fmtD(r.start)}<br><span class="small muted">${esc(cName(cust(r.customerId)))}</span></div><span class="a">${money(S.settings.policy.resDeposit)}</span></div>`});
    h=h||'<div class="empty">No deposits due</div>';
  }else if(POS.tab==='addons'){

function posAdd(line){
  if(line.refId&&['agreement','damage','plan','secdep','resdep'].includes(line.kind)&&POS.cart.some(l=>l.kind===line.kind&&l.refId===line.refId)){toast('Already in the sale','');return}
  const owner=line.kind==='agreement'?agr(line.refId)?.customerId:line.kind==='damage'?dmg(line.refId)?.customerId:line.kind==='plan'?plan(line.refId)?.customerId:line.kind==='secdep'?agr(line.refId)?.customerId:line.kind==='resdep'?resv(line.refId)?.customerId:'';
  if(owner&&POS.customerId&&owner!==POS.customerId){toast('That balance belongs to another customer','bad');return}
  if(owner&&!POS.customerId){POS.customerId=owner;const s=$('#pos_cust');if(s)s.value=owner}
  line.max=line.editable?line.price:null;POS.cart.push(line);POS.plan=null;posCart();
}

function posPrice(i,inp){const l=POS.cart[i];let v=r2(+inp.value||0);if(l.max!=null&&v>l.max+0.001&&l.kind!=='secdep'){toast('Cannot exceed balance '+money(l.max),'bad');v=l.max}if(v<=0)v=l.max||0;l.price=v;inp.value=v;POS.plan=null;posPay()}
function posPay(){
  if(!$('#posSum'))return;
  const T=posTotals();const sum=$('#posSum');
  sum.innerHTML=`<div class="sumline"><span>Subtotal</span><span>${money(T.gross)}</span></div>${T.disc?`<div class="sumline"><span>Discount</span><span>-${money(T.disc)}</span></div>`:''}${T.tax?`<div class="sumline"><span>${esc(S.settings.policy.taxLabel)} ${S.settings.policy.taxRate}%</span><span>${money(T.tax)}</span></div>`:''}<div class="sumline t"><span>Total</span><span>${money(T.total)}</span></div>`;
  const methods=S.settings.lists.payMethods;
  const cashAmts=[...new Set([T.remaining,Math.ceil(T.remaining),Math.ceil(T.remaining/5)*5,Math.ceil(T.remaining/10)*10,Math.ceil(T.remaining/20)*20,50,100].filter(x=>x>=T.remaining&&x>0))].sort((a,b)=>a-b).slice(0,5);
  $('#posPay').innerHTML=`<h2>Payment</h2>
   <div class="muted small">Amount due</div><div class="tot">${money(T.remaining)}</div>
   ${POS.tenders.map((t,i)=>`<div class="sumline"><span>${esc(t.method)}${t.ref?' · '+esc(t.ref):''}</span><span>${money(t.amount)} <button class="btn sm bad" onclick="POS.tenders.splice(${i},1);posPay()">×</button></span></div>`).join('')}
   ${POS.plan?`<div class="sumline"><span>On payment plan (${POS.plan.n} × ${esc(POS.plan.freq)})</span><span>${money(POS.plan.principal)} <button class="btn sm bad" onclick="POS.plan=null;posPay()">×</button></span></div>`:''}
   ${T.change>0?`<div class="change" style="margin:10px 0"><span>Change due</span><b>${money(T.change)}</b><div class="denoms">${changeBreakdown(T.change).map(([d,n])=>`<div>${n} × ${dLabel(d)}</div>`).join('')}</div></div>`:''}
   ${T.remaining>0?`<div class="tender" style="margin:10px 0">${methods.map(m=>`<button class="${POS.method===m?'on':''}" onclick="POS.method='${esc(m)}';posPay()">${esc(m)}</button>`).join('')}</div>
   <div class="row" style="flex-wrap:nowrap"><input id="pos_amt" type="number" step="0.01" placeholder="${T.remaining.toFixed(2)}" value="${esc(POS.entry)}" oninput="POS.entry=this.value" style="font-size:18px;text-align:right"><button class="btn p" onclick="posTender()">Add</button></div>
   ${POS.method!=='Cash'?I('pos_ref','','text','placeholder="Reference (last 4 / check no. / transaction ID)" style="margin-top:6px"'):''}
   ${POS.method==='Cash'?`<div class="quick" style="margin-top:8px">${cashAmts.map(a=>`<button onclick="POS.entry='${a}';posTender()">${a===T.remaining?'Exact':money(a)}</button>`).join('')}</div>`:''}
   <div class="keypad" style="margin-top:8px">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button onclick="posKey('${k}')">${k}</button>`).join('')}</div>`:''}
   <button class="btn ok lg" style="width:100%;margin-top:12px" ${POS.cart.length&&T.remaining<=0.004?'':'disabled'} onclick="posComplete()">Complete sale</button>
   <div class="row" style="margin-top:8px">${T.remaining>0&&POS.cart.length?`<button class="btn" style="flex:1" onclick="posPlan()">Put ${money(T.remaining)} on payment plan</button>`:''}</div>
   <div class="row" style="margin-top:8px"><button class="btn sm" onclick="posHold()">Hold sale</button><button class="btn sm bad" onclick="confirmBox('Clear this sale?',()=>{posReset();rerender()})">Clear</button>${POS.returnTo?`<button class="btn sm" onclick="const r=POS.returnTo;posReset();go(r.tab,r.arg)">Back</button>`:''}</div>`;
}
function posKey(k){POS.entry=k==='⌫'?POS.entry.slice(0,-1):(k==='.'&&POS.entry.includes('.')?POS.entry:POS.entry+k);$('#pos_amt').value=POS.entry}
function posTender(){
  const T=posTotals();let amt=r2(POS.entry===''?T.remaining:+POS.entry);if(!(amt>0)){toast('Enter an amount','bad');return}
  if(POS.method==='Cash'&&!openShift()){toast('Open the cash drawer to take cash','bad');openShiftModal();return}
  if(POS.method!=='Cash'&&amt>T.remaining+0.001){amt=T.remaining;toast('Non-cash amount capped at amount due')}
  POS.tenders.push({method:POS.method,amount:amt,ref:V('pos_ref')||''});POS.entry='';posPay();
}
function posPlan(){
  if(!POS.customerId){toast('Select the customer for the payment plan','bad');return}
  const T=posTotals();
  // deposits and plan installments cannot go on a plan
  const must=POS.cart.reduce((s,l,i)=>s+(['secdep','resdep','plan'].includes(l.kind)?T.nets[i]:0),0);
  if(T.tendered<must-0.004){toast('Deposits and installments must be paid now ('+money(must)+'). Take that payment first.','bad');return}
  newPlan({customerId:POS.customerId,amount:T.remaining,fromPOS:true});
}
function posHold(){if(!POS.cart.length)return;S.held.push({id:uid(),dt:isoDT(),pos:JSON.parse(JSON.stringify({...POS,tenders:[],plan:null}))});save();posReset();toast('Sale held');rerender()}
function heldSales(){modal('Held sales',S.held.map((h,i)=>`<div class="bal" onclick="POS=S.held[${i}].pos;S.held.splice(${i},1);save();closeTopModal();rerender()"><div>${fmtDT(h.dt)} · ${esc(cName(cust(h.pos.customerId)))}<br><span class="small muted">${h.pos.cart.map(l=>esc(l.desc)).join(', ')}</span></div><span class="a">Recall</span></div>`).join('')||'<div class="empty">No held sales</div>')}
function posComplete(){
  const T=posTotals();if(!POS.cart.length||T.remaining>0.004)return;
  if(POS.tenders.some(t=>t.method==='Cash')&&!openShift()){toast('Open the cash drawer first','bad');return}
  const P=S.settings.policy;const saleId=uid();const no='R-'+String(P.nextReceipt++).padStart(6,'0');
  const method=POS.tenders.length===1?POS.tenders[0].method:POS.tenders.length?'Split':'Payment Plan';
  let pool=r2(T.total-T.planAmt);const lines=POS.cart.map((l,i)=>({...l,net:T.nets[i]}));
  const order=lines.map((l,i)=>i).sort((a,b)=>(['secdep','resdep','plan'].includes(lines[b].kind)?1:0)-(['secdep','resdep','plan'].includes(lines[a].kind)?1:0));
  order.forEach(i=>{const l=lines[i];l.paid=r2(Math.min(pool,l.net));pool=r2(pool-l.paid);l.unpaid=r2(l.net-l.paid)});
  const cid=POS.customerId||'';let planRec=null;
  if(POS.plan){planRec=createPlan({...POS.plan,customerId:cid,saleId,source:'POS sale '+no},true)}
  lines.forEach(l=>{
    const base={method,customerId:cid,saleId,note:l.desc};
    if(l.kind==='agreement'){if(l.paid>0)addPayment({...base,amount:l.paid,type:'Rental Charge',agreementId:l.refId});if(l.unpaid>0)addPayment({...base,amount:l.unpaid,method:'Payment Plan',type:'Rental Charge',agreementId:l.refId,planId:planRec?.id})}
    else if(l.kind==='secdep'){addPayment({...base,amount:l.paid,type:'Security Deposit',agreementId:l.refId})}
    else if(l.kind==='resdep'){addPayment({...base,amount:l.paid,type:'Reservation Deposit',resId:l.refId});const r=resv(l.refId);if(r&&['Inquiry','Confirmed'].includes(r.status))r.status='Deposit Paid';const da=S.agreements.find(a=>a.resId===l.refId);if(da)S.payments[S.payments.length-1].agreementId=da.id}
    else if(l.kind==='damage'){if(l.paid>0)addPayment({...base,amount:l.paid,type:'Damage Charge',damageId:l.refId});if(l.unpaid>0)addPayment({...base,amount:l.unpaid,method:'Payment Plan',type:'Damage Charge',damageId:l.refId,planId:planRec?.id});const d=dmg(l.refId);if(d&&dmgBalance(d)<=0.004&&d.status==='Billed')d.status='Paid'}
    else if(l.kind==='plan'){const p=plan(l.refId);addPayment({...base,amount:l.paid,type:'Plan Installment',planId:l.refId});if(p)applyToPlan(p,l.paid)}
    else{
      if(l.kind==='product'){const pr=S.settings.products.find(x=>x.id===l.refId);if(pr&&num(pr.stock)!=null)pr.stock=Number(pr.stock)-l.qty}
      if(POS.link){const a=agr(POS.link);(a.extraCharges=a.extraCharges||[]).push({desc:l.desc+(l.qty>1?' ×'+l.qty:''),amount:l.net,saleId,dt:isoDT()});
        if(l.paid>0)addPayment({...base,amount:l.paid,type:'Rental Charge',agreementId:a.id});if(l.unpaid>0)addPayment({...base,amount:l.unpaid,method:'Payment Plan',type:'Rental Charge',agreementId:a.id,planId:planRec?.id})}
      else if(l.paid>0)addPayment({...base,amount:l.paid,type:l.kind==='product'?'Retail':'Fee'});
    }
  });
  const cashNet=r2(T.cash-T.change);const sh=openShift();if(sh&&cashNet>0)sh.events.push({dt:isoDT(),type:'Sale',amount:cashNet,saleId,reason:no});
  const sale={id:saleId,no,dt:isoDT(),customerId:cid,link:POS.link,items:lines.map(l=>({kind:l.kind,refId:l.refId,desc:l.desc,qty:l.qty,price:l.price,net:l.net,taxable:!!l.taxable})),gross:T.gross,disc:T.disc,tax:T.tax,total:T.total,tenders:POS.tenders,change:T.change,planId:planRec?.id||'',planAmt:T.planAmt,shiftId:sh?.id||'',refunds:[]};
  S.sales.push(sale);refreshPlans();save();
  const back=POS.returnTo;posReset();
  modal('Sale complete — '+no,`${T.change>0?`<div class="change"><span>Give change</span><b>${money(T.change)}</b><div class="denoms">${changeBreakdown(T.change).map(([d,n])=>`<div>${n} × ${dLabel(d)}</div>`).join('')}</div></div>`:''}<p>Total ${money(T.total)} · ${esc(method)}${planRec?` · ${money(planRec.principal)} on plan ${esc(planRec.no)}`:''}</p>`,
   [{t:'Print receipt',c:'p',f:()=>printReceipt(saleId)},...(planRec?[{t:'Print plan agreement',f:()=>printPlanAgreement(planRec.id)}]:[])]);
  if(back)go(back.tab,back.arg);else rerender();
}
function posAddAgreement(id){const a=agr(id);posReset();POS.customerId=a.customerId;POS.cart.push({kind:'agreement',refId:id,desc:'Rental balance — '+a.no,qty:1,price:agrBalance(a),max:agrBalance(a),taxable:false,editable:true});POS.returnTo={tab:'checkin',arg:id};closeTopModal();go('pos')}

function denomInputs(pre){return `<div class="cnt">${DENOMS.map((d,i)=>`<label><span>${dLabel(d)}</span><input type="number" min="0" id="dn_${i}" value="${pre?.[i]||''}" oninput="denomSum()"><b id="dt_${i}" class="r small">$0.00</b></label>`).join('')}</div><div class="sumline t"><span>Counted</span><span id="dn_tot">$0.00</span></div>`}

function openShiftModal(){if(openShift())return;modal('Open cash drawer',`<p class="muted">Count the starting cash (float).</p>${denomInputs()}`,[{t:'Open drawer',c:'p',f:m=>{const t=denomSum();S.shifts.push({id:uid(),status:'Open',openDt:isoDT(),openFloat:t,openCount:DENOMS.map((d,i)=>+V('dn_'+i)||0),events:[]});save();closeModal(m);toast('Drawer opened with '+money(t),'ok');rerender()}}])}
function drawerMove(type){const sh=openShift();modal(type,`${type==='No Sale'?'':F('Amount',I('dm_a','','number','step=0.01'))}${F('Reason',I('dm_r',''),'req')}`,[{t:'Record',c:'p',f:m=>{const a=VN('dm_a');if(!V('dm_r')){toast('Enter a reason','bad');return}if(type!=='No Sale'&&a<=0){toast('Enter an amount','bad');return}if(type==='Paid Out'&&a>shiftExpected(sh)){toast('Not enough cash in drawer','bad');return}sh.events.push({dt:isoDT(),type,amount:type==='No Sale'?0:r2(a),reason:V('dm_r')});save();closeModal(m);rerender()}}])}

function shiftSales(sh){return S.sales.filter(s=>s.shiftId===sh.id||(s.dt>=sh.openDt&&(!sh.closeDt||s.dt<=sh.closeDt)))}
function printShift(sh,kind){
  const sales=shiftSales(sh).filter(s=>!s.voided);const by={};sales.forEach(s=>{s.tenders.forEach(t=>by[t.method]=(by[t.method]||0)+t.amount);if(s.change)by.Cash=(by.Cash||0)-s.change;if(s.planAmt)by['Payment Plan']=(by['Payment Plan']||0)+s.planAmt});
  const ev=t=>sh.events.filter(e=>e.type===t).reduce((s,e)=>s+e.amount,0);
  printHTML(`<div class="rc">${S.settings.biz.logo?`<div class="c"><img src="${S.settings.biz.logo}" style="max-height:50px"></div>`:''}<div class="c"><b>${esc(S.settings.biz.name||'')}</b><br>${kind} REPORT</div><p>Opened ${fmtDT(sh.openDt)}${sh.closeDt?'<br>Closed '+fmtDT(sh.closeDt):'<br>Printed '+fmtDT(isoDT())}</p>
  <table><tr><td>Sales count</td><td class="r">${sales.length}</td></tr><tr><td>Sales total</td><td class="r">${money(sales.reduce((s,x)=>s+x.total,0))}</td></tr><tr><td>Tax</td><td class="r">${money(sales.reduce((s,x)=>s+x.tax,0))}</td></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('')}</table>
  <table><tr><td>Opening float</td><td class="r">${money(sh.openFloat)}</td></tr><tr><td>Cash sales</td><td class="r">${money(ev('Sale'))}</td></tr><tr><td>Paid in</td><td class="r">${money(ev('Paid In'))}</td></tr><tr><td>Paid out</td><td class="r">-${money(ev('Paid Out'))}</td></tr><tr><td>Cash refunds</td><td class="r">-${money(ev('Refund'))}</td></tr><tr><td>Voids</td><td class="r">-${money(ev('Void'))}</td></tr><tr class="tot"><td>Expected cash</td><td class="r">${money(shiftExpected(sh))}</td></tr>${sh.counted!=null?`<tr><td>Counted</td><td class="r">${money(sh.counted)}</td></tr><tr class="tot"><td>Over / short</td><td class="r">${money(sh.overShort)}</td></tr>`:''}</table>
  ${sh.events.filter(e=>['Paid In','Paid Out','No Sale'].includes(e.type)).map(e=>`<div>${fmtDT(e.dt)} ${e.type} ${money(e.amount)} — ${esc(e.reason)}</div>`).join('')}</div>`,'receipt');

function salesHistory(){
  const list=S.sales.slice().reverse().slice(0,200);
  modal('Sales history',`<input placeholder="Search receipt no. or customer" oninput="$$('#shT tr[data-s]').forEach(r=>r.hidden=!r.dataset.s.includes(this.value.toLowerCase()))" style="margin-bottom:8px"><div class="tbl"><table id="shT"><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Tender</th><th class="r">Total</th><th></th></tr>${list.map(s=>{const refd=s.refunds.reduce((a,r)=>a+r.amount,0);return `<tr data-s="${esc((s.no+' '+cName(cust(s.customerId))).toLowerCase())}"><td>${esc(s.no)}${s.voided?' <span class="tag bad">Void</span>':''}${refd?` <span class="tag warn">Refunded ${money(refd)}</span>`:''}</td><td>${fmtDT(s.dt)}</td><td>${esc(cName(cust(s.customerId)))}</td><td>${esc(s.tenders.map(t=>t.method).join(' + ')||'Plan')}</td><td class="r">${money(s.total)}</td><td><button class="btn sm" onclick="printReceipt('${s.id}')">Receipt</button>${s.voided?'':`<button class="btn sm" onclick="refundSale('${s.id}')">Refund</button><button class="btn sm bad" onclick="voidSale('${s.id}')">Void</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No sales</td></tr>'}</table></div>`,[],true);

function voidSale(id){
  const s=S.sales.find(x=>x.id===id);const sh=openShift();
  if(!sh||s.shiftId!==sh.id){toast('Only sales in the current open drawer session can be voided — use Refund instead','bad');return}
  confirmBox('Void sale '+s.no+'? All its payments are reversed.',()=>{
    S.payments.filter(p=>p.saleId===id&&p.type==='Plan Installment').forEach(p=>{const pl=plan(p.planId);if(!pl)return;let left=p.amount;for(let i=pl.schedule.length-1;i>=0&&left>0;i--){const x=pl.schedule[i];const take=Math.min(x.paid||0,left);x.paid=r2((x.paid||0)-take);left=r2(left-take);if(x.waived&&x.due>today()){x.waived=false}}if(pl.status==='Completed')pl.status='Active'});
    S.payments=S.payments.filter(p=>p.saleId!==id);
    if(s.planId)S.plans=S.plans.filter(p=>p.id!==s.planId);
    S.agreements.forEach(a=>{if(a.extraCharges)a.extraCharges=a.extraCharges.filter(x=>x.saleId!==id)});
    s.items.filter(i=>i.kind==='product').forEach(i=>{const pr=S.settings.products.find(x=>x.id===i.refId);if(pr&&num(pr.stock)!=null)pr.stock=Number(pr.stock)+i.qty});
    const cash=r2(s.tenders.filter(t=>t.method==='Cash').reduce((a,t)=>a+t.amount,0)-s.change);if(cash>0)sh.events.push({dt:isoDT(),type:'Void',amount:cash,reason:'Void '+s.no});
    s.voided=true;s.voidDt=isoDT();refreshPlans();save();closeTopModal();toast('Sale voided','ok');rerender();
  });
}
function refundSale(id){
  const s=S.sales.find(x=>x.id===id);const max=r2(s.total-s.planAmt-s.refunds.reduce((a,r)=>a+r.amount,0));
  modal('Refund '+s.no,`<p>Refundable: <b>${money(max)}</b></p><div class="grid g2">${F('Amount',I('rf_a',max,'number','step=0.01'))}${F('Method',SEL('rf_m',S.settings.lists.payMethods,s.tenders[0]?.method||'Cash','',null))}</div>${F('Reason',I('rf_r',''),'req')}`,[{t:'Refund',c:'p',f:m=>{
    const a=VN('rf_a');if(a<=0||a>max+0.001){toast('Invalid amount','bad');return}if(!V('rf_r')){toast('Enter a reason','bad');return}
    if(V('rf_m')==='Cash'&&!cashOut(a,'Refund '+s.no))return;
    const first=s.items.find(i=>['agreement','damage'].includes(i.kind))||s.items[0];
    const p={amount:a,method:V('rf_m'),refund:true,customerId:s.customerId,saleId:id,note:'Refund: '+V('rf_r')};
    if(first.kind==='agreement')Object.assign(p,{type:'Rental Charge',agreementId:first.refId});else if(first.kind==='damage')Object.assign(p,{type:'Damage Charge',damageId:first.refId});else if(s.link)Object.assign(p,{type:'Rental Charge',agreementId:s.link});else p.type='Refund';
    addPayment(p);s.refunds.push({dt:isoDT(),amount:a,method:V('rf_m'),reason:V('rf_r')});save();closeModal(m);closeTopModal();toast('Refund recorded','ok');
  }}]);
}
</script>
<script id="js-module-payments">
/* ================= PAYMENTS ================= */

PAGES.payments={t:'Payments',r(){
  const list=S.payments.filter(p=>p.date.slice(0,10)>=PF.from&&p.date.slice(0,10)<=PF.to&&(!PF.type||p.type===PF.type)).sort((a,b)=>b.date.localeCompare(a.date));

  <div class="card"><div class="row" style="margin-bottom:10px">${F('From',I('pf_f',PF.from,'date','onchange="PF.from=this.value;rerender()"'))}${F('To',I('pf_t',PF.to,'date','onchange="PF.to=this.value;rerender()"'))}${F('Type',SEL('pf_ty',types,PF.type,'onchange="PF.type=this.value;rerender()"','All types'))}<div style="flex:1"></div><button class="btn" onclick="exportPayments()">Export CSV</button><button class="btn p" onclick="go('pos')">Take payment</button></div>
  <div class="tbl"><table><tr><th>Date</th><th>Type</th><th>Method</th><th>Customer</th><th>For</th><th>Taken by</th><th class="r">Amount</th></tr>${list.map(p=>`<tr><td>${fmtDT(p.date)}</td><td>${esc(p.type)}${p.refund?' <span class="tag warn">Refund</span>':''}</td><td>${esc(p.method)}</td><td>${esc(cName(cust(p.customerId)))}</td><td class="small">${esc(payRef(p))}</td><td class="small">${esc(p.by?eName(emp(p.by)):'')}</td><td class="r">${p.refund||p.type==='Deposit Release'?'-':''}${money(p.amount)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No payments in this range</td></tr>'}</table></div></div>`;
  window.PAYLIST=list;
}};
function exportPayments(){downloadFile('payments.csv',toCSV([['Date','Type','Method','Customer','Reference','Note','Amount'],...(window.PAYLIST||[]).map(p=>[fmtDT(p.date),p.type,p.method,cName(cust(p.customerId)),payRef(p),p.note||'',(p.refund||p.type==='Deposit Release'?-1:1)*p.amount])]),'text/csv')}
function payRef(p){return [p.agreementId&&agr(p.agreementId)?.no,p.planId&&plan(p.planId)?.no,p.damageId&&'Damage',p.resId&&'Reservation',p.saleId&&S.sales.find(s=>s.id===p.saleId)?.no].filter(Boolean).join(' · ')}
</script>
<script id="js-payment-plan-service-2">
/* ================= PAYMENT PLANS ================= */
PAGES.plans={t:'Payment Plans',r(){
  refreshPlans();const ps=S.plans.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||''));
  PG().innerHTML=`<div class="kpis"><div class="kpi"><small>Active plans</small><b>${ps.filter(p=>p.status==='Active').length}</b></div><div class="kpi"><small>Outstanding</small><b>${money(ps.filter(p=>p.status==='Active').reduce((s,p)=>s+planRemaining(p),0))}</b></div><div class="kpi"><small>With late installments</small><b>${ps.filter(p=>p.status==='Active'&&p.schedule.some(i=>i.status==='Late')).length}</b></div><div class="kpi"><small>Defaulted</small><b>${ps.filter(p=>p.status==='Defaulted').length}</b></div></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><span class="muted small">Interest defaults to 0%. Caps: ${S.settings.policy.interestPersonalCap}% personal / ${S.settings.policy.interestBusinessCap}% business; over ${S.settings.policy.writingRequiredAbove}% needs the renter's signature.</span><div style="flex:1"></div><button class="btn p" onclick="newPlan({})">+ New Payment Plan</button></div>
  <div class="tbl"><table><tr><th>Plan</th><th>Customer</th><th>For</th><th>Schedule</th><th>Next due</th><th>Status</th><th class="r">Remaining</th></tr>${ps.map(p=>{const nx=p.schedule.find(i=>!i.waived&&instOwed(i)>0);return `<tr class="click" onclick="viewPlan('${p.id}')"><td><b>${esc(p.no)}</b></td><td>${esc(cName(cust(p.customerId)))}</td><td class="small">${esc(p.source||'')}</td><td>${p.schedule.length} × ${esc(p.freq)}${p.rate?' · '+p.rate+'%':''}</td><td>${nx?fmtD(nx.due)+' · '+money(instOwed(nx))+(nx.status==='Late'?' <span class="tag bad">Late</span>':''):'—'}</td><td><span class="tag ${p.status==='Active'?'b':p.status==='Completed'?'ok':'bad'}">${p.status}</span></td><td class="r">${money(planRemaining(p))}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No payment plans</td></tr>'}</table></div></div>`;
}};
function newPlan(cfg){
  const P=S.settings.policy;const c=cust(cfg.customerId);
  const srcList=[];
  modal('Payment plan',`
  ${cfg.fromPOS?`<div class="note">Balance from this sale: <b>${money(cfg.amount)}</b></div>`:''}
  <div class="grid g2" style="margin-top:8px">${F('Customer',cfg.fromPOS||cfg.customerId?`<input disabled value="${esc(cName(c))}"><input type="hidden" id="pl_c" value="${cfg.customerId}">`:custPicker('pl_c','','plSources()'),'req')}
  ${cfg.fromPOS||cfg.agreementId||cfg.damageId?F('Amount',I('pl_amt',r2(cfg.amount),'number','disabled')):F('Balance to put on plan',`<select id="pl_src" onchange="plPreview()"></select>`,'req')}</div>
  <div class="grid g4" style="margin-top:10px">${cfg.fromPOS?'':F('Down payment today',I('pl_down',0,'number','step=0.01 min=0 oninput="plPreview()"'))}${F('Number of payments',I('pl_n',4,'number','min=1 max=60 oninput="plPreview()"'),'req')}${F('Frequency',SEL('pl_f',Object.keys(FREQ),'Bi-weekly','onchange="plPreview()"',null))}${F('First payment date',I('pl_s',addDays(today(),14),'date','onchange="plPreview()"'),'req')}
  ${F('Annual interest %',I('pl_r',0,'number','min=0 step=0.25 oninput="plPreview()"'))}${F('Late fee per installment',I('pl_lf',P.planLateFee,'number','step=0.01'))}${F('Account type (interest cap)',SEL('pl_t',[{v:'personal',l:'Personal — max '+P.interestPersonalCap+'%'},{v:'business',l:'Business — max '+P.interestBusinessCap+'%'}],/Business|Government/.test(c?.type||'')?'business':'personal','onchange="plPreview()"',null))}</div>
  ${F('Notes',I('pl_notes',''))}
  <div id="pl_prev" style="margin-top:10px"></div>
  <div id="pl_sigw" style="display:none;margin-top:10px"><b class="small">Renter signature — required when interest is over ${P.writingRequiredAbove}% (A.S.C.A. § 28.1501)</b>${sigPad('pl_sig')}</div>
  <p class="muted small">Grace period ${P.planGraceDays} days. ${P.missedToDefault} missed installments sets the plan to Defaulted and flags the customer Do Not Rent. Early payoff allowed any time without future interest.</p>`,
  [{t:cfg.fromPOS?'Add plan to sale':'Create plan',c:'p',f:m=>{
    const x=plRead(cfg);if(!x)return;
    if(cfg.fromPOS){POS.plan=x;closeModal(m);posPay();toast('Plan added — complete the sale to activate it','ok');return}
    const p=createPlan(x);closeModal(m);toast('Plan '+p.no+' created','ok');
    if(x.down>0){posReset();POS.customerId=x.customerId;if(x.agreementId)POS.cart.push({kind:'agreement',refId:x.agreementId,desc:'Down payment — '+agr(x.agreementId).no,qty:1,price:x.down,max:x.down,taxable:false,editable:true});else if(x.damageId)POS.cart.push({kind:'damage',refId:x.damageId,desc:'Down payment — damage',qty:1,price:x.down,max:x.down,taxable:false,editable:true});go('pos')}
    else if(CUR==='checkin'&&x.agreementId)ciSettle(agr(x.agreementId));else rerender();
  }}],true);
  initSig('pl_sig');
  window._plcfg=cfg;if(!cfg.fromPOS&&!cfg.agreementId&&!cfg.damageId)plSources();else plPreview();
}
function plSources(){const cid=V('pl_c');const s=$('#pl_src');if(!s)return;const L=[];
  S.agreements.filter(a=>a.customerId===cid&&a.status!=='Draft'&&agrBalance(a)>0.004).forEach(a=>L.push({v:'a:'+a.id,l:`${a.no} — ${money(agrBalance(a))}`}));
  S.damages.filter(d=>d.customerId===cid&&dmgBalance(d)>0.004).forEach(d=>L.push({v:'d:'+d.id,l:`Damage ${fmtD(d.date)} — ${money(dmgBalance(d))}`}));
  s.innerHTML=opts(L,'',L.length?'— Select —':'No open balances for this customer');plPreview()}
function plRead(cfg){
  const P=S.settings.policy;let amount=r2(cfg.amount||0),agreementId=cfg.agreementId,damageId=cfg.damageId,source=cfg.source||'';
  const src=V('pl_src');if(src){const[k,id]=src.split(':');if(k==='a'){agreementId=id;amount=agrBalance(agr(id))}else{damageId=id;amount=dmgBalance(dmg(id))}}
  if(agreementId)source=source||'Agreement '+agr(agreementId).no;if(damageId)source=source||'Damage '+fmtD(dmg(damageId).date);
  const down=cfg.fromPOS?0:Math.max(0,VN('pl_down'));const principal=r2(amount-down);const rate=VN('pl_r');const cap=V('pl_t')==='business'?P.interestBusinessCap:P.interestPersonalCap;
  const out={customerId:V('pl_c')||cfg.customerId,agreementId,damageId,source,amount,down,principal,n:Math.max(1,Math.round(VN('pl_n'))),freq:V('pl_f'),start:V('pl_s'),rate,lateFee:VN('pl_lf'),acct:V('pl_t'),notes:V('pl_notes'),sig:sigData('pl_sig')};
  if(!out.customerId){toast('Choose a customer','bad');return null}
  if(principal<=0){toast('Nothing to put on a plan','bad');return null}
  if(rate>cap){toast(`Interest over the ${cap}% legal cap`,'bad');return null}
  if(rate>P.writingRequiredAbove&&!out.sig){toast(`Renter must sign for interest over ${P.writingRequiredAbove}%`,'bad');return null}
  if(!out.start){toast('Pick the first payment date','bad');return null}
  return out;
}
function plPreview(){
  const cfg=window._plcfg||{};const P=S.settings.policy;let amount=cfg.amount||0;const src=V('pl_src');
  if(src){const[k,id]=src.split(':');amount=k==='a'?agrBalance(agr(id)):dmgBalance(dmg(id))}
  const princ=r2(amount-(cfg.fromPOS?0:Math.max(0,VN('pl_down'))));const rate=VN('pl_r');const cap=V('pl_t')==='business'?P.interestBusinessCap:P.interestPersonalCap;
  $('#pl_sigw').style.display=rate>P.writingRequiredAbove?'block':'none';
  if(princ<=0){$('#pl_prev').innerHTML='';return}
  const sch=buildSchedule(princ,VN('pl_n')||1,V('pl_f'),V('pl_s')||today(),rate);const ti=sch.reduce((s,i)=>s+i.interest,0);
  $('#pl_prev').innerHTML=(rate>cap?`<div class="alert bad">${rate}% is over the ${cap}% cap — not allowed.</div>`:'')+`<div class="note">Plan amount <b>${money(princ)}</b> · ${sch.length} payments of about <b>${money(sch[0].amount)}</b>${ti?` · total interest ${money(ti)}`:' · no interest'} · last payment ${fmtD(sch[sch.length-1].due)}</div><div class="tbl" style="max-height:200px;overflow:auto;margin-top:6px"><table><tr><th>#</th><th>Due</th><th class="r">Principal</th><th class="r">Interest</th><th class="r">Payment</th></tr>${sch.map((i,k)=>`<tr><td>${k+1}</td><td>${fmtD(i.due)}</td><td class="r">${money(i.principal)}</td><td class="r">${money(i.interest)}</td><td class="r">${money(i.amount)}</td></tr>`).join('')}</table></div>`;
}
function createPlan(x,fromSale){
  const P=S.settings.policy;
  const p={id:uid(),no:'PP-'+String(P.nextPlan++).padStart(4,'0'),created:isoDT(),status:'Active',customerId:x.customerId,agreementId:x.agreementId||'',damageId:x.damageId||'',saleId:x.saleId||'',source:x.source||'',principal:x.principal,freq:x.freq,rate:x.rate,lateFee:x.lateFee,acct:x.acct,notes:x.notes,sig:x.sig,graceDays:P.planGraceDays,schedule:buildSchedule(x.principal,x.n,x.freq,x.start,x.rate)};
  S.plans.push(p);
  if(!fromSale){
    if(x.agreementId)addPayment({amount:x.principal,method:'Payment Plan',type:'Rental Charge',agreementId:x.agreementId,customerId:x.customerId,planId:p.id,note:'Moved to '+p.no});
    if(x.damageId)addPayment({amount:x.principal,method:'Payment Plan',type:'Damage Charge',damageId:x.damageId,customerId:x.customerId,planId:p.id,note:'Moved to '+p.no});
  }
  save();return p;
}
function viewPlan(id){
  refreshPlans();const p=plan(id);
  modal('Payment plan '+p.no,`<div class="row"><span class="tag ${p.status==='Active'?'b':p.status==='Completed'?'ok':'bad'}">${p.status}</span><b>${esc(cFormal(cust(p.customerId)))}</b><span class="muted">${esc(p.source)}</span></div>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><small>Plan amount</small><b>${money(p.principal)}</b></div><div class="kpi"><small>Remaining</small><b>${money(planRemaining(p))}</b></div><div class="kpi"><small>Payoff today</small><b>${money(planPayoff(p))}</b></div><div class="kpi"><small>Terms</small><b style="font-size:15px">${p.schedule.length} × ${esc(p.freq)} · ${p.rate||0}%</b></div></div>
  <table><tr><th>#</th><th>Due</th><th class="r">Amount</th><th class="r">Late fee</th><th class="r">Paid</th><th class="r">Owed</th><th>Status</th><th></th></tr>${p.schedule.map((i,k)=>`<tr><td>${k+1}</td><td>${fmtD(i.due)}</td><td class="r">${money(i.amount)}</td><td class="r">${i.lateFee?money(i.lateFee):''}</td><td class="r">${money(i.paid)}</td><td class="r">${money(Math.max(0,instOwed(i)))}</td><td><span class="tag ${i.status==='Paid'?'ok':i.status==='Late'?'bad':i.status==='Partial'?'warn':''}">${i.status}</span></td><td>${i.lateFee&&instOwed(i)>0?`<button class="btn sm" onclick="plan('${id}').schedule[${k}].lateFee=0;plan('${id}').schedule[${k}].feeWaived=true;save();closeTopModal();viewPlan('${id}')">Waive fee</button>`:''}</td></tr>`).join('')}</table>
  ${p.notes?`<p class="small">${esc(p.notes)}</p>`:''}`,
  [...(p.status==='Active'?[{t:'Take installment (POS)',c:'p',f:m=>{closeModal(m);posReset();POS.customerId=p.customerId;go('pos');POS.tab='balances';posCatalog()}},{t:'Pay off',f:m=>{closeModal(m);posReset();POS.customerId=p.customerId;POS.cart.push({kind:'plan',refId:p.id,desc:p.no+' payoff',qty:1,price:planPayoff(p),max:planPayoff(p),taxable:false,editable:true});go('pos')}}]:[]),
   {t:'Print plan agreement',f:()=>printPlanAgreement(id)},{t:'Print statement',f:()=>printPlanStatement(id)},
   ...(p.status==='Defaulted'?[{t:'Reinstate',f:m=>{p.status='Active';save();closeModal(m);toast('Plan reinstated (customer Do-Not-Rent flag left as is)')}}]:[]),
   ...(p.status==='Active'?[{t:'Cancel plan',c:'bad',f:m=>confirmBox('Cancel this plan? The unpaid amount returns to the original balance.',()=>{const rem=planRemaining(p);p.status='Cancelled';if(p.agreementId||p.damageId){S.payments.push({id:uid(),date:isoDT(),amount:rem,method:'Payment Plan',type:p.agreementId?'Rental Charge':'Damage Charge',agreementId:p.agreementId,damageId:p.damageId,customerId:p.customerId,refund:true,note:p.no+' cancelled — balance restored'})}save();closeModal(m);rerender()})}]:[])],true);
}
</script>
<script id="js-module-invoices-receipts">

<script id="js-module-rates-pricing">
/* ================= RATES & PRICING ================= */
PAGES.rates={t:'Rates & Pricing',r(){
  const st=S.settings;
  PG().innerHTML=`<div class="grid g2" style="align-items:start"><div>

function dmgFromAg(){const a=agr(V('d_ag'));if(a){$('#d_v').value=a.vehicleId;$('#d_c').value=a.customerId}dmgCalc()}

  const a=agr(V('d_ag'));const r=rateFor(veh(V('d_v')));const cost=VN('d_act')||VN('d_est');const loss=r2(VN('d_ld')*r.daily);
  const cdw=a&&(a.ins||'').startsWith('Collision');const ded=Number(S.settings.policy.cdwDeductible)||0;

<script id="js-module-compliance">
/* ================= COMPLIANCE ================= */
function complianceItems(){
  const out=[];const add=(what,who,date,go)=>{if(date)out.push({what,who,date,days:daysBetween(today(),date),go})};
  S.vehicles.filter(v=>!['Sold'].includes(v.status)).forEach(v=>{const n=v.make+' '+v.model+' ('+(v.plate||'')+')';
    if(!v.insExp)out.push({what:'Insurance — missing',who:n,date:'',days:-999,go:`editVehicle('${v.id}')`});else add('Vehicle insurance',n,v.insExp,`editVehicle('${v.id}')`);
    if(!v.regExp)out.push({what:'Registration — missing',who:n,date:'',days:-999,go:`editVehicle('${v.id}')`});else add('Vehicle registration',n,v.regExp,`editVehicle('${v.id}')`);
    add('Safety inspection',n,v.inspExp,`editVehicle('${v.id}')`)});
  const b=S.settings.biz;if(b.licExp)add('Business license',b.name||'Business',b.licExp,"go('settings','biz')");else out.push({what:'Business license — no expiry on file',who:b.name||'Business',date:'',days:-999,go:"go('settings','biz')"});
  const md=today().slice(5);if(md>='10-01'&&(!b.licExp||b.licExp<=today().slice(0,4)+'-12-31'))out.push({what:'Business license renewal window open (Oct 1 – Dec 31)',who:'Dept. of Commerce, Utulei',date:today().slice(0,4)+'-12-31',days:daysBetween(today(),today().slice(0,4)+'-12-31'),go:"go('settings','biz')"});
  S.vault.forEach(d=>add(d.type,d.number||d.fileName||'',d.expiry,"go('settings','vault')"));
  S.agreements.filter(a=>a.status==='Open').forEach(a=>{const c=cust(a.customerId);if(c?.licExp)add('Renter license (on active rental)',cName(c)+' · '+a.no,c.licExp,`viewCustomer('${c.id}')`);
    if(c&&(c.licType||'').startsWith('Foreign')&&c.arrival&&!c.visitorPermit)add('Foreign license 30-day limit',cName(c)+' · '+a.no,addDays(c.arrival,S.settings.policy.foreignDays-1),`viewCustomer('${c.id}')`)});
  return out.sort((a,b)=>a.days-b.days);
}
function compTable(list){return `<div class="tbl"><table><tr><th>Item</th><th>For</th><th>Expires</th><th>Days left</th></tr>${list.map(x=>`<tr class="click" onclick="${x.go}"><td>${esc(x.what)}</td><td>${esc(x.who)}</td><td>${fmtD(x.date)}</td><td><span class="tag ${x.days<0?'bad':x.days<=7?'bad':x.days<=30?'warn':x.days<=60?'b':'ok'}">${x.days===-999?'Missing':x.days<0?Math.abs(x.days)+' days ago':x.days+' days'}</span></td></tr>`).join('')}</table></div>`}
PAGES.compliance={t:'Compliance',r(){
  const all=complianceItems();
  PG().innerHTML=`<div class="kpis"><div class="kpi"><small>Expired / missing</small><b style="color:var(--bad)">${all.filter(x=>x.days<0).length}</b></div><div class="kpi"><small>Within 7 days</small><b>${all.filter(x=>x.days>=0&&x.days<=7).length}</b></div><div class="kpi"><small>Within 30 days</small><b>${all.filter(x=>x.days>=0&&x.days<=30).length}</b></div><div class="kpi"><small>Within 60 days</small><b>${all.filter(x=>x.days>=0&&x.days<=60).length}</b></div></div>
  <div class="card"><h2>Everything that expires</h2>${all.length?compTable(all):'<div class="empty">Nothing tracked yet</div>'}</div>
  <div class="card"><h2>American Samoa legal checklist</h2><table><tr><th>Rule</th><th>Last verified</th></tr>${S.settings.legal.checklist.map((c,i)=>`<tr><td>${esc(c.rule)}</td><td style="width:180px"><input type="date" value="${c.verified||''}" onchange="S.settings.legal.checklist[${i}].verified=this.value;save()"></td></tr>`).join('')}</table><p class="muted small">Confirm current insurance minimums with your insurer, visitor-permit rules with OMV, and license fees with the Department of Commerce. Have an attorney review your rental and payment plan agreements.</p></div>
  <div class="card"><h2>Document vault</h2><p class="muted">${S.vault.length} document(s) on file. <a href="#" onclick="go('settings','vault');return false">Open the legal document vault</a></p></div>`;
}};
</script>
<script id="js-module-reports">
/* ================= REPORTS ================= */
let RP={from:today().slice(0,8)+'01',to:today()};
PAGES.reports={t:'Reports',r(){
  const inR=d=>d&&d.slice(0,10)>=RP.from&&d.slice(0,10)<=RP.to;
  const sales=S.sales.filter(s=>!s.voided&&inR(s.dt));
  const pays=S.payments.filter(p=>inR(p.date)&&!NONCASH.includes(p.method));
  const byMethod={};sales.forEach(s=>{s.tenders.forEach(t=>byMethod[t.method]=(byMethod[t.method]||0)+t.amount);if(s.change)byMethod.Cash=(byMethod.Cash||0)-s.change});
  pays.filter(p=>!p.saleId).forEach(p=>byMethod[p.method]=(byMethod[p.method]||0)+((p.refund||p.type==='Deposit Release')?-1:1)*p.amount);
  S.sales.forEach(s=>s.refunds.filter(r=>inR(r.dt)).forEach(r=>byMethod[r.method]=(byMethod[r.method]||0)-r.amount));
  const byType={};pays.forEach(p=>byType[p.type]=(byType[p.type]||0)+((p.refund||p.type==='Deposit Release')?-1:1)*p.amount);
  const ags=S.agreements.filter(a=>['Open','Closed'].includes(a.status)&&inR(a.out?.dt));
  const byCat={},byVeh={};ags.forEach(a=>{const v=veh(a.vehicleId);const t=agrTotal(a);const c=v?.category||'—';byCat[c]=(byCat[c]||0)+t;const k=vLabel(v);byVeh[k]=(byVeh[k]||0)+t});
  const byDay={};sales.forEach(s=>byDay[s.dt.slice(0,10)]=(byDay[s.dt.slice(0,10)]||0)+s.total-s.planAmt);
  const aging=[0,0,0,0];const agingRows=[];
  S.agreements.filter(a=>a.status==='Closed'&&agrBalance(a)>0.004).forEach(a=>{const d=daysBetween(a.in.dt,today());const b=agrBalance(a);aging[d<=30?0:d<=60?1:d<=90?2:3]+=b;agingRows.push([a.no,cName(cust(a.customerId)),d,b])});
  S.damages.filter(d=>dmgBalance(d)>0.004).forEach(d=>{const n=daysBetween(d.date,today());aging[n<=30?0:n<=60?1:n<=90?2:3]+=dmgBalance(d);agingRows.push(['Damage '+fmtD(d.date),cName(cust(d.customerId)),n,dmgBalance(d)])});
  const plans=S.plans;const dmgs=S.damages.filter(d=>inR(d.date));const mts=S.maintenance.filter(m=>inR(m.date));
  const mByV={};mts.forEach(m=>{const k=vLabel(veh(m.vehicleId));mByV[k]=(mByV[k]||0)+Number(m.cost||0)});
  const taxColl=sales.reduce((s,x)=>s+x.tax,0)+ags.reduce((s,a)=>s+((a.final||a.quote)?.tax||0),0);

   <p class="muted small">Merge fields: {{title}} {{first}} {{last}} {{fullname}} {{agreement}} {{vehicle}} {{plate}} {{due}} {{returned}} {{balance}} {{deposit}} {{today}} {{business}} {{phone}}</p>
   <div class="card" style="background:var(--soft)"><b>Help Me Write</b> <span class="muted small">(uses your Anthropic key from Settings)</span>${F('Tell the AI what this letter must say',I('lt_ai','','text','placeholder="e.g. vehicle 3 days overdue, return by Friday 5 PM or we report to DPS"'))}<button class="btn sm" style="margin-top:6px" onclick="ltAI()">Draft body</button></div>
   <div class="row" style="margin-top:10px"><button class="btn p" onclick="ltPrint(true)">Save & print</button><button class="btn" onclick="ltPrint(false)">Preview</button></div>`;
  else if(DT==='tpl')h=S.templates.map((t,i)=>`<div class="card"><div class="row">${I('tp_n'+i,t.name,'text',`style="max-width:300px" onchange="S.templates[${i}].name=this.value;save()"`)}<div style="flex:1"></div><button class="btn sm bad" onclick="confirmBox('Delete template?',()=>{S.templates.splice(${i},1);save();rerender()})">Delete</button></div>${TA('tp_b'+i,t.body,`rows=6 style="margin-top:8px" placeholder="Write your own wording. Merge fields like {{fullname}} and {{balance}} fill in automatically." onchange="S.templates[${i}].body=this.value;save()"`)}</div>`).join('')+`<button class="btn p" onclick="S.templates.push({id:uid(),name:'New template',body:''});save();rerender()">+ Add template</button>`;
  else h=`<table><tr><th>Date</th><th>Recipient</th><th>Template</th><th></th></tr>${S.letters.slice().reverse().map(l=>`<tr><td>${fmtD(l.date)}</td><td>${esc(cName(cust(l.customerId)))}</td><td>${esc(l.name)}</td><td><button class="btn sm" onclick="printLetter(S.letters.find(x=>x.id==='${l.id}'))">Print</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No saved letters</td></tr>'}</table>`;
  PG().innerHTML=`<div class="card">${tabs}${h}</div>`;
}};
function ltLoad(){const t=S.templates.find(x=>x.id===V('lt_t'));if(t){$('#lt_b').value=t.body;$('#lt_s').value=t.name}}
function ltAgr(){$('#lt_a').innerHTML=opts(S.agreements.filter(a=>a.customerId===V('lt_c')&&a.status!=='Draft').map(a=>({v:a.id,l:a.no})),'','None')}
function letterHTML(l){const c=cust(l.customerId),a=agr(l.agreementId);const body=mergeFields(l.body,c,a);
  return `${letterhead()}<p>${fmtD(l.date)}</p><p>${mailingBlock(c)}</p>${l.subject?`<p><b>Re: ${esc(mergeFields(l.subject,c,a))}${a?' — Agreement '+esc(a.no):''}</b></p>`:''}<p>Dear ${esc((c?.title?c.title+' ':'')+(c?.last||c?.company||''))}:</p>${body.split(/\n{2,}/).map(p=>`<p style="white-space:pre-wrap">${esc(p)}</p>`).join('')}<p style="margin-top:28px">${esc(S.settings.biz.letterClosing||'Sincerely,')}</p><div style="height:40px"></div><p>${esc(S.settings.biz.owner||'')}${S.settings.biz.ownerTitle?'<br>'+esc(S.settings.biz.ownerTitle):''}<br>${esc(S.settings.biz.name||'')}</p>`}
function ltPrint(keep){if(!V('lt_c')){toast('Choose the recipient','bad');return}const l={id:uid(),date:today(),customerId:V('lt_c'),agreementId:V('lt_a'),subject:V('lt_s'),body:V('lt_b'),name:S.templates.find(t=>t.id===V('lt_t'))?.name||'Letter'};if(keep){S.letters.push(l);save()}printLetter(l)}
function printLetter(l){printHTML(letterHTML(l))}
async function askClaude(system,prompt){
  const key=getKey();if(!key){toast('Add your Anthropic API key in Settings → AI & Data','bad');throw new Error('no key')}
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.ai.model||'claude-sonnet-5-5',max_tokens:1500,system,messages:[{role:'user',content:prompt}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return j.content.map(x=>x.text||'').join('');
}
async function ltAI(){
  const c=cust(V('lt_c')),a=agr(V('lt_a'));if(!V('lt_ai')){toast('Say what the letter must cover','bad');return}
  const facts=`Business: ${S.settings.biz.name}. Recipient: ${cFormal(c)}. ${a?`Agreement ${a.no}, vehicle ${vLabel(veh(a.vehicleId))}, due ${fmtDT(a.due)}, status ${a.status}, balance ${money(agrBalance(a))}, deposit held ${money(secHeld(a))}.`:''} Customer total balance ${c?money(custBalance(c)):'n/a'}.`;
  $('#lt_b').value='Writing…';
  try{const t=await askClaude('You write the BODY ONLY of formal business letters for a car rental company in American Samoa, in first person plural as the company. Formal, official register. No greeting line, no closing, no signature, no placeholders in brackets. Never use affectionate, sentimental, or warm filler language (no "with love", no "thinking of you", no "we hope you are well"). State only the facts given and what the user asked to say. Plain paragraphs separated by a blank line.',facts+'\n\nWhat the letter must say: '+V('lt_ai'));$('#lt_b').value=t.trim()}
  catch(e){$('#lt_b').value='';toast('AI error: '+e.message,'bad')}
}
</script>
<script id="js-module-settings">

let SETTAB='biz';
function setS(path,val){const ks=path.split('.');let o=S.settings;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=val;save();if(path.startsWith('biz.'))renderNav()}
function setRow(key,i,k,val,type){
  const arr=key.split('.').reduce((o,x)=>o[x],S.settings);const old=arr[i][k];
  arr[i][k]=type==='number'?(val===''?'':Number(val)):type==='checkbox'?val:val;
  if(key==='categories'&&k==='name'&&old){S.vehicles.forEach(v=>{if(v.category===old)v.category=val});S.settings.models.forEach(m=>{if(m.category===old)m.category=val})}
  save();
}
function listEd(key,cols,newRow){
  const arr=key.split('.').reduce((o,x)=>o[x],S.settings);

    if(c.o)return `<select ${on}>${opts(typeof c.o==='function'?c.o():c.o,v,c.blank??'—')}</select>`;
    if(c.t==='checkbox')return `<input type="checkbox" ${v?'checked':''} ${on}>`;
    return `<input type="${c.t||'text'}" value="${esc(v??'')}" ${c.t==='number'?'step="0.01"':''} ${on} style="${c.w?'width:'+c.w:''}">`};
  return `<div class="tbl"><table><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr>${arr.map((row,i)=>`<tr>${cols.map(c=>`<td>${cell(i,c,row[c.k])}</td>`).join('')}<td><button class="btn sm bad" onclick="${key.split('.').reduce((s,x)=>s+'.'+x,'S.settings')}.splice(${i},1);save();rerender()">×</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="muted">None yet</td></tr>`}</table></div><button class="btn sm" style="margin-top:6px" onclick='${key.split('.').reduce((s,x)=>s+'.'+x,'S.settings')}.push(Object.assign({id:uid()},${JSON.stringify(newRow||{})}));save();rerender()'>+ Add</button>`;
}
function strList(path,label,hint){const arr=path.split('.').reduce((o,x)=>o[x],S.settings);return F(label+(hint?' — '+hint:''),`<textarea rows="6" onchange="setS('${path}',this.value.split('\\n').map(s=>s.trim()).filter(Boolean))">${esc(arr.join('\n'))}</textarea>`)}

PAGES.settings={t:'Settings',r(arg){

   <div><div class="grid g3">${BF('name','Business legal name')}${BF('dba','Trade name (DBA)')}${BF('ein','EIN / tax ID')}${BF('owner','Owner / manager name')}${BF('ownerTitle','Title (e.g. Owner, Manager)')}${BF('letterClosing','Letter closing','text','placeholder="Sincerely,"')}
   ${BF('pobox','P.O. Box','text','placeholder="P.O. Box 1234"')}${BF('cityLine','City, territory, ZIP')}${F('Office village',`<select onchange="setS('biz.village',this.value)">${opts(st.lists.villages,st.biz.village)}</select>`)}
   ${BF('phone','Phone','tel')}${BF('email','Email','email')}${BF('web','Website')}${BF('social','Social media')}${BF('hours','Office hours')}${BF('afterHours','After-hours contact')}</div>
   <h3>Business license (Dept. of Commerce)</h3><div class="grid g3">${BF('licNo','License number')}${BF('licIssue','Issue date','date')}${BF('licExp','Expiry date','date')}</div>

   <div class="grid g2" style="margin-top:8px">${F('File (PDF or photo)',`<input type="file" id="vt_f" accept="application/pdf,image/*">`,'req')}${F('Notes',I('vt_no',''))}</div><button class="btn p" style="margin-top:8px" onclick="vaultAdd()">Upload document</button>

   <p class="muted small">Expiry dates feed the Compliance tab and Dashboard alerts. Files stay on this device — export a backup regularly.</p>`;
  else if(SETTAB==='legal')h=`<div class="grid g3">${F('Policy version',`<input value="${esc(st.legal.version)}" onchange="setS('legal.version',this.value)">`)}${F('Effective date',`<input type="date" value="${st.legal.effective}" onchange="setS('legal.effective',this.value)">`)}<p class="muted small" style="align-self:end">Each agreement records the version the renter signed. Change the version when you change wording.</p></div>

   <p class="note small">The starter clauses are a framework only. Have an American Samoa attorney review your full agreement before use.</p>`;
  else if(SETTAB==='rates')h=`<h3>Categories & rates</h3><p class="muted small">Weekly applies to 7+ days and monthly to 28+ days when cheaper. Deposit is the refundable security deposit.</p>${listEd('categories',[{k:'name',l:'Category'},{k:'daily',l:'Daily $',t:'number',w:'90px'},{k:'weekly',l:'Weekly $',t:'number',w:'90px'},{k:'monthly',l:'Monthly $',t:'number',w:'100px'},{k:'deposit',l:'Deposit $',t:'number',w:'90px'}],{name:'',daily:0,weekly:0,monthly:0,deposit:0})}
   <h3>Makes & models (rate by make/model)</h3><p class="muted small">Leave a model's rates blank to use its category rates.</p>${listEd('models',[{k:'make',l:'Make',o:()=>st.makes},{k:'model',l:'Model'},{k:'category',l:'Category',o:()=>st.categories.map(c=>c.name)},{k:'daily',l:'Daily $',t:'number',w:'90px'},{k:'weekly',l:'Weekly $',t:'number',w:'90px'},{k:'monthly',l:'Monthly $',t:'number',w:'100px'}],{make:'',model:'',category:'',daily:'',weekly:'',monthly:''})}

   <h3>Promo codes</h3>${listEd('promos',[{k:'code',l:'Code'},{k:'pct',l:'% off',t:'number',w:'80px'},{k:'flat',l:'$ off',t:'number',w:'80px'},{k:'expires',l:'Expires',t:'date'}],{code:'',pct:'',flat:'',expires:''})}
   <div class="grid g2">${strList('makes','Vehicle makes','one per line')}${strList('colors','Colors','one per line')}</div>`;

   <h3>Pick-up / return locations & delivery fees</h3>${listEd('locations',[{k:'name',l:'Location'},{k:'fee',l:'Fee $',t:'number',w:'90px'}],{name:'',fee:0})}`;

   <div class="grid g3" style="margin-top:12px">${F('Tax label',`<input value="${esc(P.taxLabel)}" onchange="setS('policy.taxLabel',this.value)">`)}${PF_('taxRate','Tax rate % (default 0)')}${BF('receiptFooter','Receipt footer (your wording)')}</div>
   <p class="muted small">American Samoa's 2% sales tax rule has had its collection suspended; leave tax at 0% unless your accountant or the Tax Office says otherwise.</p>`;

   <h3>Payment plans (A.S.C.A. § 28.1501–28.1503)</h3><div class="grid g4">${PF_('interestPersonalCap','Interest cap — personal %')}${PF_('interestBusinessCap','Interest cap — business %')}${PF_('writingRequiredAbove','Signed writing required above %')}${PF_('planLateFee','Default late fee $')}${PF_('planGraceDays','Grace days')}${PF_('missedToDefault','Late installments before default')}</div>
   <h3>Numbering</h3><div class="grid g4">${F('Agreement prefix',`<input value="${esc(P.agreementPrefix)}" onchange="setS('policy.agreementPrefix',this.value)">`)}${PF_('nextAgreement','Next agreement number')}${PF_('nextReceipt','Next receipt number')}${PF_('nextPlan','Next plan number')}</div>
   <p class="muted small">Agreement, receipt and plan numbers are generated automatically and can be edited. Police report and insurance claim numbers are always typed by hand.</p>
   <h3>Purge old ID images</h3><button class="btn" onclick="purgeIDs()">Delete ID images for customers with no rental in ${P.idPurgeDays} days</button>`;
  else if(SETTAB==='lists')h=`<div class="grid g3">${strList('lists.villages','Villages')}${strList('lists.payMethods','Payment methods','keep "Cash" for change & drawer')}${strList('lists.carriers','Insurance carriers')}${strList('lists.docTypes','Legal document types')}${strList('lists.licTypes','License types','names starting "Foreign" trigger the 30-day rule')}${strList('lists.equipment','Check-out equipment checklist')}</div>`;
  else if(SETTAB==='people')h=`<div class="grid g3">${F('Company size',`<select onchange="setS('people.companySize',this.value)">${opts(SIZES.map(s=>({v:s,l:s+' — '+SIZE_HINT[s]})),st.people.companySize,null)}</select>`)}${F('Lock the screen after no activity for',`<select onchange="setS('people.autoLockMin',Number(this.value))">${opts([{v:0,l:'Never'},{v:5,l:'5 minutes'},{v:10,l:'10 minutes'},{v:15,l:'15 minutes'},{v:30,l:'30 minutes'},{v:60,l:'1 hour'}],st.people.autoLockMin,null)}</select>`)}<div style="align-self:end"><button class="btn" onclick="const n=seedOrg();save();toast(n+' starter record(s) added','ok')">Add missing starter departments, titles & skills</button></div></div>

   <p class="muted small">Everything is stored only in this browser on this device (no login, no server). Export a backup at least weekly and after big changes.</p>`;
  PG().innerHTML=`<div class="card"><div class="row" style="margin-bottom:6px"><div class="tabs" style="flex:1;margin:0">${T.map(([k,l])=>`<a class="${SETTAB===k?'on':''}" onclick="SETTAB='${k}';rerender()">${l}</a>`).join('')}</div><button class="btn p" onclick="persist().then(()=>toast('All settings saved','ok'))">Save settings</button></div><div style="margin-top:14px">${h}</div></div>`;
}};
async function uploadLogo(inp){const f=inp.files[0];if(!f)return;let d=await fileToDataURL(f);if(d.length>350000)d=await resizeImage(f,500,.85);setS('biz.logo',d);rerender()}
async function vaultAdd(){const f=$('#vt_f').files[0];if(!V('vt_t')||!f){toast('Choose a document type and file','bad');return}if(f.size>8e6){toast('File is over 8 MB — scan at lower resolution','bad');return}
  const data=f.type.startsWith('image/')?await resizeImage(f,1600,.8):await fileToDataURL(f);
  S.vault.push({id:uid(),type:V('vt_t'),number:V('vt_n'),issue:V('vt_i'),expiry:V('vt_e'),notes:V('vt_no'),fileName:f.name,mime:f.type,data,uploaded:isoDT()});save();toast('Document saved','ok');rerender()}
function vaultOpen(id){const d=S.vault.find(x=>x.id===id);fetch(d.data).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'))}
function importBackup(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.settings)throw 0;confirmBox('Replace all data on this device with this backup?',()=>{S=mergeDefaults(defaults(),d);if(!S.departments.length&&!S.jobTitles.length)seedOrg();USER=null;save();toast('Backup restored — please sign in','ok');lockNow()})}catch(e){toast('Not a valid backup file','bad')}})}
